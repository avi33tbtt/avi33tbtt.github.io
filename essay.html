<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vibe Rounds - Case Bench — Clinical Reasoning Aid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<!-- File-upload text extraction: pdf.js (PDF) and mammoth.js (Word .docx) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>

<style>
  :root{
    --paper:#F7FAFB;
    --card:#FFFFFF;
    --ink:#0B2530;
    --line:#DCE7EA;
    --line-soft:#E9F1F3;
    --accent:#0891B2;
    --accent-dark:#0A6E85;
    --accent-soft:#E3F4F8;
    --alert:#C2410C;
    --alert-soft:#FCE9DD;
    --muted:#5B7480;
    --tab-inactive:#EEF4F6;
    --radius:10px;
    --body-font:'Inter',sans-serif;
  }

  /* Theme: Minimalist — grayscale, no color pop */
  html[data-theme="minimalist"]{
    --paper:#FFFFFF;
    --card:#FFFFFF;
    --ink:#161616;
    --line:#E4E4E4;
    --line-soft:#F0F0F0;
    --accent:#161616;
    --accent-dark:#000000;
    --accent-soft:#F2F2F2;
    --alert:#B3261E;
    --alert-soft:#F8E7E6;
    --muted:#757575;
    --tab-inactive:#F2F2F2;
    --radius:3px;
    --body-font:'Inter',sans-serif;
  }

  /* Theme: Terminal — Bloomberg-style dark/amber monospace */
  html[data-theme="terminal"]{
    --paper:#000000;
    --card:#0A0A0A;
    --ink:#FFB238;
    --line:#3A2A00;
    --line-soft:#231A00;
    --accent:#FFB238;
    --accent-dark:#FFCB6B;
    --accent-soft:#1C1400;
    --alert:#FF4D3D;
    --alert-soft:#2B0C08;
    --muted:#9C7A32;
    --tab-inactive:#141414;
    --radius:2px;
    --body-font:'IBM Plex Mono',monospace;
  }
  html[data-theme="terminal"] .msg.user .bubble,
  html[data-theme="terminal"] header.top .rx{color:#000;}
  html[data-theme="terminal"] .banner strong{color:#FFCB6B;}
  html[data-theme="terminal"] .card,
  html[data-theme="terminal"] .transcript,
  html[data-theme="terminal"] .msg.assistant .bubble{border-color:var(--line);}

  html{transition:background .15s ease;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--body-font);
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    transition:background .15s ease,color .15s ease,font-family .1s ease;
  }
  ::selection{background:var(--accent-soft);}
  a{color:var(--accent-dark);}

  .wrap{max-width:960px;margin:0 auto;padding:28px 20px 80px;}

  /* header */
  header.top{
    display:flex;align-items:center;justify-content:space-between;
    padding-bottom:18px;margin-bottom:28px;
    flex-wrap:wrap;gap:10px;
  }
  header.top .brand{display:flex;align-items:center;gap:10px;}
  header.top h1{
    font-family:var(--body-font);font-weight:800;
    font-size:24px;margin:0;letter-spacing:-0.02em;color:var(--ink);
  }
  header.top .rx{
    font-family:var(--body-font);font-weight:600;font-size:11.5px;color:#fff;
    background:var(--accent);border-radius:20px;padding:4px 11px;
    letter-spacing:.01em;
  }
  header.top .tagline{font-size:12.5px;color:var(--muted);font-family:var(--body-font);font-weight:500;}

  header.top .top-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;}
  .theme-select{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--tab-inactive);border:1px solid var(--line);color:var(--ink);
    font-family:var(--body-font);font-weight:600;font-size:12px;
    border-radius:999px;padding:6px 30px 6px 12px;cursor:pointer;
    -webkit-appearance:none;appearance:none;
    background-image:url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'%3E%3Cpath fill='%235B7480' d='M1 1l5 5 5-5'/%3E%3C/svg%3E");
    background-repeat:no-repeat;background-position:right 10px center;background-size:10px;
  }
  .theme-select:hover{border-color:var(--accent);}
  .top-links{display:flex;gap:8px;font-family:var(--body-font);}
  .top-links a{
    display:inline-flex;align-items:center;gap:5px;
    font-size:12.5px;font-weight:700;color:var(--accent-dark);
    background:var(--accent-soft);border:1px solid var(--line);
    border-radius:999px;padding:6px 13px;text-decoration:none;
  }
  .top-links a:hover{background:var(--accent);color:#fff;border-color:var(--accent);}
  html[data-theme="terminal"] .top-links a:hover{color:#000;}

  /* section labels */
  .step{margin-bottom:26px;}
  .step-label{
    font-family:var(--body-font);font-size:11.5px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--muted);font-weight:700;
    display:flex;align-items:center;gap:8px;margin-bottom:10px;
  }
  .step-label .num{
    width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;
    display:inline-flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;font-weight:700;
  }
  .step-label.done .num{background:var(--accent-dark);}
  .step-label.collapsible{cursor:pointer;user-select:none;}
  .step-label.collapsible:hover{color:var(--ink);}
  .collapse-arrow{font-size:10px;margin-left:2px;transition:transform .15s ease;color:var(--muted);}
  .step-label.collapsed .collapse-arrow{transform:rotate(-90deg);}
  .card.collapsed{display:none;}

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:20px 22px;
    box-shadow:0 1px 2px rgba(11,37,48,.04), 0 8px 24px -16px rgba(11,37,48,.08);
  }

  textarea, input[type=text], input[type=password], select{
    width:100%;
    font-family:var(--body-font);
    font-size:14px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:9px 11px;
    color:var(--ink);
  }
  textarea:focus, input:focus, select:focus, button:focus-visible{
    outline:2px solid var(--accent);outline-offset:1px;
  }
  textarea{resize:vertical;min-height:90px;line-height:1.5;}
  label{font-size:12.5px;color:var(--muted);display:block;margin-bottom:4px;font-weight:500;}

  .hint{font-size:12px;color:var(--muted);margin-top:6px;}

  .upload-row{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);}
  .upload-row label{margin-bottom:6px;}
  .upload-row input[type=file]{
    width:100%;font-family:var(--body-font);font-size:12.5px;color:var(--muted);
    border:1px dashed var(--line);border-radius:var(--radius);padding:8px 10px;background:var(--paper);
  }
  .upload-row input[type=file]::file-selector-button{
    font-family:var(--body-font);font-weight:600;font-size:12px;color:#fff;
    background:var(--accent);border:none;border-radius:999px;padding:6px 13px;margin-right:10px;cursor:pointer;
  }
  #uploadStatus.ok{color:var(--accent-dark);}
  #uploadStatus.err{color:var(--alert);}

  /* provider tabs — segmented pill control */
  .tabrow{display:flex;gap:4px;background:var(--tab-inactive);padding:4px;border-radius:999px;margin-bottom:16px;width:fit-content;}
  .tabrow .tab{
    font-family:var(--body-font);font-weight:600;font-size:12.5px;
    padding:7px 16px;
    background:transparent;
    border:none;border-radius:999px;
    cursor:pointer;color:var(--muted);
    transition:background .12s,color .12s;
  }
  .tabrow .tab.active{
    background:var(--accent);color:#fff;
  }
  .providerpane{padding:0;background:transparent;}
  .providerpane .row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px;}
  @media(max-width:600px){.providerpane .row{grid-template-columns:1fr;}}
  .key-status{font-size:12px;font-family:var(--body-font);font-weight:500;margin-top:8px;}
  .key-status.ok{color:var(--accent-dark);}
  .key-status.empty{color:var(--muted);}

  details.settings summary{
    cursor:pointer;font-size:12.5px;color:var(--accent-dark);font-weight:600;
    list-style:none;display:flex;align-items:center;gap:6px;
  }
  details.settings summary::-webkit-details-marker{display:none;}
  details.settings summary::before{content:"▸";font-size:10px;}
  details.settings[open] summary::before{content:"▾";}
  details.settings{margin-top:10px;}

  .mode-hint{font-size:12.5px;color:var(--muted);margin:10px 0 12px;}
  .mode-pane{margin-top:2px;}

  .activity.pipeline-tile{position:relative;}
  .order-badge{
    position:absolute;top:-8px;right:-8px;width:22px;height:22px;border-radius:50%;
    background:var(--accent);color:#fff;font-family:var(--body-font);font-weight:700;font-size:11px;
    display:flex;align-items:center;justify-content:center;box-shadow:0 2px 4px rgba(11,37,48,.2);
  }
  .pipeline-order{
    margin-top:14px;font-size:12.5px;color:var(--muted);
    display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  }
  .pipeline-order .chip{
    background:var(--tab-inactive);color:var(--ink);font-weight:600;font-size:12px;
    padding:4px 10px;border-radius:999px;
  }
  .pipeline-order .arrow{color:var(--muted);}
  .pipeline-order .chip-remove{color:var(--muted);text-decoration:none;margin-left:5px;font-weight:700;}
  .pipeline-order .chip-remove:hover{color:var(--alert);}

  /* activity cards */
  .activities{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  @media(max-width:760px){.activities{grid-template-columns:repeat(2,1fr);}}
  .activity{
    background:var(--card);border:1.5px solid var(--line);
    border-radius:var(--radius);
    padding:15px 14px;cursor:pointer;transition:border-color .12s, box-shadow .12s, transform .06s;
    text-align:left;font-family:var(--body-font);
    box-shadow:0 1px 2px rgba(11,37,48,.04);
  }
  .activity:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:0 6px 16px -8px rgba(8,145,178,.35);}
  .activity.selected{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 6px 16px -8px rgba(8,145,178,.35);}
  .activity .aname{font-weight:700;font-size:13.5px;margin-bottom:4px;color:var(--ink);}
  .activity .adesc{font-size:11.5px;color:var(--muted);line-height:1.4;}

  /* workspace */
  #workspace{margin-top:30px;display:none;}
  #workspace.visible{display:block;}
  .ws-header{
    display:flex;justify-content:space-between;align-items:center;
    padding-bottom:12px;margin-bottom:14px;
  }
  .ws-header .wtitle{font-family:var(--body-font);font-size:18px;font-weight:800;color:var(--ink);}
  .ws-header .wsub{font-size:12px;color:var(--muted);font-family:var(--body-font);font-weight:500;}
  .ws-actions button{margin-left:8px;}
  .ws-progress{margin-top:8px;display:flex;align-items:center;gap:8px;}
  .ws-progress-bar{width:140px;height:6px;border-radius:999px;background:var(--tab-inactive);overflow:hidden;flex-shrink:0;}
  .ws-progress-fill{height:100%;background:var(--accent);border-radius:999px;transition:width .25s ease;width:0%;}
  .ws-progress-label{font-size:11.5px;color:var(--muted);font-weight:600;white-space:nowrap;}

  @media(max-width:600px){
    header.top h1{font-size:20px;}
    .ws-header{flex-direction:column;align-items:flex-start;gap:10px;}
    .ws-actions{display:flex;flex-wrap:wrap;gap:8px;}
    .ws-actions button{margin-left:0;}
    .pipeline-picker > div{flex-direction:column;}
    .pipeline-picker select{width:100%;}
    .composer{flex-direction:column;align-items:stretch;}
    .msg{max-width:100%;}
  }

  .transcript{
    border:1px solid var(--line);border-radius:var(--radius);
    background:var(--card);
    box-shadow:0 1px 2px rgba(11,37,48,.04), 0 8px 24px -16px rgba(11,37,48,.08);
    min-height:120px;max-height:520px;overflow-y:auto;
    padding:16px;margin-bottom:12px;
  }
  .msg{margin-bottom:16px;max-width:88%;}
  .msg.user{margin-left:auto;}
  .msg .who{font-family:var(--body-font);font-size:10.5px;text-transform:uppercase;font-weight:700;letter-spacing:.05em;color:var(--muted);margin-bottom:4px;}
  .msg.user .who{text-align:right;}

  /* text-to-speech control on assistant answers */
  .who-row{display:flex;align-items:center;gap:6px;margin-bottom:4px;}
  .who-row .who{margin-bottom:0;}
  .tts-btn{
    display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;
    width:20px;height:20px;padding:0;
    background:transparent;color:var(--muted);
    border:1px solid transparent;border-radius:50%;
    cursor:pointer;transition:background .12s ease,color .12s ease;
  }
  .tts-btn:hover{background:var(--accent-soft);color:var(--accent-dark);}
  .tts-btn svg{width:12px;height:12px;display:block;}
  .tts-btn.speaking{background:var(--accent-soft);color:var(--accent-dark);border-color:var(--line);}
  .tts-btn.speaking .tts-wave-1{animation:ttsPulse 1s ease-in-out infinite;}
  .tts-btn.speaking .tts-wave-2{animation:ttsPulse 1s ease-in-out infinite .18s;}
  @keyframes ttsPulse{0%,100%{opacity:.3;}50%{opacity:1;}}
  @media(prefers-reduced-motion:reduce){
    .tts-btn.speaking .tts-wave-1,.tts-btn.speaking .tts-wave-2{animation:none;opacity:1;}
  }

  .msg .bubble{
    padding:11px 14px;border-radius:12px;font-size:14px;line-height:1.55;white-space:pre-wrap;
  }
  .msg.assistant .bubble{background:var(--accent-soft);border:1px solid #cdeaf0;border-top-left-radius:4px;}
  .msg.user .bubble{background:var(--accent);color:#fff;border-top-right-radius:4px;}
  .msg.system .bubble{background:transparent;border:1px dashed var(--line);color:var(--muted);font-style:italic;font-size:12.5px;border-radius:8px;}

  .composer{display:flex;gap:8px;align-items:flex-end;}
  .composer textarea{min-height:56px;flex:1;}

  button{
    font-family:var(--body-font);font-weight:700;font-size:13px;
    background:var(--accent);color:#fff;border:none;
    border-radius:999px;padding:10px 18px;cursor:pointer;
    transition:background .12s, transform .06s;
  }
  button:hover{background:var(--accent-dark);}
  button.secondary{background:transparent;color:var(--muted);border:1.5px solid var(--line);}
  button.secondary:hover{background:var(--tab-inactive);color:var(--ink);border-color:var(--line);}
  button:disabled{opacity:.5;cursor:not-allowed;}

  .banner{
    font-size:12.5px;color:var(--ink);border:1px solid var(--line-soft);
    background:var(--accent-soft);padding:11px 14px;border-radius:var(--radius);margin-bottom:24px;
  }
  .banner strong{color:var(--accent-dark);}

  .error-note{font-size:12.5px;color:var(--alert);background:var(--alert-soft);border:1px solid #f0c8ac;border-radius:var(--radius);padding:9px 12px;margin-bottom:10px;display:none;}
  .error-note.show{display:block;}

  .typing{font-family:var(--body-font);font-size:12px;color:var(--muted);font-weight:500;}
  .typing::after{content:'';animation:dots 1.2s steps(4,end) infinite;}
  @keyframes dots{0%{content:'';}25%{content:'.';}50%{content:'..';}75%{content:'...';}}

  footer{margin-top:50px;font-size:11.5px;color:var(--muted);text-align:center;font-family:var(--body-font);font-weight:500;}

  .contact-card{
    margin-top:36px;
    border:1px solid var(--line);
    background:var(--card);
    border-radius:var(--radius);
    padding:18px 20px;
    text-align:center;
    box-shadow:0 1px 2px rgba(11,37,48,.04);
  }
  .contact-card p{margin:0;font-size:13px;color:var(--muted);line-height:1.6;}
  .contact-card a{color:var(--accent-dark);font-weight:600;text-decoration:none;}
  .contact-card a:hover{text-decoration:underline;}

  .legal-note{
    margin-top:16px;
    font-size:11.5px;color:var(--muted);text-align:center;
    line-height:1.6;font-family:var(--body-font);
  }
  .legal-note em{font-style:italic;}
  .legal-note a{color:var(--muted);text-decoration:underline;}
  .legal-note a:hover{color:var(--accent-dark);}

  .contribute-card{
    margin-top:16px;
    border:1px dashed var(--line);
    background:var(--accent-soft);
    border-radius:var(--radius);
    padding:18px 20px;
    text-align:center;
  }
  .contribute-card h3{
    margin:0 0 6px;font-size:13.5px;font-weight:700;color:var(--ink);
    font-family:var(--body-font);
  }
  .contribute-card p{
    margin:0 0 12px;font-size:12.5px;color:var(--muted);
    line-height:1.6;font-family:var(--body-font);max-width:560px;
    margin-left:auto;margin-right:auto;
  }
  .contribute-card label.consent{
    display:flex;align-items:flex-start;gap:7px;justify-content:center;
    font-size:12px;color:var(--muted);margin:0 0 12px;text-align:left;
    max-width:520px;margin-left:auto;margin-right:auto;font-weight:500;
  }
  .contribute-card label.consent input{margin-top:2px;flex-shrink:0;}
  .contribute-btn{
    font-family:var(--body-font);font-weight:700;font-size:13px;
    background:var(--accent);color:#fff;border:none;border-radius:999px;
    padding:9px 22px;cursor:pointer;transition:background .12s;
  }
  .contribute-btn:hover:not(:disabled){background:var(--accent-dark);}
  .contribute-btn:disabled{opacity:.6;cursor:default;}
  .contribute-status{
    font-size:12px;font-weight:600;margin-top:10px;font-family:var(--body-font);min-height:16px;
  }
  .contribute-status.ok{color:var(--accent-dark);}
  .contribute-status.err{color:var(--alert);}
</style>
</head>
<body>
<div class="wrap">

  <div class="brand-bar" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;">
    <div style="font-family:var(--body-font);font-weight:800;font-size:16px;color:var(--ink);display:flex;align-items:center;gap:6px;">
      <span style="background:var(--accent);color:#fff;border-radius:6px;padding:2px 8px;font-size:13px;">Avi</span>
    </div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
      <button class="secondary" id="downloadBtn" type="button" style="font-size:12px;padding:6px 13px;">Download .txt</button>
      <button class="secondary" id="resetBtn" type="button" style="font-size:12px;padding:6px 13px;">Reset</button>
      <select id="themeSelect" class="theme-select" aria-label="Theme">
        <option value="simple">Simple</option>
        <option value="minimalist">Minimalist</option>
        <option value="terminal">Terminal</option>
      </select>
    </div>
  </div>

  <!-- STEP 1: MODEL -->
  <div class="step">
    <div class="step-label collapsible" id="label-model"><span class="num">1</span>Model<span class="collapse-arrow" id="arrow-model">&#9662;</span></div>
    <div class="card" id="card-model">
      <div class="tabrow" id="providerTabs">
        <div class="tab active" data-provider="claude">Claude</div>
        <div class="tab" data-provider="gemini">Gemini</div>
        <div class="tab" data-provider="openai">ChatGPT</div>
        <div class="tab" data-provider="other">Other</div>
      </div>
      <div class="providerpane">
        <div class="row" id="endpointRow" style="display:none;">
          <div style="grid-column:1/-1;">
            <label for="apiEndpoint">API endpoint (OpenAI-compatible chat/completions URL)</label>
            <input type="text" id="apiEndpoint" placeholder="https://api.groq.com/openai/v1/chat/completions">
          </div>
        </div>
        <div class="row">
          <div>
            <label id="apiKeyLabel" for="apiKey">Claude API key</label>
            <input type="password" id="apiKey" placeholder="sk-ant-...">
          </div>
          <div>
            <label for="modelName">Model name</label>
            <input type="text" id="modelName" placeholder="claude-sonnet-4-6">
          </div>
        </div>
        <div class="key-status empty" id="keyStatus">No key saved for this provider yet.</div>
        <details class="settings">
          <summary>Where do I get a key?</summary>
          <div class="hint" style="margin-top:8px;" id="keyHelp"></div>
        </details>
      </div>
    </div>
  </div>

  <!-- STEP 2: TOPIC -->
  <div class="step">
    <div class="step-label collapsible" id="label-case"><span class="num">2</span>Case / Topic<span class="collapse-arrow" id="arrow-case">&#9662;</span></div>
    <div class="card" id="card-case">
      <label for="caseText">Enter a case, scenario, stock name, celebrity, event, or anything else you'd like to explore</label>
      <textarea id="caseText" placeholder="e.g. 'A patient presents with...', 'Tesla stock', 'Marie Curie', 'the fall of the Berlin Wall'..."></textarea>
      <div class="hint">
        <a href="#" id="randomBtn" style="font-weight:600;color:var(--accent-dark);text-decoration:none;">&#127922; Generate randomly &#8594;</a>
      </div>
    </div>
  </div>
  <!-- STEP 3: ESSAY & CHAT -->
  <div class="step">
    <div class="step-label collapsible" id="label-essay"><span class="num">3</span>Essay<span class="collapse-arrow" id="arrow-essay">&#9662;</span></div>
    <div class="card" id="card-essay">
      <div style="display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin-bottom:14px;padding-bottom:14px;border-bottom:1px dashed var(--line);">
        <label style="display:flex;align-items:center;gap:6px;margin:0;font-weight:600;color:var(--ink);">
          <input type="checkbox" id="ttsToggle" checked style="width:auto;">
          Read aloud
        </label>
        <label style="margin:0;display:flex;align-items:center;gap:6px;">
          Voice:
          <select id="ttsLang" style="width:auto;padding:4px 8px;">
            <option value="en">English</option>
            <option value="hi">Hindi</option>
          </select>
        </label>
      </div>
      <button id="generateEssayBtn" class="contribute-btn" type="button">Generate essay</button>
      <div id="moreOptions" style="display:none;margin-top:10px;gap:8px;flex-wrap:wrap;">
        <button class="secondary" id="simplerBtn" type="button">Simplify further</button>
        <button class="secondary" id="longerBtn" type="button">Make it longer</button>
        <button class="secondary" id="angleBtn" type="button">Different angle</button>
      </div>
      <div id="essayNote" class="hint" style="display:none;color:var(--alert);"></div>
      <div id="essayTranscript" style="margin-top:14px;"></div>

      <div id="chatRow" style="display:none;margin-top:16px;padding-top:16px;border-top:1px dashed var(--line);">
        <label for="chatInput">Ask a follow-up question</label>
        <div style="display:flex;gap:8px;">
          <textarea id="chatInput" style="min-height:44px;flex:1;" placeholder="e.g. 'why did that matter?' or 'what happened next?'"></textarea>
          <button id="chatSendBtn" type="button" style="align-self:flex-end;">Send</button>
        </div>
      </div>
    </div>
  </div>

  <!-- KEY INSIGHTS -->
  <div class="step" id="insightsStep" style="display:none;">
    <div class="step-label" id="label-insights"><span class="num">&#9733;</span>Key insights</div>
    <div class="card" id="card-insights">
      <ul id="insightsList" style="margin:0;padding-left:20px;"></ul>
    </div>
  </div>

</div>

<script>
const $ = (id) => document.getElementById(id);
const PROVIDERS = {
  claude:{label:'Claude', keyPlaceholder:'sk-ant-...', modelPlaceholder:'claude-sonnet-4-6', needsEndpoint:false, help:'Get a key at console.anthropic.com &rarr; API Keys.'},
  gemini:{label:'Gemini', keyPlaceholder:'AIza...', modelPlaceholder:'gemini-2.5-flash', needsEndpoint:false, help:'Get a key at aistudio.google.com &rarr; Get API key.'},
  openai:{label:'ChatGPT', keyPlaceholder:'sk-...', modelPlaceholder:'gpt-4o', needsEndpoint:false, help:'Get a key at platform.openai.com &rarr; API Keys.'},
  other:{label:'Other', keyPlaceholder:'(if required)', modelPlaceholder:'model-name', needsEndpoint:true, help:'Enter any OpenAI-compatible chat/completions endpoint (e.g. a local or self-hosted model).'}
};
const state = { provider:'claude', messages:[], insights:[], ttsEnabled:true, ttsLang:'en' };

const TTS_LOCALES = { en:'en-US', hi:'hi-IN' };
let ttsVoices = [];
function loadVoices(){ ttsVoices = window.speechSynthesis ? window.speechSynthesis.getVoices() : []; }
if(window.speechSynthesis){
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
}
function speak(text){
  if(!state.ttsEnabled || !window.speechSynthesis || !text) return;
  window.speechSynthesis.cancel();
  const locale = TTS_LOCALES[state.ttsLang] || 'en-US';
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = locale;
  const match = ttsVoices.find(v => v.lang === locale) || ttsVoices.find(v => v.lang && v.lang.startsWith(state.ttsLang));
  if(match) utter.voice = match;
  window.speechSynthesis.speak(utter);
}
$('ttsToggle').addEventListener('change', (e)=>{
  state.ttsEnabled = e.target.checked;
  if(!state.ttsEnabled && window.speechSynthesis) window.speechSynthesis.cancel();
});
$('ttsLang').addEventListener('change', (e)=>{ state.ttsLang = e.target.value; });

function loadKeys(){ try{ return JSON.parse(localStorage.getItem('casebench_keys')||'{}'); }catch(e){ return {}; } }
function saveKeys(k){ localStorage.setItem('casebench_keys', JSON.stringify(k)); }
function loadModels(){ try{ return JSON.parse(localStorage.getItem('casebench_models')||'{}'); }catch(e){ return {}; } }
function saveModels(m){ localStorage.setItem('casebench_models', JSON.stringify(m)); }
function loadEndpoints(){ try{ return JSON.parse(localStorage.getItem('casebench_endpoints')||'{}'); }catch(e){ return {}; } }
function saveEndpoints(e){ localStorage.setItem('casebench_endpoints', JSON.stringify(e)); }

function renderProviderPane(){
  const p = PROVIDERS[state.provider];
  $('apiKeyLabel').textContent = p.label + ' API key';
  $('apiKey').placeholder = p.keyPlaceholder;
  $('modelName').placeholder = p.modelPlaceholder;
  $('keyHelp').innerHTML = p.help;
  $('endpointRow').style.display = p.needsEndpoint ? '' : 'none';
  const keys = loadKeys(), models = loadModels(), endpoints = loadEndpoints();
  $('apiKey').value = keys[state.provider] || '';
  $('modelName').value = models[state.provider] || '';
  $('apiEndpoint').value = endpoints[state.provider] || '';
  const hasKey = !!keys[state.provider] || state.provider === 'other';
  $('keyStatus').textContent = keys[state.provider] ? 'Key saved for ' + p.label + '.' : 'No key saved for this provider yet.';
  $('keyStatus').className = 'key-status ' + (keys[state.provider] ? '' : 'empty');
}
document.querySelectorAll('#providerTabs .tab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    document.querySelectorAll('#providerTabs .tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    state.provider = tab.dataset.provider;
    renderProviderPane();
  });
});
$('apiKey').addEventListener('input', ()=>{ const k = loadKeys(); k[state.provider] = $('apiKey').value.trim(); saveKeys(k); });
$('modelName').addEventListener('input', ()=>{ const m = loadModels(); m[state.provider] = $('modelName').value.trim(); saveModels(m); });
$('apiEndpoint').addEventListener('input', ()=>{ const e = loadEndpoints(); e[state.provider] = $('apiEndpoint').value.trim(); saveEndpoints(e); });
renderProviderPane();

/* ---------- model calls ---------- */
async function callClaude(apiKey, model, system, msgs){
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body: JSON.stringify({ model, max_tokens:4096, system, messages: msgs.map(m=>({role:m.role, content:m.content})) })
  });
  if(!res.ok){ const t = await res.text(); throw new Error(res.status + ' ' + t.slice(0,200)); }
  const data = await res.json();
  return (data.content||[]).map(b=>b.text||'').join('\n').trim();
}
async function callGemini(apiKey, model, system, msgs){
  const contents = msgs.map(m=>({role: m.role==='assistant'?'model':'user', parts:[{text:m.content}]}));
  const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(apiKey)}`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ systemInstruction:{parts:[{text:system}]}, contents, generationConfig:{maxOutputTokens:4096} })
  });
  if(!res.ok){ const t = await res.text(); throw new Error(res.status + ' ' + t.slice(0,200)); }
  const data = await res.json();
  const cand = data.candidates && data.candidates[0];
  const parts = cand && cand.content && cand.content.parts || [];
  return parts.map(p=>p.text||'').join('\n').trim();
}
async function callOpenAI(apiKey, model, system, msgs){
  const messages = [{role:'system', content:system}].concat(msgs);
  const res = await fetch('https://api.openai.com/v1/chat/completions', {
    method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+apiKey},
    body: JSON.stringify({ model, messages, max_tokens:4096 })
  });
  if(!res.ok){ const t = await res.text(); throw new Error(res.status + ' ' + t.slice(0,200)); }
  const data = await res.json();
  return (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content || '').trim();
}
async function callCustom(endpoint, apiKey, model, system, msgs){
  if(!endpoint) throw new Error('No API endpoint set for this provider.');
  const messages = [{role:'system', content:system}].concat(msgs);
  const headers = {'Content-Type':'application/json'};
  if(apiKey) headers['Authorization'] = 'Bearer ' + apiKey;
  const res = await fetch(endpoint, { method:'POST', headers, body: JSON.stringify({ model, messages, max_tokens:4096 }) });
  if(!res.ok){ const t = await res.text(); throw new Error(res.status + ' ' + t.slice(0,200)); }
  const data = await res.json();
  if(data.choices && data.choices[0] && data.choices[0].message) return (data.choices[0].message.content||'').trim();
  if(data.message && data.message.content) return data.message.content.trim();
  if(typeof data.content === 'string') return data.content.trim();
  return JSON.stringify(data).slice(0,500);
}
async function callModel(system, msgs){
  const keys = loadKeys(), models = loadModels();
  const apiKey = keys[state.provider];
  const model = models[state.provider] || PROVIDERS[state.provider].modelPlaceholder;
  if(state.provider === 'claude') return callClaude(apiKey, model, system, msgs);
  if(state.provider === 'gemini') return callGemini(apiKey, model, system, msgs);
  if(state.provider === 'other'){ const endpoints = loadEndpoints(); return callCustom(endpoints['other'], apiKey, model, system, msgs); }
  return callOpenAI(apiKey, model, system, msgs);
}

/* ---------- essay + insights ---------- */
const SYSTEM_PROMPT = "You explain topics — clinical cases, companies, people, historical events, anything — with deep insight but in plain, simple language a curious non-expert would enjoy. When asked for an essay, write exactly two paragraphs. After your main answer, always add a new line with exactly '@@INSIGHTS@@' followed by 2-3 short bullet points (each starting with '- ') giving fresh, non-obvious key insights that haven't been stated yet in the conversation. Never repeat an insight already given earlier in the conversation.";

function getSystemPrompt(){
  const langLine = state.ttsLang === 'hi' ? " Respond entirely in Hindi (Devanagari script)." : "";
  return SYSTEM_PROMPT + langLine;
}

function splitInsights(raw){
  const marker = '@@INSIGHTS@@';
  const idx = raw.indexOf(marker);
  if(idx === -1) return { main: raw.trim(), bullets: [] };
  const main = raw.slice(0, idx).trim();
  const rest = raw.slice(idx + marker.length);
  const bullets = rest.split('\n').map(l=>l.replace(/^[\s\-\*]+/, '').trim()).filter(Boolean);
  return { main, bullets };
}
function addInsights(bullets){
  if(!bullets.length) return;
  bullets.forEach(b=>{ if(!state.insights.includes(b)) state.insights.push(b); });
  $('insightsList').innerHTML = state.insights.map(b=>`<li>${b}</li>`).join('');
  $('insightsStep').style.display = state.insights.length ? '' : 'none';
}
function appendBubble(role, text){
  const div = document.createElement('div');
  div.style.marginBottom = '14px';
  div.style.padding = '12px 14px';
  div.style.borderRadius = 'var(--radius)';
  div.style.border = '1px solid var(--line)';
  div.style.background = role === 'user' ? 'var(--accent-soft)' : 'var(--card)';
  div.style.whiteSpace = 'pre-wrap';
  div.textContent = text;
  $('essayTranscript').appendChild(div);
  div.scrollIntoView({behavior:'smooth', block:'end'});
  if(role === 'assistant') speak(text);
}

async function runTurn(userText, btn){
  const topic = $('caseText').value.trim();
  if(!topic){ $('essayNote').textContent = 'Enter a case or topic first.'; $('essayNote').style.display=''; return; }
  $('essayNote').style.display = 'none';
  const keys = loadKeys();
  if(state.provider !== 'other' && !keys[state.provider]){ $('essayNote').textContent = 'Add an API key for ' + PROVIDERS[state.provider].label + ' in Step 1.'; $('essayNote').style.display=''; return; }

  if(btn){ btn.disabled = true; btn.dataset._label = btn.textContent; btn.textContent = 'Working...'; }
  if(!state.messages.length) state.messages.push({role:'user', content:`Topic: ${topic}`});
  state.messages.push({role:'user', content:userText});
  appendBubble('user', userText);
  try{
    const raw = await callModel(getSystemPrompt(), state.messages);
    const { main, bullets } = splitInsights(raw);
    state.messages.push({role:'assistant', content:raw});
    appendBubble('assistant', main);
    addInsights(bullets);
    $('moreOptions').style.display = 'flex';
    $('chatRow').style.display = '';
  }catch(err){
    $('essayNote').textContent = 'Request failed: ' + err.message;
    $('essayNote').style.display = '';
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = btn.dataset._label; }
  }
}

$('generateEssayBtn').addEventListener('click', ()=>{
  state.messages = [];
  $('essayTranscript').innerHTML = '';
  runTurn('Write a two-paragraph essay about this topic with deep insights, in simple language.', $('generateEssayBtn'));
});
$('simplerBtn').addEventListener('click', ()=> runTurn('Rewrite that in even simpler language, still two paragraphs.', $('simplerBtn')));
$('longerBtn').addEventListener('click', ()=> runTurn('Expand this with more depth and detail.', $('longerBtn')));
$('angleBtn').addEventListener('click', ()=> runTurn('Cover this from a different, less obvious angle.', $('angleBtn')));
$('chatSendBtn').addEventListener('click', ()=>{
  const val = $('chatInput').value.trim();
  if(!val) return;
  $('chatInput').value = '';
  runTurn(val, $('chatSendBtn'));
});
$('chatInput').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); $('chatSendBtn').click(); }
});

const RANDOM_TOPICS = [
  'The Library of Alexandria',
  'Tesla, Inc. (TSLA) stock',
  'Marie Curie',
  'The fall of the Berlin Wall, 1989',
  'The Antikythera mechanism',
  'Cleopatra VII',
  'The 2008 financial crisis',
  'Nikola Tesla',
  'The Voyager Golden Record',
  'Bitcoin',
  'The eruption of Mount Vesuvius, 79 AD',
  'Amelia Earhart',
  'The signing of the Magna Carta, 1215',
  'GameStop (GME) short squeeze, 2021',
  'The Rosetta Stone',
  'Albert Einstein',
  'The moon landing, 1969',
  'Genghis Khan',
  'The invention of the printing press',
  'NVIDIA (NVDA) stock',
  'The Chernobyl disaster',
  'Cleopatra\'s Needle',
  'Leonardo da Vinci',
  'The Great Fire of London, 1666',
  'The discovery of penicillin',
  'Elon Musk',
  'The Cuban Missile Crisis',
  'Ada Lovelace',
  'The construction of the Great Pyramid of Giza',
  'The COVID-19 pandemic',
  'Taylor Swift',
  'The Wright brothers\' first flight, 1903',
  'The fall of the Roman Empire',
  'Apple Inc. (AAPL) stock',
  'The Manhattan Project',
  'Cleopatra and the Battle of Actium',
  'The Dutch Tulip Mania, 1637',
  'Nelson Mandela',
  'The Black Death',
  'The first email ever sent'
];

$('randomBtn') && $('randomBtn').addEventListener('click', (e)=>{
  e.preventDefault();
  const pick = RANDOM_TOPICS[Math.floor(Math.random() * RANDOM_TOPICS.length)];
  $('caseText').value = pick;
});

const VALID_THEMES = ['simple', 'minimalist', 'terminal'];
function applyTheme(theme){
  if(!VALID_THEMES.includes(theme)) theme = 'simple';
  document.documentElement.setAttribute('data-theme', theme);
  if($('themeSelect')) $('themeSelect').value = theme;
}
function initTheme(){
  let saved = null;
  try{ saved = localStorage.getItem('casebench_theme'); }catch(e){}
  applyTheme(saved || 'simple');
}
initTheme();
$('themeSelect') && $('themeSelect').addEventListener('change', (e)=>{
  const next = e.target.value;
  applyTheme(next);
  try{ localStorage.setItem('casebench_theme', next); }catch(e){}
});

/* ---------- collapsible sections ---------- */
function toggleCollapse(key){
  const label = $('label-' + key);
  const card = $('card-' + key);
  if(!label || !card) return;
  const collapsed = label.classList.toggle('collapsed');
  card.classList.toggle('collapsed', collapsed);
}
['model','case','essay'].forEach(key=>{
  const label = $('label-' + key);
  if(label) label.addEventListener('click', ()=> toggleCollapse(key));
});

/* ---------- reset ---------- */
$('resetBtn') && $('resetBtn').addEventListener('click', ()=>{
  if(!confirm('Reset the case, essay, chat, and insights? Your saved API keys and theme will be kept.')) return;
  state.messages = [];
  state.insights = [];
  $('caseText').value = '';
  $('essayTranscript').innerHTML = '';
  $('insightsList').innerHTML = '';
  $('insightsStep').style.display = 'none';
  $('essayNote').style.display = 'none';
  $('moreOptions').style.display = 'none';
  $('chatRow').style.display = 'none';
  $('chatInput').value = '';
  if(window.speechSynthesis) window.speechSynthesis.cancel();
});

/* ---------- download as text file ---------- */
$('downloadBtn') && $('downloadBtn').addEventListener('click', ()=>{
  const topic = $('caseText').value.trim();
  let out = '';
  if(topic) out += 'Topic: ' + topic + '\n\n';
  if(state.messages.length){
    state.messages.forEach(m=>{
      const label = m.role === 'user' ? 'You' : 'Assistant';
      out += label + ':\n' + m.content + '\n\n';
    });
  }
  if(state.insights.length){
    out += 'Key insights:\n';
    state.insights.forEach(b=>{ out += '- ' + b + '\n'; });
    out += '\n';
  }
  if(!out.trim()){ out = 'Nothing to download yet — generate an essay first.'; }
  const blob = new Blob([out], {type:'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const safeTopic = (topic || 'case-bench').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 50) || 'case-bench';
  a.download = safeTopic + '.txt';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});
</script>
</body>
</html>
