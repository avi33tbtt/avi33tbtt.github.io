<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>COPD Explorer</title>
<script src="https://unpkg.com/cytoscape/dist/cytoscape.min.js"></script>
<style>html,body,#cy{margin:0;width:100%;height:100%;} </style>
</head><body><div id="cy"></div>
<script>
fetch('copd-data.json').then(r=>r.json()).then(data=>{
const els=[];
data.nodes.forEach(n=>els.push({data:{id:n.id,label:n.label}}));
data.edges.forEach(e=>els.push({data:{source:e.source,target:e.target,label:e.relation}}));
cytoscape({container:document.getElementById('cy'),
elements:els,
style:[
{selector:'node',style:{label:'data(label)','background-color':'#2196f3','text-wrap':'wrap','text-max-width':120}},
{selector:'edge',style:{label:'data(label)','curve-style':'bezier','target-arrow-shape':'triangle'}}
],
layout:{name:'cose'}});
});
</script></body></html>
