<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentation</title>
    <!-- This stylesheet provides the clean GitHub Markdown look -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.0/github-markdown.min.css">
    <style>
        body {
            box-sizing: border-box;
            min-width: 200px;
            max-width: 980px;
            margin: 0 auto;
            padding: 45px;
        }
        @media (max-width: 767px) {
            body { padding: 15px; }
        }
    </style>
</head>
<body class="markdown-body">

    <!-- The markdown content will load inside this container -->
    <div id="content">Loading documentation...</div>

    <!-- Markdown Parser Script -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        // 1. Get the page name from the URL (?page=filename.md). Default to README.md
        const urlParams = new URLSearchParams(window.location.search);
        let targetPage = urlParams.get('page') || 'README.md';

        // 2. Set the exact folder path (Case-sensitive matching your 'Prompts' folder)
        const folderPath = '';

        // 3. Configure the markdown parser for clean formatting and line breaks
        marked.setOptions({
            breaks: true,
            gfm: true
        });

        // 4. Fetch the file and inject it into the page
        fetch(folderPath + targetPage)
            .then(response => {
                if (!response.ok) throw new Error('Page not found');
                return response.text();
            })
            .then(text => {
                // Convert markdown text to styled HTML
                document.getElementById('content').innerHTML = marked.parse(text);
                
                // Set the browser tab title to the name of the current file
                document.title = targetPage.replace('.md', '').toUpperCase();
            })
            .catch(err => {
                document.getElementById('content').innerHTML = `
                    <h2>404: Page Not Found</h2>
                    <p>Could not locate: <code>${folderPath}${targetPage}</code></p>
                    <p><a href="?page=README.md">← Back to Safety (Home)</a></p>
                `;
            });
    </script>
</body>
</html>
