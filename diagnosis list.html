<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Level Bench — Diagnostic Complexity Ladder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4faf9;
    --panel:#ffffff;
    --ink:#0e2a2b;
    --sub:#4d6b6b;
    --cyan:#0891a8;
    --cyan-deep:#066678;
    --teal:#0f766e;
    --line:#dcebe9;
    --l1:#7cc6c9;
    --l2:#4fb3ac;
    --l3:#2b9d94;
    --l4:#e08a3c;
    --l5:#c0392b;
    --radius:16px;
    --shadow:0 8px 24px rgba(9,60,63,0.08);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    padding:48px 20px 80px;
  }
  .wrap{max-width:1080px;margin:0 auto;}
  header{margin-bottom:32px;}
  .kicker{
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--cyan-deep);
    margin-bottom:10px;
  }
  h1{
    font-family:'Fraunces',serif;
    font-size:36px;
    font-weight:600;
    margin:0 0 12px;
    line-height:1.15;
  }
  .lede{
    font-size:15.5px;
    color:var(--sub);
    max-width:660px;
    line-height:1.6;
  }

  .controls{
    display:flex;
    flex-wrap:wrap;
    gap:24px;
    align-items:flex-end;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:22px 24px;
    margin:32px 0 8px;
  }
  .field{display:flex;flex-direction:column;gap:8px;min-width:220px;}
  .field label{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--sub);
  }
  select{
    font-family:'Inter',sans-serif;
    font-size:14.5px;
    font-weight:500;
    color:var(--ink);
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 12px;
    cursor:pointer;
    outline:none;
    transition:border-color .15s;
  }
  select:focus{border-color:var(--cyan);}

  .level-pills{display:flex;gap:8px;flex-wrap:wrap;}
  .pill{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:.03em;
    padding:8px 14px;
    border-radius:20px;
    border:1px solid var(--line);
    background:var(--bg);
    color:var(--sub);
    cursor:pointer;
    user-select:none;
    transition:all .15s;
  }
  .pill.active{
    color:#fff;
    border-color:transparent;
    background:var(--accent, var(--cyan));
  }
  .pill[data-level="1"]{--accent:var(--l1);}
  .pill[data-level="2"]{--accent:var(--l2);}
  .pill[data-level="3"]{--accent:var(--l3);}
  .pill[data-level="4"]{--accent:var(--l4);}
  .pill[data-level="5"]{--accent:var(--l5);}

  .count{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--sub);
    margin:18px 2px 14px;
  }

  .results{display:flex;flex-direction:column;gap:12px;}
  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-left:6px solid var(--accent);
    border-radius:14px;
    box-shadow:var(--shadow);
    padding:18px 22px;
    display:flex;
    flex-direction:column;
    gap:10px;
    position:relative;
  }
  .card .tags{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }
  .card .badge{
    display:inline-block;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:#fff;
    background:var(--accent);
    padding:3px 10px;
    border-radius:20px;
    white-space:nowrap;
  }
  .card .sys{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--sub);
    text-transform:uppercase;
    letter-spacing:.05em;
    border:1px solid var(--line);
    padding:3px 10px;
    border-radius:20px;
    white-space:nowrap;
  }
  .card .dx{padding-right:36px;}
  .card .dx b{font-size:15.5px;font-weight:600;display:block;}
  .card .dx span.note{display:block;color:var(--sub);font-size:12.5px;margin-top:4px;line-height:1.5;}

  .copy-btn{
    position:absolute;
    top:14px;
    right:14px;
    width:30px;
    height:30px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:8px;
    color:var(--sub);
    cursor:pointer;
    transition:all .15s;
    padding:0;
  }
  .copy-btn:hover{
    background:var(--panel);
    border-color:var(--accent);
    color:var(--accent);
  }
  .copy-btn svg{width:15px;height:15px;pointer-events:none;}
  .copy-btn.copied{
    color:#fff;
    background:var(--accent);
    border-color:var(--accent);
  }
  .copy-btn .icon-check{display:none;}
  .copy-btn.copied .icon-copy{display:none;}
  .copy-btn.copied .icon-check{display:block;}

  .empty{
    text-align:center;
    color:var(--sub);
    font-size:14px;
    padding:48px 0;
    font-family:'IBM Plex Mono',monospace;
    border:1px dashed var(--line);
    border-radius:var(--radius);
    background:var(--panel);
  }

  footer{
    margin-top:44px;
    font-size:12.5px;
    color:var(--sub);
    font-family:'IBM Plex Mono',monospace;
    border-top:1px solid var(--line);
    padding-top:18px;
  }


</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">VibeRounds · Level Bench</div>
    <h1>Diagnostic Complexity Ladder</h1>
    <p class="lede">Filter by specialty and difficulty level to see calibrated example diagnoses, from classic textbook presentations to rare multi-system disease.</p>
  </header>

  <div class="controls">
    <div class="field">
      <label for="specialty">Specialty</label>
      <select id="specialty">
        <option value="all">All specialties</option>
      </select>
    </div>
    <div class="field" style="flex:1;">
      <label>Level</label>
      <div class="level-pills" id="levelPills"></div>
    </div>
  </div>

  <div class="count" id="count"></div>
  <div class="results" id="results"></div>

  <footer>vibe_rounds · level_bench · complexity tiers L1&ndash;L5</footer>
</div>

const specialtySelect = document.getElementById('specialty');
const specialties = [...new Set(DATA.map(d => d.sys))].sort();
specialties.forEach(s => {
  const opt = document.createElement('option');
  opt.value = s;
  opt.textContent = s;
  specialtySelect.appendChild(opt);
});

const levelPillsEl = document.getElementById('levelPills');
let activeLevel = "all";

function renderPills(){
  levelPillsEl.innerHTML = '';
  const allPill = document.createElement('div');
  allPill.className = 'pill' + (activeLevel === 'all' ? ' active' : '');
  allPill.textContent = 'All levels';
  allPill.onclick = () => { activeLevel = 'all'; renderPills(); renderResults(); };
  levelPillsEl.appendChild(allPill);

  Object.keys(LEVELS).forEach(lvl => {
    const pill = document.createElement('div');
    pill.className = 'pill' + (activeLevel == lvl ? ' active' : '');
    pill.dataset.level = lvl;
    pill.textContent = `L${lvl} · ${LEVELS[lvl].name}`;
    pill.onclick = () => { activeLevel = lvl; renderPills(); renderResults(); };
    levelPillsEl.appendChild(pill);
  });
}

function renderResults(){
  const specVal = specialtySelect.value;
  const resultsEl = document.getElementById('results');
  const countEl = document.getElementById('count');

  // Nothing selected yet — keep it empty
  if(specVal === 'all' && activeLevel === 'all'){
    countEl.textContent = '';
    resultsEl.innerHTML = '<div class="empty">Choose a specialty and/or level above to see diagnoses.</div>';
    return;
  }

  const filtered = DATA.filter(d => {
    const matchSpec = specVal === 'all' || d.sys === specVal;
    const matchLevel = activeLevel === 'all' || d.level == activeLevel;
    return matchSpec && matchLevel;
  }).sort((a,b) => a.level - b.level);

  countEl.textContent = `${filtered.length} diagnosis${filtered.length === 1 ? '' : 'es'} shown`;

  if(filtered.length === 0){
    resultsEl.innerHTML = '<div class="empty">No diagnoses match this filter combination.</div>';
    return;
  }

  resultsEl.innerHTML = filtered.map((d, i) => `
    <div class="card" style="--accent:var(--l${d.level});">
      <button class="copy-btn" type="button" data-idx="${i}" aria-label="Copy diagnosis" title="Copy">
        <svg class="icon-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
        <svg class="icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
      </button>
      <div class="tags">
        <span class="badge">L${d.level} · ${LEVELS[d.level].name}</span>
        <span class="sys">${d.sys}</span>
      </div>
      <div class="dx"><b>${d.dx}</b><span class="note">${d.note}</span></div>
    </div>
  `).join('');

  resultsEl.querySelectorAll('.copy-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = Number(btn.dataset.idx);
      const d = filtered[idx];
      const text = `${d.dx} — ${d.note}`;
      const finish = () => {
        btn.classList.add('copied');
        clearTimeout(btn._copyTimeout);
        btn._copyTimeout = setTimeout(() => btn.classList.remove('copied'), 1400);
      };
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(finish).catch(() => {
          fallbackCopy(text);
          finish();
        });
      } else {
        fallbackCopy(text);
        finish();
      }
    });
  });
}

function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
}

specialtySelect.addEventListener('change', renderResults);
renderPills();
renderResults();
</script>
