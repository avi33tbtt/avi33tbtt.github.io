  .print-btn {

  .ap-title { text-align: center; }

    gap: 8px;
    margin-bottom: 8px;

  .ap-checklist input[type="checkbox"] {

  .ap-checklist .ap-reason {

  .ap-priority-item { margin-bottom: 12px; }
  .ap-priority-item:last-child { margin-bottom: 0; }
  .ap-priority-num {
    display: inline-flex;

  .ap-priority-just { color: var(--text-secondary); font-size: 0.85rem; margin-top: 2px; margin-left: 26px; }

  .ap-footer {
    text-align: center;
    font-size: 0.72rem;
    color: var(--text-muted);
    margin-top: 8px;

  /* ===== Print ===== */
  @media print {
    nav.tab-strip, .print-btn, footer.app-footer, header.app-header { display: none; }

    a { color: #000; text-decoration: none; }
    main { padding: 0; max-width: 100%; }

    .action-plan-toolbar { display: none; }
  }
</style>

      { name: "Malaria (treated empirically, never parasitologically confirmed in visible text)", rationale: "IV Artesunate — the severe-malaria regimen — was given on pattern alone; fever persisted to day 3–4 despite treatment, which is the exact signal that should trigger re-confirmation rather than continued assumption." },
      { name: "Posterior urethral valves or other congenital urinary outlet obstruction", rationale: "A 14-year-old male with a new poor stream and dribbling, without dysuria, carries a real risk of an undiagnosed structural lesion with potential for silent, irreversible renal damage if left unexamined." }

// ---------- Rendering ----------

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str == null ? '' : str;
  return div.innerHTML;
}

function gapBadge() {
  return '<span class="gap-badge">GAP</span>';
}

function renderHeader() {
  document.getElementById('case-id-badge').textContent = DATA.meta.caseId;
  document.getElementById('case-title').textContent = DATA.meta.caseTitle;
  document.getElementById('date-stamp').textContent = DATA.meta.date;

  const sourceEl = document.getElementById('source-link');
  sourceEl.innerHTML = 'Source: <a href="' + escapeHtml(DATA.meta.sourceUrl) + '" target="_blank" rel="noopener">' + escapeHtml(DATA.meta.sourceUrl) + '</a>';

  const s = DATA.meta.stats;
  const statBar = document.getElementById('stat-bar');
  statBar.innerHTML = [
    ['◎', s.gaps, 'gaps logged'],
    ['✦', s.prompts, 'prompts mapped'],
    ['⚠', s.criticalInvestigations, 'critical investigations'],
    ['⊞', s.specialties, 'specialties involved']
  ].map(([icon, num, label]) =>
    '<span class="stat-chip"><span class="stat-icon">' + icon + '</span><strong>' + num + '</strong> ' + escapeHtml(label) + '</span>'
  ).join('');
}

function renderCaseSummary() {
  const c = DATA.caseSummary;
  const panel = document.getElementById('panel-case-summary');

  const timelineHtml = c.timeline.map(t =>
    '<div class="timeline-item">' +
      '<div class="timeline-time">' + escapeHtml(t.time) + '</div>' +
      '<div class="timeline-event' + (t.flag ? ' flag' : '') + '">' + escapeHtml(t.event) + '</div>' +
    '</div>'
  ).join('');

  panel.innerHTML =
    '<h2>Case Summary</h2>' +
    '<div class="card">' +
      '<div class="summary-grid">' +
        '<div class="summary-field"><span class="label">Chief Complaint</span><p>' + escapeHtml(c.chiefComplaint) + '</p></div>' +
        '<div class="summary-field"><span class="label">Duration</span><p>' + escapeHtml(c.duration) + '</p></div>' +
      '</div>' +
    '</div>' +
    '<div class="card">' +
      '<span class="label">Key Findings</span>' +
      '<ul class="findings-list">' + c.keyFindings.map(f => '<li>' + escapeHtml(f) + (f.toLowerCase().includes('not accessible') || f.toLowerCase().includes('not documented') ? gapBadge() : '') + '</li>').join('') + '</ul>' +
    '</div>' +
    '<div class="card">' +
      '<span class="label">Working Diagnoses</span>' +
      '<ul class="dx-list">' + c.workingDiagnoses.map(d => '<li>' + escapeHtml(d) + '</li>').join('') + '</ul>' +
    '</div>' +
    '<div class="card">' +
      '<span class="label">Plan Status</span>' +
      '<p>' + escapeHtml(c.planStatus) + gapBadge() + '</p>' +
    '</div>' +
    '<div class="card">' +
      '<span class="label">Timeline</span>' +
      '<div class="timeline">' + timelineHtml + '</div>' +
    '</div>';
}

function renderInsights() {
  const panel = document.getElementById('panel-top-insights');
  const cardsHtml = DATA.insights.map(ins => {
    const dotCount = ins.scoreLevel === 'high' ? 3 : ins.scoreLevel === 'mid' ? 2 : 1;
    const dots = [1,2,3].map(i =>
      '<span class="score-dot' + (i <= dotCount ? ' filled ' + ins.scoreLevel : '') + '"></span>'
    ).join('');

    return (
      '<div class="card insight-card" data-idx="' + ins.number + '">' +
        '<div class="insight-header">' +
          '<div class="insight-header-left">' +
            '<span class="insight-caret">▶</span>' +
            '<span class="insight-number">#' + ins.number + '</span>' +
            '<span class="insight-title">' + escapeHtml(ins.title) + '</span>' +
          '</div>' +
          '<div class="score-dots">' + dots + '</div>' +
        '</div>' +
        '<div class="insight-body"><div class="insight-body-inner">' +
          '<span class="label">Finding</span><p>' + escapeHtml(ins.finding) + '</p>' +
          '<span class="label">Significance</span><p>' + escapeHtml(ins.significance) + '</p>' +
          '<span class="label">Correct Response</span><p>' + escapeHtml(ins.correctResponse) + '</p>' +
        '</div></div>' +
      '</div>'
    );
  }).join('');

  panel.innerHTML = '<h2>Top 10 Clinical Insights</h2>' + cardsHtml;

  panel.querySelectorAll('.insight-card').forEach(card => {
    card.querySelector('.insight-header').addEventListener('click', () => {
      card.classList.toggle('expanded');
    });
  });
}

function scoreClass(score) {
  if (score === 10) return 's10';
  if (score >= 8) return 's89';
  return 'slow';
}

function renderInvTable(rows) {
  return (
    '<table class="inv-table">' +
      '<thead><tr>' +
        '<th class="sortable" data-sort="score">Score <span class="sort-arrow">↓</span></th>' +
        '<th>Item</th>' +
        '<th>Why It Matters</th>' +
        '<th>Source</th>' +
      '</tr></thead>' +
      '<tbody>' +
        rows.map(r =>
          '<tr>' +
            '<td><span class="score-badge ' + scoreClass(r.score) + '">' + r.score + '</span></td>' +
            '<td>' + escapeHtml(r.item) + '</td>' +
            '<td>' + escapeHtml(r.whyItMatters) + '</td>' +
            '<td class="source-tag">' + escapeHtml(r.source) + '</td>' +
          '</tr>'
        ).join('') +
      '</tbody>' +
    '</table>'
  );
}

const invState = { active: 'investigations', sortDir: { history: 'desc', examination: 'desc', investigations: 'desc' } };

function sortedRows(key) {
  const rows = DATA.investigations[key].slice();
  rows.sort((a, b) => invState.sortDir[key] === 'desc' ? b.score - a.score : a.score - b.score);
  return rows;
}

function renderInvestigations() {
  const panel = document.getElementById('panel-investigations');
  panel.innerHTML =
    '<h2>Investigations</h2>' +
    '<div class="subtab-strip" id="inv-subtab-strip">' +
      '<button class="subtab-btn" data-sub="history">History</button>' +
      '<button class="subtab-btn" data-sub="examination">Examination</button>' +
      '<button class="subtab-btn active" data-sub="investigations">Investigations</button>' +
    '</div>' +
    '<div class="subtab-panel" id="sub-history">' + renderInvTable(sortedRows('history')) + '</div>' +
    '<div class="subtab-panel" id="sub-examination">' + renderInvTable(sortedRows('examination')) + '</div>' +
    '<div class="subtab-panel active" id="sub-investigations">' + renderInvTable(sortedRows('investigations')) + '</div>';

  panel.querySelectorAll('.subtab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      panel.querySelectorAll('.subtab-btn').forEach(b => b.classList.remove('active'));
      panel.querySelectorAll('.subtab-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      const key = btn.getAttribute('data-sub');
      document.getElementById('sub-' + key).classList.add('active');
      invState.active = key;
    });
  });

  attachSortHandlers(panel);
}

function attachSortHandlers(panel) {
  panel.querySelectorAll('.sortable').forEach(th => {
    th.addEventListener('click', () => {
      const key = invState.active;
      invState.sortDir[key] = invState.sortDir[key] === 'desc' ? 'asc' : 'desc';
      document.getElementById('sub-' + key).innerHTML = renderInvTable(sortedRows(key));
      attachSortHandlers(panel); // re-attach after re-render
      const arrow = document.querySelector('#sub-' + key + ' .sort-arrow');
      if (arrow) arrow.textContent = invState.sortDir[key] === 'desc' ? '↓' : '↑';
    });
  });
}

function renderDifferentials() {
  const panel = document.getElementById('panel-differentials');
  const d = DATA.differentials;

  function group(title, cls, entries) {
    return (
      '<div class="dx-group ' + cls + '">' +
        '<div class="dx-group-label">' + title + '</div>' +
        entries.map((e, i) =>
          '<div class="dx-entry">' +
            '<div class="dx-entry-name">' + (i + 1) + '. ' + escapeHtml(e.name) + '</div>' +
            '<div class="dx-entry-rationale">' + escapeHtml(e.rationale) + '</div>' +
          '</div>'
        ).join('') +
      '</div>'
    );
  }

  panel.innerHTML =
    '<h2>Differential Diagnosis</h2>' +
    group('Most Likely', 'most-likely', d.mostLikely) +
    group('Must Not Miss', 'must-not-miss', d.mustNotMiss) +
    group('Benign / Alternative', 'benign', d.benign);
}

function renderActionPlan() {
  const panel = document.getElementById('panel-action-plan');
  const ap = DATA.actionPlan;

  const immediateHtml = ap.immediateActions.map((a, i) =>
    '<li><input type="checkbox" id="imm-' + i + '"><label for="imm-' + i + '">' + (i + 1) + '. ' + escapeHtml(a) + '</label></li>'
  ).join('');

  const urgentHtml = ap.urgentInvestigations.map((u, i) =>
    '<li><input type="checkbox" id="urg-' + i + '">' +
      '<span><label for="urg-' + i + '">' + (i + 1) + '. ' + escapeHtml(u.item) + '</label>' +
      '<span class="ap-reason">' + escapeHtml(u.reason) + '</span></span></li>'
  ).join('');

  const referralsHtml = ap.referrals.map((r, i) =>
    '<li><input type="checkbox" id="ref-' + i + '"><label for="ref-' + i + '">' + escapeHtml(r) + '</label></li>'
  ).join('');

  const priorityHtml = ap.top3Priorities.map((p, i) =>
    '<div class="ap-priority-item">' +
      '<div><span class="ap-priority-num">' + (i + 1) + '</span><span class="ap-priority-title">' + escapeHtml(p.item) + '</span></div>' +
      '<div class="ap-priority-just">' + escapeHtml(p.justification) + '</div>' +
    '</div>'
  ).join('');

  panel.innerHTML =
    '<div class="action-plan-toolbar"><button class="print-btn" id="print-btn">Print Report</button></div>' +
    '<div class="action-plan">' +
      '<div class="ap-title">' +
        '<h2>Case Action Plan</h2>' +
        '<div class="ap-meta">Generated: ' + escapeHtml(DATA.meta.date) + ' &nbsp;·&nbsp; Prepared by: Medical Student (VibeRounds)</div>' +
        '<div class="ap-meta">Case: ' + escapeHtml(DATA.meta.caseId) + '</div>' +
      '</div>' +
      '<hr class="ap-rule">' +
      '<div class="ap-section">' +
        '<div class="ap-section-label">Clinical Summary</div>' +
        '<p class="ap-clinical-summary">' + escapeHtml(ap.clinicalSummary) + '</p>' +
      '</div>' +
      '<hr class="ap-rule">' +
      '<div class="ap-section">' +
        '<div class="ap-section-label">Immediate Actions (do today — before any procedure)</div>' +
        '<ul class="ap-checklist">' + immediateHtml + '</ul>' +
      '</div>' +
      '<div class="ap-section">' +
        '<div class="ap-section-label">Urgent Investigations (within 48–72 hours)</div>' +
        '<ul class="ap-checklist">' + urgentHtml + '</ul>' +
      '</div>' +
      '<div class="ap-section">' +
        '<div class="ap-section-label">Specialist Referrals to Consider</div>' +
        '<ul class="ap-checklist">' + referralsHtml + '</ul>' +
      '</div>' +
      '<hr class="ap-rule">' +
      '<div class="ap-section">' +
        '<div class="ap-section-label">Top 3 Diagnostic Priorities</div>' +
        priorityHtml +
      '</div>' +
      '<hr class="ap-rule">' +
      '<div class="ap-footer">' +
        'PREPARED USING VibeRounds v1.1<br>' +
        'Educational output only. Independent clinical verification required.' +
      '</div>' +
    '</div>';

  document.getElementById('print-btn').addEventListener('click', () => window.print());
}

function setupTabs() {
  const tabMap = {
    'case-summary': 'panel-case-summary',
    'top-insights': 'panel-top-insights',
    'investigations': 'panel-investigations',
    'differentials': 'panel-differentials',
    'action-plan': 'panel-action-plan'
  };

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(tabMap[btn.getAttribute('data-tab')]).classList.add('active');
    });
  });
}

function init() {
  renderHeader();
  renderCaseSummary();
  renderInsights();
  renderInvestigations();
  renderDifferentials();
  renderActionPlan();
  setupTabs();
}

init();
</script>
</body>
</html>
