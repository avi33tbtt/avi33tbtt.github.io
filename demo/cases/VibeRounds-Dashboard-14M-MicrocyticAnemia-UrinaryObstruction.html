<style>
:root {

  --accent-light:   #eff6ff;
  --warning:        #d97706;
  --warning-light:  #fffbeb;
  --danger:         #dc2626;
  --danger-light:   #fef2f2;
  --success:        #16a34a;

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  font-size: 14px;
  line-height: 1.6;
  color: var(--text-primary);
  background: var(--bg-primary);
}

h1 { font-size: 1.5rem; font-weight: 700; }
h2 { font-size: 1.15rem; font-weight: 600; }
h3 { font-size: 1rem; font-weight: 600; }

.label {
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-secondary);
}

/* HEADER */
header {
  border-bottom: 1px solid var(--border);
  padding: 20px 32px 0;
  background: var(--bg-primary);
}

.header-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 12px;
}

.case-id-badge {
  font-size: 0.7rem;
  font-weight: 600;
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 3px 8px;
  color: var(--text-secondary);
  white-space: nowrap;
  margin-top: 4px;
}

.header-meta {
  font-size: 0.8rem;
  color: var(--text-secondary);
  margin-bottom: 12px;
}
.header-meta a { color: var(--accent); text-decoration: none; }
.header-meta a:hover { text-decoration: underline; }

.stat-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 16px;
}

.stat-chip {
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 4px 10px;
  font-size: 0.8rem;
  color: var(--text-primary);
}

.stat-chip span { font-weight: 700; }

/* TAB STRIP */
.tab-strip {
  display: flex;
  gap: 0;
  border-bottom: none;
  margin-top: 4px;
}

.tab-btn {
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  padding: 10px 16px;
  font-family: inherit;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--text-secondary);
  cursor: pointer;
  white-space: nowrap;
  transition: color 0.15s, border-color 0.15s;
}
.tab-btn:hover { color: var(--text-primary); }
.tab-btn.active {
  color: var(--accent);
  border-bottom: 2px solid var(--accent);
}

/* MAIN */
main {
  padding: 32px 32px 48px;
  max-width: 1100px;
}

section { display: none; }
section.active { display: block; }

/* CARD */
.card {
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 16px 20px;
  margin-bottom: 12px;
}
.card:hover { border-color: #c0c7ce; }

/* GAP BADGE */
.gap-badge {
  display: inline-block;
  background: var(--warning-light);
  color: var(--warning);
  border: 1px solid #fcd34d;
  border-radius: 3px;
  font-size: 0.65rem;
  font-weight: 600;
  padding: 1px 5px;
  letter-spacing: 0.04em;
  vertical-align: middle;
}

/* CASE SUMMARY TABLE */
.summary-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 8px;
}
.summary-table th, .summary-table td {
  text-align: left;
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
}
.summary-table th {
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-secondary);
  background: var(--bg-tertiary);
  width: 180px;
}
.summary-table tr:last-child th,
.summary-table tr:last-child td { border-bottom: none; }

/* TIMELINE */
.timeline { margin-top: 8px; }
.timeline-item {
  display: flex;
  gap: 16px;
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
}
.timeline-item:last-child { border-bottom: none; }
.timeline-time {
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--accent);
  white-space: nowrap;
  min-width: 140px;
}
.timeline-event { font-size: 0.85rem; }

/* INSIGHT CARDS */
.insight-card {
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 6px;
  margin-bottom: 12px;
  overflow: hidden;
}
.insight-card:hover { border-color: #c0c7ce; }

.insight-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 20px;
  cursor: pointer;
  gap: 12px;
}

.insight-num {
  font-size: 0.7rem;
  font-weight: 700;
  color: var(--text-muted);
  min-width: 20px;
}

.insight-title { font-weight: 600; font-size: 0.9rem; flex: 1; }

.score-dots {
  display: flex;
  gap: 4px;
  align-items: center;
}
.score-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--border);
}
.score-dot.filled-high { background: var(--score-high); }
.score-dot.filled-mid { background: var(--score-mid); }
.score-dot.filled-low { background: var(--score-low); }

.chevron {
  font-size: 0.75rem;
  color: var(--text-muted);
  transition: transform 0.2s;
  margin-left: 8px;
}
.insight-card.expanded .chevron { transform: rotate(180deg); }

.insight-body {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.25s ease;
}
.insight-card.expanded .insight-body { max-height: 800px; }

.insight-body-inner {
  padding: 0 20px 16px;
  border-top: 1px solid var(--border);
}

.insight-section { margin-top: 12px; }
.insight-section .label { display: block; margin-bottom: 4px; }
.insight-section p { font-size: 0.875rem; }

/* INVESTIGATION TABLES */
.sub-tab-strip {
  display: flex;
  gap: 0;
  border-bottom: 1px solid var(--border);
  margin-bottom: 20px;
}
.sub-tab-btn {
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  padding: 8px 14px;
  font-family: inherit;
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--text-secondary);
  cursor: pointer;
  transition: color 0.15s, border-color 0.15s;
}
.sub-tab-btn:hover { color: var(--text-primary); }
.sub-tab-btn.active { color: var(--accent); border-bottom: 2px solid var(--accent); }

.inv-sub { display: none; }
.inv-sub.active { display: block; }

.inv-table {
  width: 100%;
  border-collapse: collapse;
}
.inv-table th {
  text-align: left;
  padding: 8px 12px;
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-secondary);
  background: var(--bg-tertiary);
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  user-select: none;
}
.inv-table th:hover { color: var(--text-primary); }
.inv-table td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
  font-size: 0.875rem;
}
.inv-table tr:nth-child(even) td { background: var(--bg-secondary); }
.inv-table tr:nth-child(odd) td { background: var(--bg-primary); }
.inv-table tr:last-child td { border-bottom: none; }

.score-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  font-weight: 700;
  font-size: 0.8rem;
  color: white;
}
.score-10 { background: var(--danger); }
.score-9  { background: var(--danger); }
.score-8  { background: var(--warning); }
.score-7  { background: var(--warning); }
.score-6  { background: var(--success); }
.score-5  { background: var(--success); }
.score-4  { background: var(--success); }

.sort-arrow { margin-left: 4px; color: var(--text-muted); }

/* DIFFERENTIALS */
.diff-group {
  margin-bottom: 16px;
  border: 1px solid var(--border);
  border-radius: 6px;
  overflow: hidden;
}
.diff-group-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  cursor: pointer;
  background: var(--bg-secondary);
}
.diff-group-header h3 { font-size: 0.9rem; }
.diff-group-label {
  font-size: 0.65rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 2px 8px;
  border-radius: 3px;
}
.label-likely { background: var(--accent-light); color: var(--accent); }
.label-mnm { background: var(--danger-light); color: var(--danger); }
.label-benign { background: var(--success-light); color: var(--success); }

.diff-body {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.25s ease;
}
.diff-group.expanded .diff-body { max-height: 600px; }
.diff-chevron { font-size: 0.75rem; color: var(--text-muted); transition: transform 0.2s; }
.diff-group.expanded .diff-chevron { transform: rotate(180deg); }

.diff-list { padding: 0 16px 12px; }
.diff-item {
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
  padding-left: 12px;
}
.diff-item:last-child { border-bottom: none; }
.diff-group.most-likely .diff-item { border-left: 3px solid var(--accent); }
.diff-group.must-miss .diff-item { border-left: 3px solid var(--danger); }
.diff-group.benign .diff-item { border-left: 3px solid var(--success); }
.diff-item-name { font-weight: 600; font-size: 0.875rem; margin-bottom: 2px; }
.diff-item-rationale { font-size: 0.82rem; color: var(--text-secondary); }

/* ACTION PLAN */
.action-plan-wrap {
  max-width: 720px;
}
.ap-header-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
}
.print-btn {
  border: 1px solid var(--border);
  background: white;
  border-radius: 4px;
  padding: 6px 14px;
  font-family: inherit;
  font-size: 0.8rem;
  font-weight: 600;
  cursor: pointer;
  color: var(--text-primary);
}
.print-btn:hover { border-color: #c0c7ce; background: var(--bg-secondary); }

.ap-divider {
  border: none;
  border-top: 2px solid var(--text-primary);
  margin: 16px 0;
}

.ap-section-title {
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-secondary);
  margin: 20px 0 8px;
}

.ap-summary {
  font-size: 0.9rem;
  line-height: 1.7;
  margin-bottom: 4px;
}

.checklist { list-style: none; margin: 0; padding: 0; }
.checklist li {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 5px 0;
  font-size: 0.875rem;
}
.checklist li input[type="checkbox"] {
  margin-top: 3px;
  flex-shrink: 0;
  accent-color: var(--accent);
  width: 14px;
  height: 14px;
}

.priority-item {
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
  font-size: 0.875rem;
}
.priority-item:last-child { border-bottom: none; }
.priority-item-label { font-weight: 600; margin-bottom: 2px; }
.priority-item-just { color: var(--text-secondary); }

.ap-footer {
  margin-top: 24px;
  padding-top: 12px;
  border-top: 2px solid var(--text-primary);
  font-size: 0.75rem;
  color: var(--text-secondary);
}

/* FOOTER */
footer {
  border-top: 1px solid var(--border);
  padding: 12px 32px;
  font-size: 0.75rem;
  color: var(--text-secondary);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
}

/* PRINT */
@media print {
  nav, .tab-strip, .print-btn, footer { display: none !important; }
  body { font-size: 12px; color: #000; background: #fff; }
  .card { border: 1px solid #ccc; page-break-inside: avoid; }
  a { color: #000; text-decoration: none; }
  section:not(#action-plan) { display: none !important; }
  #action-plan { display: block !important; }
  header { padding-bottom: 0; }
  .stat-bar, .header-meta { display: none; }
}

/* responsive */
@media (max-width: 640px) {
  header, main { padding-left: 16px; padding-right: 16px; }
  .tab-btn { padding: 10px 10px; font-size: 0.78rem; }
  .summary-table th { width: 120px; }
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderGaps(text) {
  return escapeHtml(text).replace(/\[NOT DOCUMENTED[^\]]*\]/g, '<span class="gap-badge">[GAP]</span>');
}

function scoreBadgeClass(score) {
  if (score >= 9) return 'score-10';
  if (score >= 8) return 'score-8';
  if (score >= 7) return 'score-7';
  return 'score-6';
}

      <tbody>`;

      sec.querySelectorAll('.inv-sub').forEach(s => s.classList.remove('active'));
      btn.classList.add('active');
      sec.querySelector('#inv-' + btn.dataset.inv).classList.add('active');

  // Sort
  sec.querySelectorAll('.inv-table').forEach(table => {

    <ul class="checklist">`;
  ap.urgentInvestigations.forEach((inv, i) => {
    html += `<li><input type="checkbox"><span><strong>${i+1}.</strong> <strong>${escapeHtml(inv.item)}</strong> — ${escapeHtml(inv.reason)}</span></li>`;
  });
  html += `</ul>

    <div class="ap-section-title">Clinical Safety Checklist</div>
    <ul class="checklist">`;
  ap.clinicalChecklist.forEach(c => {
    html += `<li><input type="checkbox"><span>${escapeHtml(c)}</span></li>`;
  });
  html += `</ul>

    <div class="ap-section-title">Specialist Referrals Required</div>
    <ul class="checklist">`;
  ap.referrals.forEach(r => {
    html += `<li><input type="checkbox"><span>${escapeHtml(r)}</span></li>`;
  });
  html += `</ul>

    <div class="ap-section-title">Top 3 Diagnostic Priorities</div>
    <div>`;
  ap.top3Priorities.forEach((p, i) => {
    html += `<div class="priority-item">
      <div class="priority-item-label">${i+1}. ${escapeHtml(p.item)}</div>
      <div class="priority-item-just">${escapeHtml(p.justification)}</div>
    </div>`;
  });
  html += `</div>

    <div class="ap-footer">
      <strong>PREPARED USING VibeRounds v1.1</strong><br>
      Educational output only. Independent clinical verification required before acting on any content. This is not clinical advice, diagnostic guidance, or a substitute for professional medical judgment.<br>
      Source: <a href="${DATA.meta.sourceUrl}" style="color:var(--accent);">${DATA.meta.sourceUrl}</a>
    </div>
  </div>`;

  sec.innerHTML = html;
  document.getElementById('print-btn').addEventListener('click', () => window.print());
})();
</script>
