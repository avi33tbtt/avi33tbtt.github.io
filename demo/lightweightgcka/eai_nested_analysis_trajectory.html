    <h3>${d.title}</h3>
    <p class="dp-meta">${d.meta}</p>
    <p class="dp-body">${d.body}</p>
    <div class="dp-key">${d.key}</div>
    <div class="dp-tags">${d.tags.map(t => `<span class="dp-tag">${t}</span>`).join('')}</div>
  `;
}
