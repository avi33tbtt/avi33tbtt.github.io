    if(!url || !looksLikeUrlOnly(url)){ setNote(noteId, 'Paste a link into the box above first.', 'error'); return; }
    if(!/^https?:\/\//i.test(url)) url = 'https://' + url;
    btn.disabled = true;
    setNote(noteId, 'Fetching…');
    try{
      const res = await fetch(url, {mode:'cors'});
      if(!res.ok) throw new Error(`Server responded ${res.status}`);
      const contentType = res.headers.get('content-type') || '';
      let text = '';
      if(contentType.includes('application/pdf') || url.toLowerCase().endsWith('.pdf')){
        const buf = await res.arrayBuffer();
        text = await extractPdfText(buf);
      } else {
        const raw = await res.text();
        if(contentType.includes('html')){
          const doc = new DOMParser().parseFromString(raw, 'text/html');
          doc.querySelectorAll('script,style,nav,header,footer,noscript').forEach(n=>n.remove());
          text = (doc.body ? doc.body.innerText : raw).replace(/\n{3,}/g,'\n\n').trim();
        } else { text = raw; }
      }
      if(!text || !text.trim()){
        setNote(noteId, `Fetched the page but couldn't extract readable text. Try copying the case text manually.`, 'error');
        return;
      }
      ta.value = text.trim();
      $s('clCaseSetNote').textContent = `Loaded from URL: ${url}`;
      setNote(noteId, `Loaded ${text.length.toLocaleString()} characters from the link.`, 'ok');
      updateLinkDetect();
    } catch(err){
      setNote(noteId, `Couldn't fetch that URL directly (often blocked by the site's CORS policy). Try opening the link and pasting the case text instead.`, 'error');
    } finally { btn.disabled = false; }
  });

  /* ---- Lens grid ---- */
  function renderLensGrid(){
    const grid = $s('clLensGrid');
    grid.innerHTML = CL_LENSES.map(l => `
      <div class="lens-card ${lensState[l.key].status==='done'?'done':''} ${lensState[l.key].status==='running'?'running':''}" id="cl-card-${l.key}">
        <div class="lens-head">
          <div class="lens-num">${l.id}</div>
          <div>
            <div class="lens-name">${l.name}</div>
            <div class="lens-focus">${l.focus}</div>
          </div>
        </div>
        <div class="lens-actions">
          <label class="checkbox-inline"><input type="checkbox" class="clLensCheckbox" data-key="${l.key}"> select</label>
          <button class="small" data-run="${l.key}" type="button">▶ Run lens</button>
          <span class="status-dot" id="cl-dot-${l.key}"></span>
        </div>
      </div>
    `).join('');
    grid.querySelectorAll('button[data-run]').forEach(btn=>{
      btn.addEventListener('click', ()=> runLens(btn.dataset.run));
    });
    updateDoneCount();
  }
  renderLensGrid();

  $s('clSelectAll').addEventListener('change', (e)=>{
    document.querySelectorAll('.clLensCheckbox').forEach(cb => cb.checked = e.target.checked);
  });
  $s('clRunSelectedBtn').addEventListener('click', async ()=>{
    const keys = Array.from(document.querySelectorAll('.clLensCheckbox:checked')).map(cb=>cb.dataset.key);
    const toRun = keys.length ? keys : CL_LENSES.map(l=>l.key);
    for(const k of toRun){ await runLens(k); }
  });
  $s('clResetLensesBtn').addEventListener('click', ()=>{
    CL_LENSES.forEach(l => lensState[l.key] = {status:'idle', output:''});
    conversationLog = [];
    $s('clLensOutputs').innerHTML = '';
    $s('clPhase3Outputs').innerHTML = '';
    renderLensGrid();
    updateEmptyResultsNote();
  });

  function updateDoneCount(){
    const done = Object.values(lensState).filter(s=>s.status==='done').length;
    $s('clLensDoneCount').textContent = `${done} / 8 run`;
  }

  function formatOutput(text){ return text; }
  function updateEmptyResultsNote(){
    const hasOutputs = $s('clLensOutputs').children.length > 0 || $s('clPhase3Outputs').children.length > 0;
    $s('clEmptyResultsNote').style.display = hasOutputs ? 'none' : '';
  }
  function ensureOutputBlock(id, title, subtitle){
    let el = document.getElementById('cl-out-'+id);
    if(!el){
      el = document.createElement('div');
      el.className = 'output-block';
      el.id = 'cl-out-'+id;
      el.innerHTML = `<h3>${title} <span class="lens-id">${subtitle||''}</span><span class="spacer"><button type="button" class="tts-btn" data-speak="${id}" aria-label="Read aloud" title="Read aloud">${RS_TTS_ICON}</button></span></h3><div class="output-body" id="cl-body-${id}"><div class="loading-line">running<span class="dots"><span>.</span><span>.</span><span>.</span></span></div></div>`;
      $s('clLensOutputs').appendChild(el);
      el.querySelector('[data-speak]').addEventListener('click', ()=> clToggleSpeak(id, el.querySelector('[data-speak]')));
      updateEmptyResultsNote();
    }
    return el;
  }

  /* ---- API calls (reuse hub's shared key/model storage) ---- */
  async function callModel(systemPrompt, messages){
    const provider = hubActiveProvider();
    const keys = loadKeys(), models = loadModels(), endpoints = loadEndpoints();
    const apiKey = keys[provider];
    const model = models[provider] || PROVIDERS[provider].modelPlaceholder;
    if(!apiKey && !PROVIDERS[provider].needsEndpoint){
      throw new Error(`No API key saved for ${PROVIDERS[provider].label}. Add one in Setup.`);
    }
    if(provider === 'claude'){
      const resp = await fetch('https://api.anthropic.com/v1/messages', {
        method:'POST',
        headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
        body: JSON.stringify({ model, max_tokens:4096, system: systemPrompt, messages: messages.map(m=>({role:m.role==='assistant'?'assistant':'user', content:m.content})) })
      });
      const data = await resp.json();
      if(data.error) throw new Error(data.error.message || JSON.stringify(data.error));
      return (data.content||[]).map(c=>c.text||'').join('\n');
    }
    if(provider === 'gemini'){
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
      const contents = messages.map(m=>({role: m.role==='assistant'?'model':'user', parts:[{text:m.content}]}));
      const resp = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ systemInstruction: {parts:[{text:systemPrompt}]}, contents }) });
      const data = await resp.json();
      if(data.error) throw new Error(data.error.message || JSON.stringify(data.error));
      return (data.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('\n');
    }
    const endpoint = provider === 'openai' ? 'https://api.openai.com/v1/chat/completions' : endpoints[provider];
    if(!endpoint) throw new Error('No API endpoint set for this provider.');
    const resp = await fetch(endpoint, {
      method:'POST',
      headers:{'Content-Type':'application/json', 'Authorization': 'Bearer ' + apiKey},
      body: JSON.stringify({ model, messages: [{role:'system', content:systemPrompt}, ...messages], max_tokens:4096 })
    });
    const data = await resp.json();
    if(data.error) throw new Error(data.error.message || JSON.stringify(data.error));
    return data.choices?.[0]?.message?.content || '';
  }

  async function runLens(key){
    const lens = CL_LENSES.find(l=>l.key===key);
    const caseText = $s('clCaseText').value.trim();
    if(!caseText){ alert('Paste a case first (Step 1).'); return; }
    lensState[key].status = 'running';
    $s('cl-card-'+key).classList.add('running');
    ensureOutputBlock(key, `Lens ${lens.id} — ${lens.name}`, lens.focus);
    $s('cl-body-'+key).innerHTML = `<div class="loading-line">running<span class="dots"><span>.</span><span>.</span><span>.</span></span></div>`;
    const userMsg = `CASE:\n${caseText}\n\n${lens.prompt}`;
    try{
      const output = await callModel(CL_AUDITOR_SYSTEM, [{role:'user', content: userMsg}]);
      lensState[key] = {status:'done', output};
      conversationLog.push({lens: lens.name, id: lens.id, output});
      $s('cl-body-'+key).innerHTML = formatOutput(output);
      $s('cl-card-'+key).classList.remove('running');
      $s('cl-card-'+key).classList.add('done');
    }catch(err){
      lensState[key].status = 'idle';
      $s('cl-card-'+key).classList.remove('running');
      $s('cl-body-'+key).innerHTML = `<span style="color:var(--alert)">Error: ${err.message}</span>`;
    }
    updateDoneCount();
  }

  function buildPhase3Context(){
    if(conversationLog.length === 0) return null;
    const caseText = $s('clCaseText').value.trim();
    let ctx = `CASE:\n${caseText}\n\nOutputs generated so far across the 8 lenses:\n\n`;
    conversationLog.forEach(c => { ctx += `--- Lens ${c.id} — ${c.lens} ---\n${c.output}\n\n`; });
    return ctx;
  }
  async function runPhase3(promptText, title, targetId){
    const ctx = buildPhase3Context();
    if(!ctx){ alert('Run at least one lens first — Phase 3 consolidates what the lenses generated.'); return; }
    let el = document.getElementById('cl-out-'+targetId);
    if(!el){
      el = document.createElement('div');
      el.className = 'output-block';
      el.id = 'cl-out-'+targetId;
      el.innerHTML = `<h3>${title}<span class="spacer"><button type="button" class="tts-btn" data-speak="${targetId}" aria-label="Read aloud" title="Read aloud">${RS_TTS_ICON}</button></span></h3><div class="output-body" id="cl-body-${targetId}"><div class="loading-line">running<span class="dots"><span>.</span><span>.</span><span>.</span></span></div></div>`;
      $s('clPhase3Outputs').appendChild(el);
      el.querySelector('[data-speak]').addEventListener('click', ()=> clToggleSpeak(targetId, el.querySelector('[data-speak]')));
      updateEmptyResultsNote();
    } else {
      $s('cl-body-'+targetId).innerHTML = `<div class="loading-line">running<span class="dots"><span>.</span><span>.</span><span>.</span></span></div>`;
    }
    try{
      const output = await callModel(CL_AUDITOR_SYSTEM, [{role:'user', content: ctx + '\n\n' + promptText}]);
      $s('cl-body-'+targetId).innerHTML = formatOutput(output);
    }catch(err){
      $s('cl-body-'+targetId).innerHTML = `<span style="color:var(--alert)">Error: ${err.message}</span>`;
    }
  }
  $s('clRollupBtn').addEventListener('click', ()=> runPhase3(CL_ROLLUP_PROMPT, 'Phase 3 · Key Questions Roll-Up', 'rollup'));
  $s('clReflectionBtn').addEventListener('click', ()=> runPhase3(CL_REFLECTION_PROMPT, 'Phase 3 · Reflection Debrief', 'reflection'));

  /* ---- text-to-speech ---- */
  const clSpeechSupported = 'speechSynthesis' in window;
  let clCurrentSpeakId = null;
  function clPlainTextOf(id){ const bodyEl = document.getElementById('cl-body-'+id); return bodyEl ? bodyEl.innerText.trim() : ''; }
  function clClearSpeakingIcons(){ document.querySelectorAll('.sl-tool .tts-btn.speaking').forEach(b=>b.classList.remove('speaking')); clCurrentSpeakId = null; }
  function clToggleSpeak(id, btn){
    if(!clSpeechSupported){ alert('Text-to-speech is not supported in this browser.'); return; }
    if(clCurrentSpeakId === id){ window.speechSynthesis.cancel(); clClearSpeakingIcons(); return; }
    window.speechSynthesis.cancel();
    clClearSpeakingIcons();
    const text = clPlainTextOf(id);
    if(!text) return;
    const utter = new SpeechSynthesisUtterance(text);
    utter.onend = clClearSpeakingIcons;
    utter.onerror = clClearSpeakingIcons;
    clCurrentSpeakId = id;
    btn.classList.add('speaking');
    window.speechSynthesis.speak(utter);
  }
  $s('clSpeakAllBtn').addEventListener('click', ()=>{
    if(!clSpeechSupported){ alert('Text-to-speech is not supported in this browser.'); return; }
    window.speechSynthesis.cancel();
    clClearSpeakingIcons();
    const ids = [
      ...CL_LENSES.map(l=>l.key).filter(k => lensState[k].status==='done'),
      ...['rollup','reflection'].filter(id => document.getElementById('cl-out-'+id))
    ];
    if(ids.length === 0){ alert('No outputs to read yet — run a lens or Phase 3 step first.'); return; }
    let i = 0;
    function speakNext(){
      if(i >= ids.length){ clClearSpeakingIcons(); return; }
      const id = ids[i];
      const text = clPlainTextOf(id);
      i++;
      if(!text){ speakNext(); return; }
      const utter = new SpeechSynthesisUtterance(text);
      utter.onend = speakNext;
      utter.onerror = speakNext;
      window.speechSynthesis.speak(utter);
    }
    speakNext();
  });
  $s('clStopSpeakBtn').addEventListener('click', ()=>{ window.speechSynthesis.cancel(); clClearSpeakingIcons(); });

  /* ---- export / reset ---- */
  function collectResults(){
    const caseText = $s('clCaseText').value.trim();
    const lensResults = CL_LENSES.filter(l => lensState[l.key].status === 'done').map(l => ({ id:l.id, name:l.name, focus:l.focus, output: lensState[l.key].output }));
    const rollupEl = document.getElementById('cl-body-rollup');
    const reflectionEl = document.getElementById('cl-body-reflection');
    return {
      caseText, lensResults,
      rollup: rollupEl ? rollupEl.innerText.trim() : '',
      reflection: reflectionEl ? reflectionEl.innerText.trim() : ''
    };
  }
  function triggerDownload(filename, content, mime){
    const blob = new Blob([content], {type: mime});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }
  function buildTextExport(){
    const r = collectResults();
    let out = `CASE LENS — 8-LENS CRITICAL THINKING AUDIT\n`;
    out += `Generated: ${new Date().toLocaleString()}\n`;
    out += `${'='.repeat(60)}\n\nCASE\n${'-'.repeat(60)}\n${r.caseText || '(no case entered)'}\n\n`;
    if(r.lensResults.length === 0){ out += `No lenses have been run yet.\n\n`; }
    else { r.lensResults.forEach(l=>{ out += `LENS ${l.id} — ${l.name}\n${l.focus}\n${'-'.repeat(60)}\n${l.output}\n\n`; }); }
    if(r.rollup) out += `PHASE 3 — KEY QUESTIONS ROLL-UP\n${'-'.repeat(60)}\n${r.rollup}\n\n`;
    if(r.reflection) out += `PHASE 3 — REFLECTION DEBRIEF\n${'-'.repeat(60)}\n${r.reflection}\n\n`;
    out += `Case Lens is a Vibe Rounds tool · Educational use only, not a diagnostic tool.\n`;
    return out;
  }
  $s('clDownloadTxtBtn').addEventListener('click', ()=>{
    triggerDownload('case-lens-export.txt', buildTextExport(), 'text/plain');
  });
  $s('clResetAllBtn').addEventListener('click', ()=>{
    if(!confirm('Reset everything? This clears the case, all lens outputs, and Phase 3 results. Your saved API key is kept.')) return;
    window.speechSynthesis.cancel();
    clClearSpeakingIcons();
    $s('clCaseText').value = '';
    $s('clCaseSetNote').textContent = '';
    $s('clSelectAll').checked = false;
    CL_LENSES.forEach(l => lensState[l.key] = {status:'idle', output:''});
    conversationLog = [];
    $s('clLensOutputs').innerHTML = '';
    $s('clPhase3Outputs').innerHTML = '';
    renderLensGrid();
    updateEmptyResultsNote();
  });

  updateEmptyResultsNote();
}

const VALID_THEMES = ['simple', 'minimalist', 'terminal'];
function applyTheme(theme){
  if(!VALID_THEMES.includes(theme)) theme = 'simple';
  document.documentElement.setAttribute('data-theme', theme);
  const sel = document.getElementById('themeSelect');
  if(sel) sel.value = theme;
}
function initTheme(){
  let saved = null;
  try{ saved = localStorage.getItem('vibehub_theme'); }catch(e){}
  applyTheme(saved || 'simple');
}
document.getElementById('themeSelect').addEventListener('change', (e) => {
  const next = e.target.value;
  applyTheme(next);
  try{ localStorage.setItem('vibehub_theme', next); }catch(e){}
});

document.getElementById('navSearch').addEventListener('input', e => renderNav(e.target.value));
document.getElementById('menuToggle').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('open');
});

initTheme();
renderNav();
renderHome();
</script>
