// ---- API call ----
async function callModel(userText){
  const provider = providerSel.value;
  const model = modelInput.value.trim();
  const key = keyInput.value.trim();
  history.push({role:'user', content:userText});

  if(provider === 'anthropic'){
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'x-api-key': key,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body: JSON.stringify({
        model: model,
        max_tokens: 4096,
        system: currentSystemPrompt(),
        messages: history
      })
    });
    if(!resp.ok){
      const t = await resp.text();
      throw new Error('API error '+resp.status+': '+t.slice(0,300));
    }
    const data = await resp.json();
    const text = (data.content||[]).map(b=>b.text||'').join('\n').trim();
    history.push({role:'assistant', content:text});
    return text;

  } else if(provider === 'openai'){
    const resp = await fetch('https://api.openai.com/v1/chat/completions', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+key },
      body: JSON.stringify({
        model: model,
        messages: [{role:'system', content: currentSystemPrompt()}, ...history]
      })
    });
    if(!resp.ok){
      const t = await resp.text();
      throw new Error('API error '+resp.status+': '+t.slice(0,300));
    }
    const data = await resp.json();
    const text = data.choices?.[0]?.message?.content?.trim() || '';
    history.push({role:'assistant', content:text});
    return text;

  } else if(provider === 'gemini'){
    const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(key)}`, {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({
        systemInstruction: { parts: [{ text: currentSystemPrompt() }] },
        contents: history.map(h=>({
          role: h.role === 'assistant' ? 'model' : 'user',
          parts: [{ text: h.content }]
        }))
      })
    });
    if(!resp.ok){
      const t = await resp.text();
      throw new Error('API error '+resp.status+': '+t.slice(0,300));
    }
    const data = await resp.json();
    const text = (data.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('\n').trim();
    history.push({role:'assistant', content:text});
    return text;

  } else {
    const endpoint = endpointInput.value.trim();
    const resp = await fetch(endpoint, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+key },
      body: JSON.stringify({
        model: model,
        messages: [{role:'system', content: currentSystemPrompt()}, ...history]
      })
    });
    if(!resp.ok){
      const t = await resp.text();
      throw new Error('API error '+resp.status+': '+t.slice(0,300));
    }
    const data = await resp.json();
    const text = data.choices?.[0]?.message?.content?.trim() || '';
    history.push({role:'assistant', content:text});
    return text;
  }
}

function parseJsonLoose(text){
  let t = text.trim();
  t = t.replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
  const start = t.indexOf('{'); const end = t.lastIndexOf('}');
  if(start>=0 && end>start) t = t.slice(start, end+1);
  return JSON.parse(t);
}

function populateVoices(){
  voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
  if(!voices.length) return;
  voiceSelect.innerHTML = '';
  voices.filter(v=>v.lang.startsWith('en')).concat(voices.filter(v=>!v.lang.startsWith('en')))
    .forEach(v=>{
      const opt = document.createElement('option');
      opt.value = v.name; opt.textContent = v.name + ' (' + v.lang + ')';
      voiceSelect.appendChild(opt);
    });
}
if('speechSynthesis' in window){
  populateVoices();
  window.speechSynthesis.onvoiceschanged = populateVoices;
}

function speakText(text){
  if(!('speechSynthesis' in window) || !text) return;
  window.speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(text);
  hubApplyPreferredVoice(utt);
  const chosenName = voiceSelect.value;
  const v = voices.find(v=>v.name===chosenName);
  if(v) utt.voice = v;
  utt.rate = 1; utt.pitch = 1;
  window.speechSynthesis.speak(utt);
}

  out += 'VIBE ROUNDS - CASE SIMULATOR EXPORT\n';
  out += '====================================\n';
  out += `Case source: ${m.caseSource}\nSpecialty: ${m.specialty}\nSetting: ${m.setting}\nDifficulty: ${m.difficulty}\nStatus: ${m.status}\nTurns: ${m.turns}\nExported: ${m.timestamp}\n\n`;

  out += 'CASE CHAT LOG\n-------------\n';
  transcriptLog.forEach(t=>{
    out += `[${t.who}] ${t.text}\n\n`;
  });

  out += '\nSOAP NOTE\n---------\n';
  out += `S — Subjective:\n${soapState.s || '—'}\n\n`;
  out += `O — Objective:\n${soapState.o || '—'}\n\n`;
  out += `A — Assessment:\n${soapState.a || '—'}\n\n`;
  out += `P — Plan:\n${soapState.p || '—'}\n\n`;

  out += '\nDIFFERENTIAL (RANKED)\n----------------------\n';
  out += ddxState.length ? ddxState.map((d,i)=>`${i+1}. ${d}`).join('\n') : 'Not generated.';
  out += '\n\n';

  out += '\nCLINICAL PEARLS\n---------------\n';
  out += pearlsState.length ? pearlsState.map(p=>`• ${p}`).join('\n') : 'None yet.';
  out += '\n\n';

  if(Object.keys(vitalsState).length){
    out += '\nLATEST VITALS\n-------------\n';
    Object.keys(vitalsState).forEach(k=>{ out += `${k}: ${vitalsState[k]}\n`; });
    out += '\n';
  }
  if(labsState.length){
    out += '\nLABS\n----\n';
    labsState.forEach(l=>{ out += `${l.name}: ${l.value} (${l.flag||'normal'})\n`; });
    out += '\n';
  }
  out += '\n— Vibe Rounds Case Simulator · educational use only, not for real patient care —\n';
  return out;
}


function downloadBlob(content, filename, mime){
  if(mime && mime.indexOf('text/plain') === 0 && window.vrBrandText){
    content = window.vrBrandText(content);
  }
  const blob = new Blob([content], {type: mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

});
document.getElementById('saveHistoryBtnSim').addEventListener('click', ()=>{

  const $c = (id) => document.getElementById(id);

  async function cpCallClaude(apiKey, model, system, msgs){
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body: JSON.stringify({ model, max_tokens:4096, system, messages: msgs.length ? msgs.map(m=>({role:m.role, content:m.content})) : [{role:'user', content:'Begin.'}] })
    });
    if(!res.ok){ const t = await res.text(); throw new Error(res.status + ' ' + t.slice(0,200)); }
    const data = await res.json();
    return (data.content||[]).map(b=>b.text||'').join('\n').trim();
  }
  async function cpCallGemini(apiKey, model, system, msgs){
    const contents = (msgs.length ? msgs : [{role:'user', content:'Begin.'}]).map(m=>({ role: m.role==='assistant' ? 'model' : 'user', parts:[{text:m.content}] }));
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(apiKey)}`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ systemInstruction:{parts:[{text:system}]}, contents })
    });
    if(!res.ok){ const t = await res.text(); throw new Error(res.status + ' ' + t.slice(0,200)); }
    const data = await res.json();
    const cand = data.candidates && data.candidates[0];
    const parts = cand && cand.content && cand.content.parts || [];
    return parts.map(p=>p.text||'').join('\n').trim();
  }
  async function cpCallCustom(endpoint, apiKey, model, system, msgs){
    if(!endpoint) throw new Error('No API endpoint set for this provider.');
    const messages = [{role:'system', content:system}].concat(msgs.length ? msgs : [{role:'user', content:'Begin.'}]);
    const headers = {'Content-Type':'application/json'};
    if(apiKey) headers['Authorization'] = 'Bearer ' + apiKey;
    const res = await fetch(endpoint, { method:'POST', headers, body: JSON.stringify({ model, messages, max_tokens:4096 }) });
    if(!res.ok){ const t = await res.text(); throw new Error(res.status + ' ' + t.slice(0,200)); }
    const data = await res.json();
    if(data.choices && data.choices[0] && data.choices[0].message) return (data.choices[0].message.content || '').trim();
    if(data.message && data.message.content) return data.message.content.trim();
    if(typeof data.content === 'string') return data.content.trim();
    return JSON.stringify(data).slice(0,500);
  }
  async function cpCallOpenAI(apiKey, model, system, msgs){
    const messages = [{role:'system', content:system}].concat(msgs.length ? msgs : [{role:'user', content:'Begin.'}]);
    const res = await fetch('https://api.openai.com/v1/chat/completions', {
      method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer ' + apiKey},
      body: JSON.stringify({ model, messages, max_tokens:4096 })
    });
    if(!res.ok){ const t = await res.text(); throw new Error(res.status + ' ' + t.slice(0,200)); }
    const data = await res.json();
    return (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content || '').trim();
  }

  function beginCase(def){
    state = { stageIndex:0, dxList:[], log:[], caseDef: def };
    $c('cpTermGrid').style.display = 'grid';
    $c('cpDebrief').classList.remove('active');
    $c('cpReasoningBox').value = '';
    renderPearlList();
    renderStageProgress();
    renderTerminal();
    renderDxList();
    $c('cpTermGrid').scrollIntoView({behavior:'smooth', block:'start'});
  }

  $c('cpGenerateCaseBtn').addEventListener('click', generateCase);

  async function generateCase(){
    const statusEl = $c('cpGenStatus');
    const provider = hubActiveProvider();
    const keys = loadKeys(), models = loadModels(), endpoints = loadEndpoints();
    const apiKey = keys[provider];
    const model = models[provider] || PROVIDERS[provider].modelPlaceholder;
    const p = PROVIDERS[provider];
    if(!apiKey && !p.needsEndpoint){
      statusEl.textContent = 'Add an API key in Setup first, then try again.';
      statusEl.className = 'gen-status error';
      return;
    }
    if(p.needsEndpoint && !endpoints[provider]){
      statusEl.textContent = 'Add an API endpoint URL in Setup first.';
      statusEl.className = 'gen-status error';
      return;
    }
    const topic = $c('cpCaseTopic').value.trim();
    const difficulty = $c('cpCaseDifficulty').value;
    statusEl.textContent = 'Generating case…';
    statusEl.className = 'gen-status busy';
    $c('cpGenerateCaseBtn').disabled = true;

    const system = `You are a clinical case-writer for a medical education tool. Generate ONE realistic, internally consistent clinical case for stepwise reveal.

Respond with ONLY valid JSON, no markdown fences, no commentary, matching exactly this shape:
{
  "name": "short case title, e.g. 'Chest Pain, 58M'",
  "stages": [
    {"label": "Chief complaint", "text": "...", "pearl": "one clinical reasoning pearl tied specifically to what this stage reveals"},
    {"label": "History", "text": "...", "pearl": "..."},
    {"label": "Exam & vitals", "text": "...", "pearl": "..."},
    {"label": "Labs" (or "Imaging" or other relevant workup label), "text": "...", "pearl": "..."},
    {"label": "Course", "text": "...", "pearl": "..."}
  ],
  "finalDx": "the actual diagnosis",
  "teaching": ["teaching point 1", "teaching point 2", "teaching point 3"]
}
Use 5-7 stages total, ending with a "Course" stage. Each stage should reveal new information, building toward the diagnosis without giving it away too early. Each stage's "pearl" must be a short (1-2 sentence), stage-specific clinical reasoning insight about THIS case — e.g. what the data at that stage should or shouldn't change about the differential, a trap it's easy to fall into at that exact point, or why that finding matters. Do not write generic definitions of cognitive biases — every pearl must reference specifics of this case.`;

    const userPrompt = `Generate a case.${topic ? ' Topic/specialty focus: ' + topic + '.' : ' Any specialty.'}${difficulty && difficulty !== 'Any' ? ' Target learner level: ' + difficulty + '.' : ''}`;

    try{
      let raw;
      if(provider === 'claude') raw = await cpCallClaude(apiKey, model, system, [{role:'user', content:userPrompt}]);
      else if(provider === 'gemini') raw = await cpCallGemini(apiKey, model, system, [{role:'user', content:userPrompt}]);
      else if(provider === 'other') raw = await cpCallCustom(endpoints['other'], apiKey, model, system, [{role:'user', content:userPrompt}]);
      else raw = await cpCallOpenAI(apiKey, model, system, [{role:'user', content:userPrompt}]);
      const cleaned = raw.replace(/^```json\s*/i,'').replace(/^```\s*/,'').replace(/```\s*$/,'').trim();
      const parsed = JSON.parse(cleaned);
      if(!parsed.stages || !parsed.stages.length || !parsed.finalDx) throw new Error('Model response was missing required fields.');
      const def = {
        id: 'gen-' + Date.now(),
        name: parsed.name || 'Generated case',
        stages: parsed.stages,
        finalDx: parsed.finalDx,
        teaching: parsed.teaching || []
      };
      statusEl.textContent = '';
      statusEl.className = 'gen-status';
      beginCase(def);
    } catch(err){
      statusEl.textContent = 'Could not generate a case: ' + err.message;
      statusEl.className = 'gen-status error';
    } finally {
      $c('cpGenerateCaseBtn').disabled = false;
    }
  }

  function currentCase(){ return state.caseDef; }

  function renderStageProgress(){
    const def = currentCase();
    const el = $c('cpStageProgress');
    el.innerHTML = '';
    def.stages.forEach((s,i) => {
      const d = document.createElement('span');
      d.className = 'stage-dot' + (i < state.stageIndex ? ' done' : i === state.stageIndex ? ' current' : '');
      d.textContent = (i+1) + '. ' + s.label;
      el.appendChild(d);
    });
  }

  function renderTerminal(){
    const def = currentCase();
    const screen = $c('cpTermScreen');
    screen.innerHTML = '';
    for(let i=0;i<=state.stageIndex && i<def.stages.length;i++){
      const s = def.stages[i];
      const line = document.createElement('div');
      line.className = 'term-line';
      line.innerHTML = `<div class="prompt">$ reveal --stage="${s.label}"</div><div class="stage-label">${s.label}</div><div class="body-text">${s.text}</div>`;
      screen.appendChild(line);
      const logEntry = state.log.find(l => l.stageIndex === i);
      if(logEntry && logEntry.text){
        const userLine = document.createElement('div');
        userLine.className = 'term-line user';
        userLine.innerHTML = `<span class="arrow">→</span> ${logEntry.text}`;
        screen.appendChild(userLine);
      }
    }
    const cursorLine = document.createElement('div');
    cursorLine.className = 'term-line';
    cursorLine.innerHTML = `<span class="prompt">$</span> <span class="term-cursor"></span>`;
    screen.appendChild(cursorLine);
    screen.scrollTop = screen.scrollHeight;
  }

  function saveReasoningForCurrentStage(){
    const text = $c('cpReasoningBox').value.trim();
    const existing = state.log.find(l => l.stageIndex === state.stageIndex);
    if(existing){ existing.text = text; existing.dxSnapshot = state.dxList.map(d => ({...d})); }
    else { state.log.push({stageIndex: state.stageIndex, text, dxSnapshot: state.dxList.map(d => ({...d}))}); }
  }

  $c('cpRevealBtn').addEventListener('click', () => {
    if(!state) return;
    saveReasoningForCurrentStage();
    const def = currentCase();
    if(state.stageIndex < def.stages.length - 1){
      state.stageIndex++;
      $c('cpReasoningBox').value = '';
      renderStageProgress();
      renderTerminal();
      renderPearlList();
    } else {
      $c('cpRevealBtn').disabled = true;
    }
  });

  $c('cpLockBtn').addEventListener('click', () => {
    if(!state) return;
    saveReasoningForCurrentStage();
    showDebrief();
  });

  $c('cpResetBtn').addEventListener('click', () => {
    if(!state) return;
    beginCase(state.caseDef);
  });

  $c('cpNewCaseBtn').addEventListener('click', () => {
    $c('cpDebrief').classList.remove('active');
    $c('cpTermGrid').style.display = 'none';
    container.scrollIntoView({behavior:'smooth', block:'start'});
  });

  $c('cpDxAddBtn').addEventListener('click', addDx);
  $c('cpDxInput').addEventListener('keydown', e => { if(e.key === 'Enter') addDx(); });

  function addDx(){
    if(!state) return;
    const input = $c('cpDxInput');
    const val = input.value.trim();
    if(!val) return;
    state.dxList.push({name:val, status:'considering'});
    input.value = '';
    renderDxList();
  }

  function cycleStatus(idx){
    const order = ['considering','leading','ruled-out'];
    const dx = state.dxList[idx];
    dx.status = order[(order.indexOf(dx.status)+1) % order.length];
    renderDxList();
  }

  function removeDx(idx){
    state.dxList.splice(idx,1);
    renderDxList();
  }

  function renderDxList(){
    const list = $c('cpDxList');
    const empty = $c('cpDxEmpty');
    list.innerHTML = '';
    empty.style.display = state.dxList.length ? 'none' : 'block';
    state.dxList.forEach((dx, i) => {
      const item = document.createElement('div');
      item.className = 'dx-item';
      item.innerHTML = `
        <span class="dx-name">${dx.name}</span>
        <span class="dx-status" data-s="${dx.status}">${dx.status.replace('-',' ')}</span>
        <button class="dx-remove" title="Remove">✕</button>`;
      item.querySelector('.dx-status').onclick = () => cycleStatus(i);
      item.querySelector('.dx-remove').onclick = () => removeDx(i);
      list.appendChild(item);
    });
  }

  function renderPearlList(){
    const el = $c('cpPearlList');
    el.innerHTML = '';
    if(!state) return;
    const def = currentCase();
    const revealed = [];
    for(let i=0; i<=state.stageIndex && i<def.stages.length; i++){
      const s = def.stages[i];
      if(s.pearl) revealed.push({label: s.label, pearl: s.pearl});
    }
    if(!revealed.length){
      const empty = document.createElement('div');
      empty.className = 'empty-note';
      empty.textContent = 'No pearls for this case yet — they surface here as the case unfolds.';
      el.appendChild(empty);
      return;
    }
    revealed.reverse().forEach(r => {
      const row = document.createElement('div');
      row.className = 'pearl-item';
      row.innerHTML = `<span class="pearl-mark">◆</span><span><strong>${r.label}.</strong> ${r.pearl}</span>`;
      el.appendChild(row);
    });
  }

  $c('cpPearlToggle').addEventListener('click', () => {
    const list = $c('cpPearlList');
    const arrow = $c('cpPearlArrow');
    const open = list.style.display !== 'none';
    list.style.display = open ? 'none' : 'flex';
    arrow.classList.toggle('open', !open);
  });

  function showDebrief(){
    const def = currentCase();
    $c('cpFinalDxBanner').innerHTML = `<span class="label">Actual diagnosis</span>${def.finalDx}`;

    const trailEl = $c('cpDebriefTrail');
    trailEl.textContent = state.log
      .sort((a,b)=>a.stageIndex-b.stageIndex)
      .map(l => `[${def.stages[l.stageIndex].label}]\n${l.text || '(no notes logged)'}`)
      .join('\n\n');

    const dxEl = $c('cpDebriefDx');
    const finalLeading = state.dxList.filter(d => d.status === 'leading').map(d => d.name);
    const finalRuledOut = state.dxList.filter(d => d.status === 'ruled-out').map(d => d.name);
    const finalConsidering = state.dxList.filter(d => d.status === 'considering').map(d => d.name);
    dxEl.innerHTML = `
      <p><strong>Leading:</strong> ${finalLeading.length ? finalLeading.join(', ') : '—'}</p>
      <p><strong>Still considering:</strong> ${finalConsidering.length ? finalConsidering.join(', ') : '—'}</p>
      <p><strong>Ruled out:</strong> ${finalRuledOut.length ? finalRuledOut.join(', ') : '—'}</p>
    `;

    const tpEl = $c('cpTeachingPoints');
    tpEl.innerHTML = '<h3 style="font-size:13px;color:var(--bronze-bright);text-transform:uppercase;letter-spacing:.05em;margin-top:20px;">Teaching points</h3>';
    def.teaching.forEach(t => {
      const div = document.createElement('div');
      div.className = 'teaching-point';
      div.textContent = t;
      tpEl.appendChild(div);
    });

    $c('cpDebrief').classList.add('active');
    $c('cpDebrief').scrollIntoView({behavior:'smooth', block:'start'});
  }

  function buildCasePracticeExportText(){
    const def = currentCase();
    let out = `VIBE ROUNDS — CASE PRACTICE SESSION NOTES\nCase: ${def.name}\n\n`;
    state.log.sort((a,b)=>a.stageIndex-b.stageIndex).forEach(l => {
      out += `--- ${def.stages[l.stageIndex].label} ---\n${def.stages[l.stageIndex].text}\n\nMy reasoning: ${l.text || '(none logged)'}\n\n`;
    });
    out += `\nFINAL DIFFERENTIAL\nLeading: ${state.dxList.filter(d=>d.status==='leading').map(d=>d.name).join(', ') || '—'}\nConsidering: ${state.dxList.filter(d=>d.status==='considering').map(d=>d.name).join(', ') || '—'}\nRuled out: ${state.dxList.filter(d=>d.status==='ruled-out').map(d=>d.name).join(', ') || '—'}\n\nACTUAL DIAGNOSIS\n${def.finalDx}\n\nCLINICAL PEARLS\n${def.stages.filter(s=>s.pearl).map(s=>`- [${s.label}] ${s.pearl}`).join('\n') || '(none)'}\n\nTEACHING POINTS\n${def.teaching.map(t=>'- '+t).join('\n')}\n`;
    return out;
  }

  $c('cpExportBtn').addEventListener('click', () => {
    const def = currentCase();
    const out = window.vrBrandText ? window.vrBrandText(buildCasePracticeExportText()) : buildCasePracticeExportText();
    const blob = new Blob([out], {type:'text/plain'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `case-practice_${def.id}.txt`;
    a.click();
    URL.revokeObjectURL(url);
  });

  $c('cpSaveHistoryBtn').addEventListener('click', () => {
    saveToHistoryFlash($c('cpSaveHistoryBtn'), 'Case Practice', buildCasePracticeExportText());
  });

  $c('cpResetRunBtn').addEventListener('click', () => {
    if(!confirm('Reset this run? This will clear the current case and return to setup.')) return;
    state = null;
    $c('cpDebrief').classList.remove('active');
    $c('cpTermGrid').style.display = 'none';
    $c('cpGenStatus').textContent = '';
    $c('cpGenStatus').className = 'gen-status';
    container.scrollIntoView({behavior:'smooth', block:'start'});
  });
}

      prompt:`Apply Domain 1 — The Decision Itself — to this case. Generate 5-7 patient-voiced, first-person questions that clarify what is actually being decided: variants of "What exactly am I being asked to decide right now?", "Is this decision urgent, or do I have time to think about it?", "Who is making this decision — me, my family, or the team, and whose decision is it supposed to be?", "What happens if I don't decide today?", and whether "doing nothing for now" is actually one of the choices even if no one has said so. Then generate 3-4 questions that test whether the decision has been artificially narrowed into a false binary — other unmentioned options, variations in dose/timing/partial approaches, or whether the choice has been shaped by what's available/covered here rather than what exists everywhere. Flag explicitly if the case data itself only presents one option. Phrase every question in first person, as the patient would say it aloud, not in clinical third person.` },
    { id: 2, key:"options", name:"Options on the Table",
      focus:"Full option list including doing nothing, side-by-side comparison across every option present",
      prompt:`Apply Domain 2 — Options on the Table — to this case. Generate 5-6 patient-voiced questions that force a complete option list to surface, including under-discussed ones: "What are all the ways this could be managed, including watching and waiting?", "Is there a non-surgical / non-pharmacological option I haven't been told about?", "What would happen if I chose to do nothing at all?", "Are there options that exist but aren't offered here — at another centre, on a trial, or through a specialist?" — calibrated to the specific decision type in the case (surgical vs. medication vs. screening vs. goals-of-care). Then, for each option actually identified in the case data, generate one parallel comparison question ("For [Option], what would my day-to-day life actually look like?"), repeated for every option present. Close with a question asking the clinician to describe what a "good outcome" and a "bad outcome" would look like for each option, in plain terms.` },
    { id: 3, key:"benefits", name:"Benefits & Harms",
      focus:"Specific/numeric benefit, harm and trade-off specificity, who has weighed gain vs. loss",
      prompt:`Apply Domain 3 — Benefits & Harms — to this case. Generate questions that push past vague reassurance toward specific, numeric, or concrete answers: "What specifically will get better, and by when, if I choose this option?", "Out of 100 people like me who choose this, roughly how many are helped in the way I'd care about?", "Is the benefit about living longer, feeling better, or both — and which one does this option actually target?", "What does 'success' mean here, in terms I would notice in my own life, not just in test results?" Then generate the harm-side counterpart: most common side effects/complications and how often, the worst realistic outcome even if rare, symptoms or losses nobody has mentioned yet (pain, fatigue, appearance, function, independence), and whether a harm would only become clear months or years later. Close with a synthesis question asking who has actually weighed the gains against the losses — the team, or is it being left to the patient alone.` },
    { id: 4, key:"certainty", name:"Certainty & Evidence Quality",
      focus:"How confident anyone is, whether evidence applies to this patient, source and bias of the numbers",
      prompt:`Apply Domain 4 — Certainty & Evidence Quality — to this case. Generate patient-voiced questions that surface how confident the evidence actually is, without requiring the patient to understand statistics: "How much evidence is there for this option — has it been well studied, or is this based on a smaller or newer body of research?", "Is this recommendation based on strong trial evidence, or is it more of an expert best-guess for a case like mine?", "Is there anything about my specific situation — my age, other conditions, or history — that makes the usual evidence less certain to apply to me?", "What don't we know yet that could change this decision later?" Then generate questions clarifying the source and possible bias of any numbers presented: where the numbers come from (this hospital's own results vs. a national average vs. a study population that may not look like the patient), whether a second opinion or multidisciplinary discussion has been sought, and whether a different specialist would likely give a different answer and why.` },
    { id: 5, key:"values", name:"Fit With What Matters to Me",
      focus:"Patient's own values elicitation, then matching each option against those stated values",
      prompt:`Apply Domain 5 — Fit With What Matters to Me — to this case. This domain generates questions the patient asks THEMSELVES, not the clinician, to clarify their own values. Generate 5-6 self-directed reflective questions: "What matters most to me right now — living as long as possible, staying independent, staying comfortable, being able to keep doing a specific activity or role?", "What would I be most afraid of losing if this goes badly?", "Is there a line I would not want crossed, regardless of the medical benefit?", "Whose voice, if anyone, do I want in this decision with me?" — incorporating any patient values already documented in the case data directly into the phrasing rather than asking generically. Then generate questions that connect those stated values to the specific options on the table: "Given that [stated value] matters most to me, which of these options is actually built around that, and which one isn't?", whether an option technically works clinically but doesn't fit how the patient wants to live, and whether anyone asked what matters to the patient before an option was recommended.` },
    { id: 6, key:"logistics", name:"Practical & Logistical Reality",
      focus:"Time, cost, and burden of each option; support and preparation needed to actually carry it out",
      prompt:`Apply Domain 6 — Practical & Logistical Reality — to this case. Generate questions covering the non-clinical costs of each option: how much time it will take (appointments, recovery, travel) and whether that fits into the patient's life, what it will cost and whether any of it is covered, whether the patient will need a carer or someone to take time off work and whether that person has been asked if they can, and what happens to the patient's other responsibilities (work, children, caregiving they already do) while going through this. Then generate questions about what the patient would need in place to actually carry out each option: equipment or changes needed at home before starting, who to contact if something goes wrong after hours or after discharge, and whether support is available to help decide — a decision aid, a patient navigator, or a second conversation after time to think.` },

  async function extractPdfText(arrayBuffer){

      const content = await page.getTextContent();
      text += content.items.map(it=>it.str).join(' ') + '\n\n';
    }
    return text.trim();
  }

  /* ---- API calls (reuse hub's shared key/model storage) ---- */
  async function callModel(systemPrompt, messages){
    const provider = hubActiveProvider();
    const keys = loadKeys(), models = loadModels(), endpoints = loadEndpoints();
    const apiKey = keys[provider];
    const model = models[provider] || PROVIDERS[provider].modelPlaceholder;
    if(!apiKey && !PROVIDERS[provider].needsEndpoint){
      throw new Error(`No API key saved for ${PROVIDERS[provider].label}. Add one in Setup.`);
    }
    if(provider === 'claude'){
      const resp = await fetch('https://api.anthropic.com/v1/messages', {
        method:'POST',
        headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
        body: JSON.stringify({ model, max_tokens:4096, system: systemPrompt, messages: messages.map(m=>({role:m.role==='assistant'?'assistant':'user', content:m.content})) })
      });
      const data = await resp.json();
      if(data.error) throw new Error(data.error.message || JSON.stringify(data.error));
      return (data.content||[]).map(c=>c.text||'').join('\n');
    }
    if(provider === 'gemini'){
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
      const contents = messages.map(m=>({role: m.role==='assistant'?'model':'user', parts:[{text:m.content}]}));
      const resp = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ systemInstruction: {parts:[{text:systemPrompt}]}, contents }) });
      const data = await resp.json();
      if(data.error) throw new Error(data.error.message || JSON.stringify(data.error));
      return (data.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('\n');
    }
    const endpoint = provider === 'openai' ? 'https://api.openai.com/v1/chat/completions' : endpoints[provider];
    if(!endpoint) throw new Error('No API endpoint set for this provider.');
    const resp = await fetch(endpoint, {
      method:'POST',
      headers:{'Content-Type':'application/json', 'Authorization': 'Bearer ' + apiKey},
      body: JSON.stringify({ model, messages: [{role:'system', content:systemPrompt}, ...messages], max_tokens:4096 })
    });
    const data = await resp.json();
    if(data.error) throw new Error(data.error.message || JSON.stringify(data.error));
    return data.choices?.[0]?.message?.content || '';
  }

  async function runLens(key){
    const lens = SL_LENSES.find(l=>l.key===key);
    const caseText = $s('slCaseText').value.trim();
    if(!caseText){ alert('Paste a case first (Step 1).'); return; }
    lensState[key].status = 'running';
    $s('sl-card-'+key).classList.add('running');
    ensureOutputBlock(key, `Lens ${lens.id} — ${lens.name}`, lens.focus);
    $s('sl-body-'+key).innerHTML = `<div class="loading-line">running<span class="dots"><span>.</span><span>.</span><span>.</span></span></div>`;
    const userMsg = `CASE:\n${caseText}\n\n${lens.prompt}`;
    try{
      const output = await callModel(SL_AUDITOR_SYSTEM, [{role:'user', content: userMsg}]);
      lensState[key] = {status:'done', output};
      conversationLog.push({lens: lens.name, id: lens.id, output});
      $s('sl-body-'+key).innerHTML = formatOutput(output);
      $s('sl-card-'+key).classList.remove('running');
      $s('sl-card-'+key).classList.add('done');
    }catch(err){
      lensState[key].status = 'idle';
      $s('sl-card-'+key).classList.remove('running');
      $s('sl-body-'+key).innerHTML = `<span style="color:var(--alert)">Error: ${err.message}</span>`;
    }
    updateDoneCount();
  }

  function buildPhase3Context(){
    if(conversationLog.length === 0) return null;
    const caseText = $s('slCaseText').value.trim();
    let ctx = `CASE:\n${caseText}\n\nOutputs generated so far across the 7 domains:\n\n`;
    conversationLog.forEach(c => { ctx += `--- Lens ${c.id} — ${c.lens} ---\n${c.output}\n\n`; });
    return ctx;
  }
  async function runPhase3(promptText, title, targetId){
    const ctx = buildPhase3Context();
    if(!ctx){ alert('Run at least one lens first — Phase 3 consolidates what the lenses generated.'); return; }
    let el = document.getElementById('sl-out-'+targetId);
    if(!el){
      el = document.createElement('div');
      el.className = 'output-block';
      el.id = 'sl-out-'+targetId;
      el.innerHTML = `<h3>${title}<span class="spacer"><button type="button" class="tts-btn" data-speak="${targetId}" aria-label="Read aloud" title="Read aloud">${RS_TTS_ICON}</button></span></h3><div class="output-body" id="sl-body-${targetId}"><div class="loading-line">running<span class="dots"><span>.</span><span>.</span><span>.</span></span></div></div>`;
      $s('slPhase3Outputs').appendChild(el);
      el.querySelector('[data-speak]').addEventListener('click', ()=> slToggleSpeak(targetId, el.querySelector('[data-speak]')));
      updateEmptyResultsNote();
    } else {
      $s('sl-body-'+targetId).innerHTML = `<div class="loading-line">running<span class="dots"><span>.</span><span>.</span><span>.</span></span></div>`;
    }
    try{
      const output = await callModel(SL_AUDITOR_SYSTEM, [{role:'user', content: ctx + '\n\n' + promptText}]);
      $s('sl-body-'+targetId).innerHTML = formatOutput(output);
    }catch(err){
      $s('sl-body-'+targetId).innerHTML = `<span style="color:var(--alert)">Error: ${err.message}</span>`;
    }
  }
  $s('slQuestionSetBtn').addEventListener('click', ()=> runPhase3(SL_ROLLUP_PROMPT, 'Phase 3 · Patient Question Set', 'rollup'));
  $s('slAsk3Btn').addEventListener('click', ()=> runPhase3(SL_ASK3_PROMPT, 'Phase 3 · "Ask 3" Priority Distillation', 'ask3'));
  $s('slGapsBtn').addEventListener('click', ()=> runPhase3(SL_GAPS_PROMPT, 'Phase 3 · Gaps in the Case Data', 'gaps'));
  $s('slReflectionBtn').addEventListener('click', ()=> runPhase3(SL_REFLECTION_PROMPT, 'Phase 3 · Reflection Debrief', 'reflection'));

  /* ---- text-to-speech ---- */
  const slSpeechSupported = 'speechSynthesis' in window;
  let slCurrentSpeakId = null;
  function slPlainTextOf(id){ const bodyEl = document.getElementById('sl-body-'+id); return bodyEl ? bodyEl.innerText.trim() : ''; }
  function slClearSpeakingIcons(){ document.querySelectorAll('.sl-tool .tts-btn.speaking').forEach(b=>b.classList.remove('speaking')); slCurrentSpeakId = null; }
  function slToggleSpeak(id, btn){
    if(!slSpeechSupported){ alert('Text-to-speech is not supported in this browser.'); return; }
    if(slCurrentSpeakId === id){ window.speechSynthesis.cancel(); slClearSpeakingIcons(); return; }
    window.speechSynthesis.cancel();
    slClearSpeakingIcons();
    const text = slPlainTextOf(id);
    if(!text) return;
    const utter = new SpeechSynthesisUtterance(text);
    hubApplyPreferredVoice(utter);
    utter.onend = slClearSpeakingIcons;
    utter.onerror = slClearSpeakingIcons;
    slCurrentSpeakId = id;
    btn.classList.add('speaking');
    window.speechSynthesis.speak(utter);
  }
  $s('slSpeakAllBtn').addEventListener('click', ()=>{
    if(!slSpeechSupported){ alert('Text-to-speech is not supported in this browser.'); return; }
    window.speechSynthesis.cancel();
    slClearSpeakingIcons();
    const ids = [
      ...SL_LENSES.map(l=>l.key).filter(k => lensState[k].status==='done'),
      ...['rollup','ask3','gaps','reflection'].filter(id => document.getElementById('sl-out-'+id))
    ];
    if(ids.length === 0){ alert('No outputs to read yet — run a lens or Phase 3 step first.'); return; }
    let i = 0;
    function speakNext(){
      if(i >= ids.length){ slClearSpeakingIcons(); return; }
      const id = ids[i];
      const text = slPlainTextOf(id);
      i++;
      if(!text){ speakNext(); return; }
      const utter = new SpeechSynthesisUtterance(text);
      hubApplyPreferredVoice(utter);
      utter.onend = speakNext;
      utter.onerror = speakNext;
      window.speechSynthesis.speak(utter);
    }
    speakNext();
  });
  $s('slStopSpeakBtn').addEventListener('click', ()=>{ window.speechSynthesis.cancel(); slClearSpeakingIcons(); });

  /* ---- export / reset ---- */
  function collectResults(){
    const caseText = $s('slCaseText').value.trim();
    const lensResults = SL_LENSES.filter(l => lensState[l.key].status === 'done').map(l => ({ id:l.id, name:l.name, focus:l.focus, output: lensState[l.key].output }));
    const rollupEl = document.getElementById('sl-body-rollup');
    const ask3El = document.getElementById('sl-body-ask3');
    const gapsEl = document.getElementById('sl-body-gaps');
    const reflectionEl = document.getElementById('sl-body-reflection');
    return {
      caseText, lensResults,
      rollup: rollupEl ? rollupEl.innerText.trim() : '',
      ask3: ask3El ? ask3El.innerText.trim() : '',
      gaps: gapsEl ? gapsEl.innerText.trim() : '',
      reflection: reflectionEl ? reflectionEl.innerText.trim() : ''
    };
  }
  function triggerDownload(filename, content, mime){
    if(mime && mime.indexOf('text/plain') === 0 && window.vrBrandText){
      content = window.vrBrandText(content);
    }
    const blob = new Blob([content], {type: mime});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }
  function buildTextExport(){
    const r = collectResults();
    let out = `SDM LENS — 7-DOMAIN SHARED DECISION-MAKING QUERY GENERATOR\n`;
    out += `Generated: ${new Date().toLocaleString()}\n`;
    out += `${'='.repeat(60)}\n\nCASE\n${'-'.repeat(60)}\n${r.caseText || '(no case entered)'}\n\n`;
    if(r.lensResults.length === 0){ out += `No domains have been run yet.\n\n`; }
    else { r.lensResults.forEach(l=>{ out += `DOMAIN ${l.id} — ${l.name}\n${l.focus}\n${'-'.repeat(60)}\n${l.output}\n\n`; }); }
    if(r.rollup) out += `PHASE 3 — PATIENT QUESTION SET\n${'-'.repeat(60)}\n${r.rollup}\n\n`;
    if(r.ask3) out += `PHASE 3 — "ASK 3" PRIORITY DISTILLATION\n${'-'.repeat(60)}\n${r.ask3}\n\n`;
    if(r.gaps) out += `PHASE 3 — GAPS IN THE CASE DATA\n${'-'.repeat(60)}\n${r.gaps}\n\n`;
    if(r.reflection) out += `PHASE 3 — REFLECTION DEBRIEF\n${'-'.repeat(60)}\n${r.reflection}\n\n`;
    out += `SDM Lens is a Vibe Rounds tool · Educational use only, not a clinical decision aid.\n`;
    return out;
  }
  $s('slDownloadTxtBtn').addEventListener('click', ()=>{
    triggerDownload('sdm-lens-export.txt', buildTextExport(), 'text/plain');
  });
  $s('slSaveHistoryBtn').addEventListener('click', ()=>{
    saveToHistoryFlash($s('slSaveHistoryBtn'), 'SDM Lens', buildTextExport());
  });
  $s('slResetAllBtn').addEventListener('click', ()=>{
    if(!confirm('Reset everything? This clears the case, all domain outputs, and Phase 3 results. Your saved API key is kept.')) return;
    window.speechSynthesis.cancel();
    slClearSpeakingIcons();
    $s('slCaseText').value = '';
    $s('slCaseSetNote').textContent = '';
    $s('slSelectAll').checked = false;
    SL_LENSES.forEach(l => lensState[l.key] = {status:'idle', output:''});
    conversationLog = [];
    $s('slLensOutputs').innerHTML = '';
    $s('slPhase3Outputs').innerHTML = '';
    renderLensGrid();
    updateEmptyResultsNote();
  });

  updateEmptyResultsNote();
}

  const EBM_SAMPLE_CASE = `62-year-old woman with type 2 diabetes and hypertension presents with 3 months of\nexertional dyspnea and bilateral ankle swelling. Echocardiogram shows LVEF 38%.\nCurrently on metformin, lisinopril 10mg, and amlodipine. She is asking whether starting\nan SGLT2 inhibitor is worth it, and says her main priority is "staying out of the hospital\nand being able to walk my dog without stopping to catch my breath."`;

            <input type="file" id="ebmCaseFile" accept=".txt,.md,.pdf,.docx" hidden>
            <button type="button" class="secondary small" id="ebmCaseFileBtn">Choose file</button>
            <span class="file-picker-name" id="ebmCaseFileName">No file selected</span>
          </div>

        </div>
      </div>

      <div class="field-actions">
        <button class="secondary small" id="ebmSampleCaseBtn" type="button">Load sample case</button>
        <button class="secondary small" id="ebmClearCaseBtn" type="button">Clear case</button>
      </div>
      <div class="hint" id="ebmCaseSetNote"></div>
    </div>
  </div>

  <div class="step">
    <div class="step-label collapsed" id="ebm-label-types"><span class="num">2</span>Generate EBM Queries<span class="collapse-arrow" id="ebm-arrow-types">&#9662;</span></div>
    <div class="card collapsed" id="ebm-card-types">
      <div class="hint" style="margin-top:0;">Choose the decision point(s) this case raises. Each becomes a separate query thread with its own question type, study design, PICO(T), search string, and appraisal-checklist pointer.</div>
      <div class="select-all-row">
        <label><input type="checkbox" id="ebmSelectAllTypes"> Select all question types</label>
      </div>
      <div class="lens-grid" id="ebmTypeGrid"></div>
      <button id="ebmRunGenerateBtn" type="button" style="margin-top:14px;">▶ Generate queries</button>
    </div>

  <div class="step">
    <div class="step-label collapsed" id="ebm-label-closure"><span class="num">3</span>Closure / Review<span class="collapse-arrow" id="ebm-arrow-closure">&#9662;</span></div>
    <div class="card collapsed" id="ebm-card-closure">
      <div class="hint" style="margin-top:0;">Run after at least one query thread has produced output — these consolidate everything generated so far.</div>
      <div class="phase3-buttons">
        <button id="ebmStressTestBtn" type="button">▶ Stress-Test Queries</button>
        <button id="ebmPatientPriorityBtn" type="button">▶ Restate Patient Priority</button>
      </div>
    </div>
  </div>

  <hr class="divider">

  <div class="results-header">
    <h2>Results</h2>
    <div class="results-actions">
      <button class="secondary small" id="ebmSpeakAllBtn" type="button">🔊 Read all aloud</button>
      <button class="secondary small" id="ebmStopSpeakBtn" type="button">⏹ Stop reading</button>
      <button class="secondary small" id="ebmDownloadTxtBtn" type="button">Download .txt</button>
      <button class="secondary small" id="ebmSaveHistoryBtn" type="button">Save to History</button>
      <button class="danger small" id="ebmResetAllBtn" type="button">Reset run</button>
    </div>
  </div>
  <div class="error-note" id="ebmErrorNote"></div>
  <div id="ebmResultsOutputs"></div>
  <div class="empty-note" id="ebmEmptyResultsNote">No outputs yet — run a query generation or a Closure/Review step above to see results here.</div>
  </div>
  `;

  const $s = (id) => document.getElementById(id);
  hubPersistField($s('ebmCaseText'), 'hub_ebm_case');
  let ebmResults = [];
  let ebmResultCount = 0;

  function setupCollapse(labelId, cardId){
    const label = $s(labelId);
    const card = $s(cardId);
    label.addEventListener('click', ()=>{
      const nowCollapsed = !card.classList.contains('collapsed');
      card.classList.toggle('collapsed', nowCollapsed);
      label.classList.toggle('collapsed', nowCollapsed);

  setupCollapse('ebm-label-case', 'ebm-card-case');
  setupCollapse('ebm-label-types', 'ebm-card-types');
  setupCollapse('ebm-label-closure', 'ebm-card-closure');

  /* ---- Case handling (mirrors SDM Lens) ---- */
  $s('ebmSampleCaseBtn').addEventListener('click', ()=>{
    $s('ebmCaseText').value = EBM_SAMPLE_CASE;
    $s('ebmCaseSetNote').textContent = "Sample dummy case loaded — replace with your own case before relying on this run.";
    updateLinkDetect();
  });
  $s('ebmClearCaseBtn').addEventListener('click', ()=>{
    $s('ebmCaseText').value = '';
    $s('ebmCaseSetNote').textContent = '';
    $s('ebmCaseFile').value = '';
    $s('ebmUrlFetchNote').textContent = '';
    $s('ebmFileUploadNote').textContent = '';
    setFileName('No file selected', false);
    updateLinkDetect();
  });

  const EBM_MAX_FILE_BYTES = 10 * 1024 * 1024;
  if(window.pdfjsLib){
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }

  function setNote(id, text, cls){
    const el = $s(id);
    el.textContent = text;
    el.className = 'hint' + (cls ? ' '+cls : '');
  }
  function appendToCaseText(text, sourceLabel){
    const ta = $s('ebmCaseText');
    const existing = ta.value.trim();
    ta.value = existing ? existing + '\n\n---\n\n' + text.trim() : text.trim();
    $s('ebmCaseSetNote').textContent = sourceLabel;
  }
  async function extractPdfText(arrayBuffer){
    if(!window.pdfjsLib) throw new Error('PDF library failed to load.');
    const pdf = await pdfjsLib.getDocument({data: arrayBuffer}).promise;
    let text = '';
    for(let i=1; i<=pdf.numPages; i++){
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      text += content.items.map(it=>it.str).join(' ') + '\n\n';
    }
    return text.trim();
  }
  async function extractDocxText(arrayBuffer){
    if(!window.mammoth) throw new Error('DOCX library failed to load.');
    const result = await mammoth.extractRawText({arrayBuffer});
    return result.value.trim();
  }

  const EBM_URL_ONLY_RE = /^(https?:\/\/[^\s]+|www\.[^\s]+|[a-z0-9-]+\.[a-z]{2,}(\/[^\s]*)?)$/i;
  function looksLikeUrlOnly(text){
    const t = text.trim();
    if(!t || /\s/.test(t)) return false;
    return EBM_URL_ONLY_RE.test(t);
  }
  function updateLinkDetect(){
    const ta = $s('ebmCaseText');
    const row = $s('ebmLinkDetectRow');
    const isUrl = looksLikeUrlOnly(ta.value);
    row.style.display = isUrl ? 'flex' : 'none';
    if(!isUrl) $s('ebmUrlFetchNote').textContent = '';
  }
  $s('ebmCaseText').addEventListener('input', updateLinkDetect);

  $s('ebmCaseFileBtn').addEventListener('click', ()=>{ $s('ebmCaseFile').click(); });
  function setFileName(text, isSet){
    const el = $s('ebmCaseFileName');
    el.textContent = text;
    el.className = 'file-picker-name' + (isSet ? ' set' : '');
  }
  $s('ebmCaseFile').addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    if(!file){ setFileName('No file selected', false); return; }
    const noteId = 'ebmFileUploadNote';
    setFileName(file.name, true);
    if(file.size > EBM_MAX_FILE_BYTES){
      setNote(noteId, `"${file.name}" is ${(file.size/1024/1024).toFixed(1)} MB — max allowed is 10 MB.`, 'error');
      e.target.value = ''; setFileName('No file selected', false);
      return;
    }
    const ext = file.name.split('.').pop().toLowerCase();
    setNote(noteId, `Reading "${file.name}"…`);
    try{
      let text = '';
      if(ext === 'txt' || ext === 'md') text = await file.text();
      else if(ext === 'pdf'){ const buf = await file.arrayBuffer(); text = await extractPdfText(buf); }
      else if(ext === 'docx'){ const buf = await file.arrayBuffer(); text = await extractDocxText(buf); }
      else {
        setNote(noteId, `Unsupported file type ".${ext}". Use .txt, .md, .pdf, or .docx.`, 'error');
        e.target.value = ''; setFileName('No file selected', false);
        return;
      }
      if(!text || !text.trim()){
        setNote(noteId, `Couldn't find any readable text in "${file.name}" — it may be a scanned/image-only file. Try pasting the text directly.`, 'error');
        e.target.value = ''; return;
      }
      appendToCaseText(text, `Loaded from file: ${file.name}`);
      setNote(noteId, `Loaded ${text.length.toLocaleString()} characters from "${file.name}".`, 'ok');
      updateLinkDetect();
    } catch(err){
      setNote(noteId, `Couldn't read "${file.name}": ${err.message || err}. Try converting it to .txt or pasting the text directly.`, 'error');
    } finally { e.target.value = ''; }
  });

  $s('ebmFetchUrlBtn').addEventListener('click', async ()=>{
    const noteId = 'ebmUrlFetchNote';
    const ta = $s('ebmCaseText');
    const btn = $s('ebmFetchUrlBtn');
    let url = ta.value.trim();
    if(!url || !looksLikeUrlOnly(url)){ setNote(noteId, 'Paste a link into the box above first.', 'error'); return; }
    if(!/^https?:\/\//i.test(url)) url = 'https://' + url;
    btn.disabled = true;
    setNote(noteId, 'Fetching…');
    try{
      const res = await fetch(url, {mode:'cors'});
      if(!res.ok) throw new Error(`Server responded ${res.status}`);
      const contentType = res.headers.get('content-type') || '';
      let text = '';
      if(contentType.includes('application/pdf') || url.toLowerCase().endsWith('.pdf')){
        const buf = await res.arrayBuffer();
        text = await extractPdfText(buf);
      } else {
        const raw = await res.text();
        if(contentType.includes('html')){
          const doc = new DOMParser().parseFromString(raw, 'text/html');
          doc.querySelectorAll('script,style,nav,header,footer,noscript').forEach(n=>n.remove());
          text = (doc.body ? doc.body.innerText : raw).replace(/\n{3,}/g,'\n\n').trim();
        } else { text = raw; }
      }
      if(!text || !text.trim()){
        setNote(noteId, `Fetched the page but couldn't extract readable text. Try copying the case text manually.`, 'error');
        return;
      }
      ta.value = text.trim();
      $s('ebmCaseSetNote').textContent = `Loaded from URL: ${url}`;
      setNote(noteId, `Loaded ${text.length.toLocaleString()} characters from the link.`, 'ok');
      updateLinkDetect();
    } catch(err){
      setNote(noteId, `Couldn't fetch that URL directly (often blocked by the site's CORS policy). Try opening the link and pasting the case text instead.`, 'error');
    } finally { btn.disabled = false; }
  });

  /* ---- Question type grid ---- */
  let ebmSelectedTypes = new Set(EBM_QUESTION_TYPES.filter(t=>t.checked).map(t=>t.key));
  function renderTypeGrid(){
    const grid = $s('ebmTypeGrid');
    grid.innerHTML = EBM_QUESTION_TYPES.map(t => `
      <div class="lens-card ${ebmSelectedTypes.has(t.key)?'done':''}" id="ebm-type-card-${t.key}">
        <div class="lens-head">
          <div class="lens-actions" style="margin-top:0;">
            <label class="checkbox-inline"><input type="checkbox" class="ebmTypeCheckbox" data-key="${t.key}" ${ebmSelectedTypes.has(t.key)?'checked':''}></label>
          </div>
          <div>
            <div class="lens-name">${t.name}</div>
            <div class="lens-focus">${t.focus}</div>
          </div>
        </div>
      </div>
    `).join('');
    grid.querySelectorAll('.ebmTypeCheckbox').forEach(cb=>{
      cb.addEventListener('change', ()=>{
        const key = cb.dataset.key;
        if(cb.checked) ebmSelectedTypes.add(key); else ebmSelectedTypes.delete(key);
        $s('ebm-type-card-'+key).classList.toggle('done', cb.checked);
        $s('ebmSelectAllTypes').checked = ebmSelectedTypes.size === EBM_QUESTION_TYPES.length;
      });
    });
  }
  renderTypeGrid();
  $s('ebmSelectAllTypes').addEventListener('change', (e)=>{
    if(e.target.checked) EBM_QUESTION_TYPES.forEach(t=>ebmSelectedTypes.add(t.key));
    else ebmSelectedTypes.clear();
    renderTypeGrid();
    $s('ebmSelectAllTypes').checked = e.target.checked;
  });

  /* ---- output rendering ---- */
  function formatOutput(text){ return text; }
  function updateEmptyResultsNote(){
    $s('ebmEmptyResultsNote').style.display = $s('ebmResultsOutputs').children.length > 0 ? 'none' : '';
  }
  function addResultBlock(id, title, subtitle){
    const el = document.createElement('div');
    el.className = 'output-block';
    el.id = 'ebm-out-'+id;
    el.innerHTML = `<h3>${title} <span class="lens-id">${subtitle||''}</span><span class="spacer"><button type="button" class="tts-btn" data-speak="${id}" aria-label="Read aloud" title="Read aloud">${RS_TTS_ICON}</button></span></h3><div class="output-body" id="ebm-body-${id}"><div class="loading-line">running<span class="dots"><span>.</span><span>.</span><span>.</span></span></div></div>`;
    $s('ebmResultsOutputs').appendChild(el);
    el.querySelector('[data-speak]').addEventListener('click', ()=> ebmToggleSpeak(id, el.querySelector('[data-speak]')));
    updateEmptyResultsNote();
    el.scrollIntoView({behavior:'smooth', block:'nearest'});
    return el;
  }

  /* ---- API calls (reuse hub's shared key/model storage) ---- */
  async function callModel(systemPrompt, messages){
    const provider = hubActiveProvider();
    const keys = loadKeys(), models = loadModels(), endpoints = loadEndpoints();
    const apiKey = keys[provider];
    const model = models[provider] || PROVIDERS[provider].modelPlaceholder;
    if(!apiKey && !PROVIDERS[provider].needsEndpoint){
      throw new Error(`No API key saved for ${PROVIDERS[provider].label}. Add one in Setup.`);
    }
    if(provider === 'claude'){
      const resp = await fetch('https://api.anthropic.com/v1/messages', {
        method:'POST',
        headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
        body: JSON.stringify({ model, max_tokens:4096, system: systemPrompt, messages: messages.map(m=>({role:m.role==='assistant'?'assistant':'user', content:m.content})) })
      });
      const data = await resp.json();
      if(data.error) throw new Error(data.error.message || JSON.stringify(data.error));
      return (data.content||[]).map(c=>c.text||'').join('\n');
    }
    if(provider === 'gemini'){
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
      const contents = messages.map(m=>({role: m.role==='assistant'?'model':'user', parts:[{text:m.content}]}));
      const resp = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ systemInstruction: {parts:[{text:systemPrompt}]}, contents }) });
      const data = await resp.json();
      if(data.error) throw new Error(data.error.message || JSON.stringify(data.error));
      return (data.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('\n');
    }
    const endpoint = provider === 'openai' ? 'https://api.openai.com/v1/chat/completions' : endpoints[provider];
    if(!endpoint) throw new Error('No API endpoint set for this provider.');
    const resp = await fetch(endpoint, {
      method:'POST',
      headers:{'Content-Type':'application/json', 'Authorization': 'Bearer ' + apiKey},
      body: JSON.stringify({ model, messages: [{role:'system', content:systemPrompt}, ...messages], max_tokens:4096 })
    });
    const data = await resp.json();
    if(data.error) throw new Error(data.error.message || JSON.stringify(data.error));
    return data.choices?.[0]?.message?.content || '';
  }

  /* ---- prompts ---- */
  function buildQueryPrompt(caseText, types){
    return `Here is a de-identified patient case:\n\n${caseText}\n\nGenerate a structured list of critical-appraisal / EBM queries that arise from this case, focused on these question types: ${types.join(', ')}. Produce the QUESTIONS and SEARCH STRINGS this case needs answered — not the answers.\n\nFor each query, tag it with:\n1. EBM question type (Therapy / Diagnosis / Prognosis / Harm / Cost-effectiveness / Guideline)\n2. Best study design to answer it\n3. Draft PICO(T) breakdown\n4. Draft PubMed-ready search string\n5. Which appraisal checklist applies once evidence is found\n\nThen list, separately, anything in the case that is missing or ambiguous and would change the PICO if clarified.\n\nEnd with the patient's own stated priority or value (if present in the case) restated in one sentence.`;
  }
  function buildStressTestPrompt(){
    const priorOutputs = ebmResults.map(r=>r.output).join('\n---\n');
    return `Given these previously generated EBM queries and conclusions:\n\n${priorOutputs}\n\nFor each major conclusion or query thread, add one adversarial stress-test query: "What is the strongest argument that this conclusion is wrong or overstated, given the evidence?" Keep it concise, one per thread.`;
  }
  function buildPatientPriorityPrompt(){
    const caseText = $s('ebmCaseText').value.trim();
    return `From this case, extract and restate — in exactly one sentence, as closely as possible to the patient's own words — the patient's own stated priority or value:\n\n${caseText}`;
  }

  async function runEbm(id, title, subtitle, promptText){
    addResultBlock(id, title, subtitle);
    $s('ebm-body-'+id).innerHTML = `<div class="loading-line">running<span class="dots"><span>.</span><span>.</span><span>.</span></span></div>`;
    $s('ebmErrorNote').classList.remove('show');
    try{
      const output = await callModel(EBM_SYSTEM, [{role:'user', content: promptText}]);
      ebmResultCount++;
      ebmResults.push({ id, title, subtitle, output, meta: new Date().toLocaleString() });
      $s('ebm-body-'+id).innerHTML = formatOutput(output);
    }catch(err){
      $s('ebm-body-'+id).innerHTML = `<span style="color:var(--alert)">Error: ${err.message}</span>`;
      $s('ebmErrorNote').textContent = 'Request failed: ' + err.message + ' — check your API key and model name in Setup.';
      $s('ebmErrorNote').classList.add('show');
    }
  }

  $s('ebmRunGenerateBtn').addEventListener('click', ()=>{
    const caseText = $s('ebmCaseText').value.trim();
    if(!caseText){ alert('Paste or load a case first (Step 1).'); return; }
    const types = EBM_QUESTION_TYPES.filter(t=>ebmSelectedTypes.has(t.key)).map(t=>t.name);
    if(types.length===0){ alert('Select at least one question type.'); return; }
    const id = 'q' + Date.now();
    runEbm(id, 'EBM Query Set', types.join(', '), buildQueryPrompt(caseText, types));
  });
  $s('ebmStressTestBtn').addEventListener('click', ()=>{
    if(ebmResultCount===0){ alert('Generate at least one query set first.'); return; }
    const id = 'stress' + Date.now();
    runEbm(id, 'Stress-Test Queries', '', buildStressTestPrompt());
  });
  $s('ebmPatientPriorityBtn').addEventListener('click', ()=>{
    const caseText = $s('ebmCaseText').value.trim();
    if(!caseText){ alert('Paste or load a case first (Step 1).'); return; }
    const id = 'priority' + Date.now();
    runEbm(id, 'Patient Priority Restated', '', buildPatientPriorityPrompt());
  });

  /* ---- text-to-speech ---- */
  const ebmSpeechSupported = 'speechSynthesis' in window;
  let ebmCurrentSpeakId = null;
  function ebmPlainTextOf(id){ const bodyEl = document.getElementById('ebm-body-'+id); return bodyEl ? bodyEl.innerText.trim() : ''; }
  function ebmClearSpeakingIcons(){ document.querySelectorAll('.sl-tool .tts-btn.speaking').forEach(b=>b.classList.remove('speaking')); ebmCurrentSpeakId = null; }
  function ebmToggleSpeak(id, btn){
    if(!ebmSpeechSupported){ alert('Text-to-speech is not supported in this browser.'); return; }
    if(ebmCurrentSpeakId === id){ window.speechSynthesis.cancel(); ebmClearSpeakingIcons(); return; }
    window.speechSynthesis.cancel();
    ebmClearSpeakingIcons();
    const text = ebmPlainTextOf(id);
    if(!text) return;
    const utter = new SpeechSynthesisUtterance(text);
    hubApplyPreferredVoice(utter);
    utter.onend = ebmClearSpeakingIcons;
    utter.onerror = ebmClearSpeakingIcons;
    ebmCurrentSpeakId = id;
    btn.classList.add('speaking');
    window.speechSynthesis.speak(utter);
  }
  $s('ebmSpeakAllBtn').addEventListener('click', ()=>{
    if(!ebmSpeechSupported){ alert('Text-to-speech is not supported in this browser.'); return; }
    window.speechSynthesis.cancel();
    ebmClearSpeakingIcons();
    const ids = ebmResults.map(r=>r.id);
    if(ids.length === 0){ alert('No outputs to read yet — run a query generation or Closure/Review step first.'); return; }
    let i = 0;
    function speakNext(){
      if(i >= ids.length){ ebmClearSpeakingIcons(); return; }
      const id = ids[i];
      const text = ebmPlainTextOf(id);
      i++;
      if(!text){ speakNext(); return; }
      const utter = new SpeechSynthesisUtterance(text);
      hubApplyPreferredVoice(utter);
      utter.onend = speakNext;
      utter.onerror = speakNext;
      window.speechSynthesis.speak(utter);
    }
    speakNext();
  });
  $s('ebmStopSpeakBtn').addEventListener('click', ()=>{ window.speechSynthesis.cancel(); ebmClearSpeakingIcons(); });

  /* ---- export / reset ---- */
  function buildTextExport(){
    const caseText = $s('ebmCaseText').value.trim();
    let out = `EBM QUERY GENERATOR — CASE → CRITICAL APPRAISAL QUERIES\n`;
    out += `Generated: ${new Date().toLocaleString()}\n`;
    out += `${'='.repeat(60)}\n\nCASE\n${'-'.repeat(60)}\n${caseText || '(no case entered)'}\n\n`;
    if(ebmResults.length === 0){ out += `No outputs generated yet.\n\n`; }
    else { ebmResults.forEach(r=>{ out += `${r.title}${r.subtitle? ' — '+r.subtitle : ''}\n${r.meta}\n${'-'.repeat(60)}\n${r.output}\n\n`; }); }
    out += `EBM Query Generator is a Vibe Rounds tool · Educational use only, not for clinical purpose.\n`;
    return out;
  }
  $s('ebmDownloadTxtBtn').addEventListener('click', ()=>{
    const text = buildTextExport();
    const brandedText = window.vrBrandText ? window.vrBrandText(text) : text;
    const blob = new Blob([brandedText], {type:'text/plain;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
    a.href = url; a.download = 'ebm-case-queries-' + stamp + '.txt';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });
  $s('ebmSaveHistoryBtn').addEventListener('click', ()=>{
    saveToHistoryFlash($s('ebmSaveHistoryBtn'), 'EBM Query Generator', buildTextExport());
  });
  $s('ebmResetAllBtn').addEventListener('click', ()=>{
    if(!confirm('Reset everything? This clears the case and all generated outputs. Your saved API key is kept.')) return;
    window.speechSynthesis.cancel();
    ebmClearSpeakingIcons();
    $s('ebmCaseText').value = '';
    $s('ebmCaseSetNote').textContent = '';
    ebmResults = [];
    ebmResultCount = 0;
    $s('ebmResultsOutputs').innerHTML = '';
    $s('ebmErrorNote').classList.remove('show');
    updateEmptyResultsNote();
  });

  updateEmptyResultsNote();
}

  const CL_MAX_FILE_BYTES = 10 * 1024 * 1024;

  async function extractPdfText(arrayBuffer){
    if(!window.pdfjsLib) throw new Error('PDF library failed to load.');
    const pdf = await pdfjsLib.getDocument({data: arrayBuffer}).promise;
    let text = '';
    for(let i=1; i<=pdf.numPages; i++){
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      text += content.items.map(it=>it.str).join(' ') + '\n\n';
    }
    return text.trim();
  }
  async function extractDocxText(arrayBuffer){
    if(!window.mammoth) throw new Error('DOCX library failed to load.');
    const result = await mammoth.extractRawText({arrayBuffer});
    return result.value.trim();
  }

  const CL_URL_ONLY_RE = /^(https?:\/\/[^\s]+|www\.[^\s]+|[a-z0-9-]+\.[a-z]{2,}(\/[^\s]*)?)$/i;
  function looksLikeUrlOnly(text){
    const t = text.trim();
    if(!t || /\s/.test(t)) return false;
    return CL_URL_ONLY_RE.test(t);
  }
  function updateLinkDetect(){
    const ta = $s('clCaseText');
    const row = $s('clLinkDetectRow');
    const isUrl = looksLikeUrlOnly(ta.value);
