  $s('clCaseFile').addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    if(!file){ setFileName('No file selected', false); return; }
    const noteId = 'clFileUploadNote';
    setFileName(file.name, true);
    if(file.size > CL_MAX_FILE_BYTES){
      setNote(noteId, `"${file.name}" is ${(file.size/1024/1024).toFixed(1)} MB — max allowed is 10 MB.`, 'error');
      e.target.value = ''; setFileName('No file selected', false);
      return;
    }
    const ext = file.name.split('.').pop().toLowerCase();
    setNote(noteId, `Reading "${file.name}"…`);
    try{
      let text = '';
      if(ext === 'txt' || ext === 'md') text = await file.text();
      else if(ext === 'pdf'){ const buf = await file.arrayBuffer(); text = await extractPdfText(buf); }
      else if(ext === 'docx'){ const buf = await file.arrayBuffer(); text = await extractDocxText(buf); }
      else {
        setNote(noteId, `Unsupported file type ".${ext}". Use .txt, .md, .pdf, or .docx.`, 'error');
        e.target.value = ''; setFileName('No file selected', false);
        return;
      }
      if(!text || !text.trim()){
        setNote(noteId, `Couldn't find any readable text in "${file.name}" — it may be a scanned/image-only file. Try pasting the text directly.`, 'error');
        e.target.value = ''; return;
      }
      appendToCaseText(text, `Loaded from file: ${file.name}`);
      setNote(noteId, `Loaded ${text.length.toLocaleString()} characters from "${file.name}".`, 'ok');
      updateLinkDetect();
    } catch(err){
      setNote(noteId, `Couldn't read "${file.name}": ${err.message || err}. Try converting it to .txt or pasting the text directly.`, 'error');
    } finally { e.target.value = ''; }
  });

  $s('clFetchUrlBtn').addEventListener('click', async ()=>{
    const noteId = 'clUrlFetchNote';
    const ta = $s('clCaseText');
    const btn = $s('clFetchUrlBtn');
    let url = ta.value.trim();
    if(!url || !looksLikeUrlOnly(url)){ setNote(noteId, 'Paste a link into the box above first.', 'error'); return; }
    if(!/^https?:\/\//i.test(url)) url = 'https://' + url;
    btn.disabled = true;
    setNote(noteId, 'Fetching…');
    try{
      const res = await fetch(url, {mode:'cors'});
      if(!res.ok) throw new Error(`Server responded ${res.status}`);
      const contentType = res.headers.get('content-type') || '';
      let text = '';
      if(contentType.includes('application/pdf') || url.toLowerCase().endsWith('.pdf')){
        const buf = await res.arrayBuffer();
        text = await extractPdfText(buf);
      } else {
        const raw = await res.text();
        if(contentType.includes('html')){
          const doc = new DOMParser().parseFromString(raw, 'text/html');
          doc.querySelectorAll('script,style,nav,header,footer,noscript').forEach(n=>n.remove());
          text = (doc.body ? doc.body.innerText : raw).replace(/\n{3,}/g,'\n\n').trim();
        } else { text = raw; }
      }
      if(!text || !text.trim()){
        setNote(noteId, `Fetched the page but couldn't extract readable text. Try copying the case text manually.`, 'error');
        return;
      }
      ta.value = text.trim();
      $s('clCaseSetNote').textContent = `Loaded from URL: ${url}`;
      setNote(noteId, `Loaded ${text.length.toLocaleString()} characters from the link.`, 'ok');
      updateLinkDetect();
    } catch(err){
      setNote(noteId, `Couldn't fetch that URL directly (often blocked by the site's CORS policy). Try opening the link and pasting the case text instead.`, 'error');
    } finally { btn.disabled = false; }
  });

  /* ---- Lens grid ---- */
  function renderLensGrid(){
    const grid = $s('clLensGrid');
    grid.innerHTML = CL_LENSES.map(l => `
      <div class="lens-card ${lensState[l.key].status==='done'?'done':''} ${lensState[l.key].status==='running'?'running':''}" id="cl-card-${l.key}">
        <div class="lens-head">
          <div class="lens-num">${l.id}</div>
          <div>
            <div class="lens-name">${l.name}</div>
            <div class="lens-focus">${l.focus}</div>
          </div>
        </div>
        <div class="lens-actions">
          <label class="checkbox-inline"><input type="checkbox" class="clLensCheckbox" data-key="${l.key}"> select</label>
          <button class="small" data-run="${l.key}" type="button">▶ Run lens</button>
          <span class="status-dot" id="cl-dot-${l.key}"></span>
        </div>
      </div>
    `).join('');
    grid.querySelectorAll('button[data-run]').forEach(btn=>{
      btn.addEventListener('click', ()=> runLens(btn.dataset.run));
    });
    updateDoneCount();
  }
  renderLensGrid();

  $s('clSelectAll').addEventListener('change', (e)=>{
    document.querySelectorAll('.clLensCheckbox').forEach(cb => cb.checked = e.target.checked);
  });
  $s('clRunSelectedBtn').addEventListener('click', async ()=>{
    const keys = Array.from(document.querySelectorAll('.clLensCheckbox:checked')).map(cb=>cb.dataset.key);
    const toRun = keys.length ? keys : CL_LENSES.map(l=>l.key);
    for(const k of toRun){ await runLens(k); }
  });
  $s('clResetLensesBtn').addEventListener('click', ()=>{
    CL_LENSES.forEach(l => lensState[l.key] = {status:'idle', output:''});
    conversationLog = [];
    $s('clLensOutputs').innerHTML = '';
    $s('clPhase3Outputs').innerHTML = '';
    renderLensGrid();
    updateEmptyResultsNote();
  });

  function updateDoneCount(){
    const done = Object.values(lensState).filter(s=>s.status==='done').length;
    $s('clLensDoneCount').textContent = `${done} / 8 run`;
  }

  function formatOutput(text){ return text; }
  function updateEmptyResultsNote(){
    const hasOutputs = $s('clLensOutputs').children.length > 0 || $s('clPhase3Outputs').children.length > 0;
    $s('clEmptyResultsNote').style.display = hasOutputs ? 'none' : '';
  }
  function ensureOutputBlock(id, title, subtitle){
    let el = document.getElementById('cl-out-'+id);
    if(!el){
      el = document.createElement('div');
      el.className = 'output-block';
      el.id = 'cl-out-'+id;
      el.innerHTML = `<h3>${title} <span class="lens-id">${subtitle||''}</span><span class="spacer"><button type="button" class="tts-btn" data-speak="${id}" aria-label="Read aloud" title="Read aloud">${RS_TTS_ICON}</button></span></h3><div class="output-body" id="cl-body-${id}"><div class="loading-line">running<span class="dots"><span>.</span><span>.</span><span>.</span></span></div></div>`;
      $s('clLensOutputs').appendChild(el);
      el.querySelector('[data-speak]').addEventListener('click', ()=> clToggleSpeak(id, el.querySelector('[data-speak]')));
      updateEmptyResultsNote();
    }
    return el;
  }

  /* ---- API calls (reuse hub's shared key/model storage) ---- */
  async function callModel(systemPrompt, messages){
    const provider = hubActiveProvider();
    const keys = loadKeys(), models = loadModels(), endpoints = loadEndpoints();
    const apiKey = keys[provider];
    const model = models[provider] || PROVIDERS[provider].modelPlaceholder;
    if(!apiKey && !PROVIDERS[provider].needsEndpoint){
      throw new Error(`No API key saved for ${PROVIDERS[provider].label}. Add one in Setup.`);
    }
    if(provider === 'claude'){
      const resp = await fetch('https://api.anthropic.com/v1/messages', {
        method:'POST',
        headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
        body: JSON.stringify({ model, max_tokens:4096, system: systemPrompt, messages: messages.map(m=>({role:m.role==='assistant'?'assistant':'user', content:m.content})) })
      });
      const data = await resp.json();
      if(data.error) throw new Error(data.error.message || JSON.stringify(data.error));
      return (data.content||[]).map(c=>c.text||'').join('\n');
    }
    if(provider === 'gemini'){
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
      const contents = messages.map(m=>({role: m.role==='assistant'?'model':'user', parts:[{text:m.content}]}));
      const resp = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ systemInstruction: {parts:[{text:systemPrompt}]}, contents }) });
      const data = await resp.json();
      if(data.error) throw new Error(data.error.message || JSON.stringify(data.error));
      return (data.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('\n');
    }
    const endpoint = provider === 'openai' ? 'https://api.openai.com/v1/chat/completions' : endpoints[provider];
    if(!endpoint) throw new Error('No API endpoint set for this provider.');
    const resp = await fetch(endpoint, {
      method:'POST',
      headers:{'Content-Type':'application/json', 'Authorization': 'Bearer ' + apiKey},
      body: JSON.stringify({ model, messages: [{role:'system', content:systemPrompt}, ...messages], max_tokens:4096 })
    });
    const data = await resp.json();
    if(data.error) throw new Error(data.error.message || JSON.stringify(data.error));
    return data.choices?.[0]?.message?.content || '';
  }

  async function runLens(key){
    const lens = CL_LENSES.find(l=>l.key===key);
    const caseText = $s('clCaseText').value.trim();
    if(!caseText){ alert('Paste a case first (Step 1).'); return; }
    lensState[key].status = 'running';
    $s('cl-card-'+key).classList.add('running');
    ensureOutputBlock(key, `Lens ${lens.id} — ${lens.name}`, lens.focus);
    $s('cl-body-'+key).innerHTML = `<div class="loading-line">running<span class="dots"><span>.</span><span>.</span><span>.</span></span></div>`;
    const userMsg = `CASE:\n${caseText}\n\n${lens.prompt}`;
    try{
      const output = await callModel(CL_AUDITOR_SYSTEM, [{role:'user', content: userMsg}]);
      lensState[key] = {status:'done', output};
      conversationLog.push({lens: lens.name, id: lens.id, output});
      $s('cl-body-'+key).innerHTML = formatOutput(output);
      $s('cl-card-'+key).classList.remove('running');
      $s('cl-card-'+key).classList.add('done');
    }catch(err){
      lensState[key].status = 'idle';
      $s('cl-card-'+key).classList.remove('running');
      $s('cl-body-'+key).innerHTML = `<span style="color:var(--alert)">Error: ${err.message}</span>`;
    }
    updateDoneCount();
  }

  function buildPhase3Context(){
    if(conversationLog.length === 0) return null;
    const caseText = $s('clCaseText').value.trim();
    let ctx = `CASE:\n${caseText}\n\nOutputs generated so far across the 8 lenses:\n\n`;
    conversationLog.forEach(c => { ctx += `--- Lens ${c.id} — ${c.lens} ---\n${c.output}\n\n`; });
    return ctx;
  }
  async function runPhase3(promptText, title, targetId){
    const ctx = buildPhase3Context();
    if(!ctx){ alert('Run at least one lens first — Phase 3 consolidates what the lenses generated.'); return; }
    let el = document.getElementById('cl-out-'+targetId);
    if(!el){
      el = document.createElement('div');
      el.className = 'output-block';
      el.id = 'cl-out-'+targetId;
      el.innerHTML = `<h3>${title}<span class="spacer"><button type="button" class="tts-btn" data-speak="${targetId}" aria-label="Read aloud" title="Read aloud">${RS_TTS_ICON}</button></span></h3><div class="output-body" id="cl-body-${targetId}"><div class="loading-line">running<span class="dots"><span>.</span><span>.</span><span>.</span></span></div></div>`;
      $s('clPhase3Outputs').appendChild(el);
      el.querySelector('[data-speak]').addEventListener('click', ()=> clToggleSpeak(targetId, el.querySelector('[data-speak]')));
      updateEmptyResultsNote();
    } else {
      $s('cl-body-'+targetId).innerHTML = `<div class="loading-line">running<span class="dots"><span>.</span><span>.</span><span>.</span></span></div>`;
    }
    try{
      const output = await callModel(CL_AUDITOR_SYSTEM, [{role:'user', content: ctx + '\n\n' + promptText}]);
      $s('cl-body-'+targetId).innerHTML = formatOutput(output);
    }catch(err){
      $s('cl-body-'+targetId).innerHTML = `<span style="color:var(--alert)">Error: ${err.message}</span>`;
    }
  }
  $s('clRollupBtn').addEventListener('click', ()=> runPhase3(CL_ROLLUP_PROMPT, 'Phase 3 · Key Questions Roll-Up', 'rollup'));
  $s('clReflectionBtn').addEventListener('click', ()=> runPhase3(CL_REFLECTION_PROMPT, 'Phase 3 · Reflection Debrief', 'reflection'));

  /* ---- text-to-speech ---- */
  const clSpeechSupported = 'speechSynthesis' in window;
  let clCurrentSpeakId = null;
  function clPlainTextOf(id){ const bodyEl = document.getElementById('cl-body-'+id); return bodyEl ? bodyEl.innerText.trim() : ''; }
  function clClearSpeakingIcons(){ document.querySelectorAll('.sl-tool .tts-btn.speaking').forEach(b=>b.classList.remove('speaking')); clCurrentSpeakId = null; }
  function clToggleSpeak(id, btn){
    if(!clSpeechSupported){ alert('Text-to-speech is not supported in this browser.'); return; }
    if(clCurrentSpeakId === id){ window.speechSynthesis.cancel(); clClearSpeakingIcons(); return; }
    window.speechSynthesis.cancel();
    clClearSpeakingIcons();
    const text = clPlainTextOf(id);
    if(!text) return;
    const utter = new SpeechSynthesisUtterance(text);
    hubApplyPreferredVoice(utter);
    utter.onend = clClearSpeakingIcons;
    utter.onerror = clClearSpeakingIcons;
    clCurrentSpeakId = id;
    btn.classList.add('speaking');
    window.speechSynthesis.speak(utter);
  }
  $s('clSpeakAllBtn').addEventListener('click', ()=>{
    if(!clSpeechSupported){ alert('Text-to-speech is not supported in this browser.'); return; }
    window.speechSynthesis.cancel();
    clClearSpeakingIcons();
    const ids = [
      ...CL_LENSES.map(l=>l.key).filter(k => lensState[k].status==='done'),
      ...['rollup','reflection'].filter(id => document.getElementById('cl-out-'+id))
    ];
    if(ids.length === 0){ alert('No outputs to read yet — run a lens or Phase 3 step first.'); return; }
    let i = 0;
    function speakNext(){
      if(i >= ids.length){ clClearSpeakingIcons(); return; }
      const id = ids[i];
      const text = clPlainTextOf(id);
      i++;
      if(!text){ speakNext(); return; }
      const utter = new SpeechSynthesisUtterance(text);
      hubApplyPreferredVoice(utter);
      utter.onend = speakNext;
      utter.onerror = speakNext;
      window.speechSynthesis.speak(utter);
    }
    speakNext();
  });
  $s('clStopSpeakBtn').addEventListener('click', ()=>{ window.speechSynthesis.cancel(); clClearSpeakingIcons(); });

  /* ---- export / reset ---- */
  function collectResults(){
    const caseText = $s('clCaseText').value.trim();
    const lensResults = CL_LENSES.filter(l => lensState[l.key].status === 'done').map(l => ({ id:l.id, name:l.name, focus:l.focus, output: lensState[l.key].output }));
    const rollupEl = document.getElementById('cl-body-rollup');
    const reflectionEl = document.getElementById('cl-body-reflection');
    return {
      caseText, lensResults,
      rollup: rollupEl ? rollupEl.innerText.trim() : '',
      reflection: reflectionEl ? reflectionEl.innerText.trim() : ''
    };
  }
  function triggerDownload(filename, content, mime){
    if(mime && mime.indexOf('text/plain') === 0 && window.vrBrandText){
      content = window.vrBrandText(content);
    }
    const blob = new Blob([content], {type: mime});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }
  function buildTextExport(){
    const r = collectResults();
    let out = `CASE LENS — 8-LENS CRITICAL THINKING AUDIT\n`;
    out += `Generated: ${new Date().toLocaleString()}\n`;
    out += `${'='.repeat(60)}\n\nCASE\n${'-'.repeat(60)}\n${r.caseText || '(no case entered)'}\n\n`;
    if(r.lensResults.length === 0){ out += `No lenses have been run yet.\n\n`; }
    else { r.lensResults.forEach(l=>{ out += `LENS ${l.id} — ${l.name}\n${l.focus}\n${'-'.repeat(60)}\n${l.output}\n\n`; }); }
    if(r.rollup) out += `PHASE 3 — KEY QUESTIONS ROLL-UP\n${'-'.repeat(60)}\n${r.rollup}\n\n`;
    if(r.reflection) out += `PHASE 3 — REFLECTION DEBRIEF\n${'-'.repeat(60)}\n${r.reflection}\n\n`;
    out += `Case Lens is a Vibe Rounds tool · Educational use only, not a diagnostic tool.\n`;
    return out;
  }
  $s('clDownloadTxtBtn').addEventListener('click', ()=>{
    triggerDownload('case-lens-export.txt', buildTextExport(), 'text/plain');
  });
  $s('clSaveHistoryBtn').addEventListener('click', ()=>{
    saveToHistoryFlash($s('clSaveHistoryBtn'), 'Case Lens', buildTextExport());
  });
  $s('clResetAllBtn').addEventListener('click', ()=>{
    if(!confirm('Reset everything? This clears the case, all lens outputs, and Phase 3 results. Your saved API key is kept.')) return;
    window.speechSynthesis.cancel();
    clClearSpeakingIcons();
    $s('clCaseText').value = '';
    $s('clCaseSetNote').textContent = '';
    $s('clSelectAll').checked = false;
    CL_LENSES.forEach(l => lensState[l.key] = {status:'idle', output:''});
    conversationLog = [];
    $s('clLensOutputs').innerHTML = '';
    $s('clPhase3Outputs').innerHTML = '';
    renderLensGrid();
    updateEmptyResultsNote();
  });

  updateEmptyResultsNote();
}

let selected = new Set();

let availableVoices = [];

/* ---------------------------------------------------------
   Text-to-speech
--------------------------------------------------------- */
function populateVoices(){
  if(!('speechSynthesis' in window)) return;
  const allVoices = window.speechSynthesis.getVoices();
  const sel = document.getElementById('voice-select');
  if(allVoices.length === 0) return;
  const current = sel.value;
  // Only English voices from Microsoft or Google TTS engines
  availableVoices = allVoices.filter(v =>
    v.lang.toLowerCase().startsWith('en') &&
    (/microsoft/i.test(v.name) || /google/i.test(v.name))
  );
  if(availableVoices.length === 0){
    sel.innerHTML = '<option value="">No Microsoft/Google English voices found</option>';
    return;
  }
  sel.innerHTML = availableVoices.map((v,i)=>`<option value="${i}">${v.name} (${v.lang})</option>`).join('');
  if(current) sel.value = current;
}
if('speechSynthesis' in window){
  populateVoices();
  window.speechSynthesis.onvoiceschanged = populateVoices;
} else {
  window.addEventListener('DOMContentLoaded', ()=>{
    const sel = document.getElementById('voice-select');
    if(sel) sel.innerHTML = '<option value="">Not supported in this browser</option>';
  });
}
function speakText(text){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  hubApplyPreferredVoice(utter);
  const sel = document.getElementById('voice-select');
  const idx = sel && sel.value;
  if(idx !== '' && idx !== undefined && availableVoices[idx]) utter.voice = availableVoices[idx];
  window.speechSynthesis.speak(utter);
}
function speakTurn(i){
  const t = transcriptTurns[i];
  if(!t) return;
  lastSpokenIndex = i;
  speakText(t.text);
}

function personaLookup(id){
  for(const cat of CATEGORIES){
    const p = cat.personas.find(p=>p.id===id);
    if(p) return p;
  }
  return null;
}
function personaCategoryId(id){
  for(const cat of CATEGORIES){
    if(cat.personas.some(p=>p.id===id)) return cat.id;
  }
  return null;

let activeTab = null;

function renderCategories(){
  const root = document.getElementById('categories-root');
  root.innerHTML = '';

  const note = document.createElement('div');
  note.className = 'mix-note';
  note.textContent = 'Switch tabs to browse each panel — your selections carry over, so you can mix personas from multiple panels into one debate.';
  root.appendChild(note);

  const tabBar = document.createElement('div');
  tabBar.className = 'tab-bar';
  tabBar.id = 'tab-bar';
  root.appendChild(tabBar);

  const panelsWrap = document.createElement('div');
  panelsWrap.id = 'panels-wrap';
  root.appendChild(panelsWrap);

  if(!activeTab) activeTab = CATEGORIES[0].id;

  CATEGORIES.forEach(cat=>{
    const tabBtn = document.createElement('button');
    tabBtn.className = 'tab-btn' + (cat.id===activeTab ? ' active' : '');
    tabBtn.id = 'tab-'+cat.id;
    tabBtn.type = 'button';
    tabBtn.innerHTML = `${cat.name}<span class="tab-count" id="tab-count-${cat.id}"></span>`;
    tabBtn.onclick = ()=>switchTab(cat.id);
    tabBar.appendChild(tabBtn);

    const panel = document.createElement('div');
    panel.className = 'category-panel' + (cat.id===activeTab ? ' active' : '');
    panel.id = 'panel-'+cat.id;
    const grid = document.createElement('div');
    grid.className = 'persona-grid';
    cat.personas.forEach(p=>{
      const card = document.createElement('div');
      card.className = 'persona-card';
      card.id = 'card-'+p.id;
      card.innerHTML = `<div><span class="glyph">${p.glyph}</span><span class="pname">${p.name}</span></div><div class="essence">${p.essence}</div>`;
      card.onclick = ()=>togglePersona(p.id);
      grid.appendChild(card);
    });
    panel.appendChild(grid);
    panelsWrap.appendChild(panel);
  });

  refreshTabCounts();
}

function switchTab(id){
  activeTab = id;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.category-panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('tab-'+id).classList.add('active');
  document.getElementById('panel-'+id).classList.add('active');
}

function refreshTabCounts(){
  CATEGORIES.forEach(cat=>{
    const n = cat.personas.filter(p=>selected.has(p.id)).length;
    const el = document.getElementById('tab-count-'+cat.id);
    if(el) el.textContent = n>0 ? `(${n})` : '';
  });
}

function togglePersona(id){
  const card = document.getElementById('card-'+id);
  if(selected.has(id)){
    selected.delete(id);
    card.classList.remove('on');
  } else {
    selected.add(id);
    card.classList.add('on');
  }
  document.getElementById('selected-count').textContent = selected.size;
  refreshTabCounts();
}

function providerChanged(){
  const provider = document.getElementById('provider').value;
  document.getElementById('endpoint-row').style.display = provider==='openai-compatible' ? 'flex' : 'none';
  const modelField = document.getElementById('model-name');
  if(!modelField.value || ['claude-sonnet-4-6','gemini-2.5-pro','gpt-4o'].includes(modelField.value)){
    if(provider==='anthropic') modelField.value = 'claude-sonnet-4-6';
    if(provider==='gemini') modelField.value = 'gemini-2.5-pro';
    if(provider==='openai-compatible') modelField.value = 'gpt-4o';
  }
}
// Section 1 (Model) UI removed — key/provider/model now come from the hub's global Setup page (see polSyncKey below).

function saveKey(){
  const provider = document.getElementById('provider').value;
  const key = document.getElementById('api-key').value.trim();
  const model = document.getElementById('model-name').value.trim();
  const endpoint = document.getElementById('endpoint').value.trim();
  if(!key){ setStatus('Enter a key before saving.', true); return; }
  localStorage.setItem('agora_provider', provider);
  localStorage.setItem('agora_key', key);
  localStorage.setItem('agora_model', model);
  localStorage.setItem('agora_endpoint', endpoint);
  updateModelHint();
  setStatus('Key saved to this browser only.', false);
}
function clearKey(){
  localStorage.removeItem('agora_provider');
  localStorage.removeItem('agora_key');
  localStorage.removeItem('agora_model');
  localStorage.removeItem('agora_endpoint');
  document.getElementById('api-key').value='';
  updateModelHint();
  setStatus('Key cleared.', false);
}
function loadKey(){
  const provider = localStorage.getItem('agora_provider') || 'anthropic';
  document.getElementById('provider').value = provider;
  document.getElementById('api-key').value = localStorage.getItem('agora_key') || '';
  document.getElementById('model-name').value = localStorage.getItem('agora_model') || 'claude-sonnet-4-6';
  document.getElementById('endpoint').value = localStorage.getItem('agora_endpoint') || '';
  providerChanged();
  updateModelHint();
}
function updateModelHint(){
  const hint = document.getElementById('model-hint');
  const key = localStorage.getItem('agora_key');
  hint.textContent = key ? 'key saved for this provider' : 'no key saved yet';
}

  if(transcriptTurns.length===0){
    el.innerHTML = '<div class="empty-transcript">No debate run yet.</div>';
    return;
  }
  el.innerHTML = transcriptTurns.map((t,i)=>{
    if(t.cls==='query'){
      return `<div class="turn query"><div class="speaker">▸ the case<button class="play-btn" onclick="speakTurn(${i})">🔊</button></div><div class="text">${escapeHtml(t.text)}</div></div>`;
    }
    if(t.cls==='system-note'){
      return `<div class="turn system-note">${escapeHtml(t.text)}</div>`;
    }
    if(t.cls==='user-note'){
      return `<div class="turn user-note"><div class="speaker">▸ your note</div><div class="text">${escapeHtml(t.text)}</div></div>`;
    }
    const catClass = t.catId ? 'cat-'+t.catId : '';
    return `<div class="turn ${catClass}"><div class="speaker"><span class="glyph">${t.glyph}</span>${escapeHtml(t.speakerName)}<button class="play-btn" onclick="speakTurn(${i})">🔊</button></div><div class="text">${escapeHtml(t.text)}</div></div>`;
  }).join('');
  el.scrollTop = el.scrollHeight;

  // autoplay the most recently added spoken turn
  const autoplay = document.getElementById('autoplay-toggle').checked;
  if(autoplay && transcriptTurns.length > lastSpokenIndex + 1){
    speakTurn(transcriptTurns.length - 1);
  }
}
function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ---------------------------------------------------------
   Model call
--------------------------------------------------------- */
async function callModel(systemPrompt, userPrompt){
  const provider = localStorage.getItem('agora_provider') || 'anthropic';
  const key = localStorage.getItem('agora_key');
  const model = localStorage.getItem('agora_model') || 'claude-sonnet-4-6';
  const endpoint = localStorage.getItem('agora_endpoint');
  if(!key) throw new Error('No API key saved. Add one in Setup.');

  if(provider==='anthropic'){
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'x-api-key': key,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body: JSON.stringify({
        model: model,
        max_tokens: 4096,
        system: systemPrompt,
        messages: [{role:'user', content:userPrompt}]
      })
    });
    if(!resp.ok){
      const errText = await resp.text();
      throw new Error(`Anthropic API error (${resp.status}): ${errText.slice(0,300)}`);
    }
    const data = await resp.json();
    const block = data.content && data.content.find(b=>b.type==='text');
    let out = block ? block.text.trim() : '(no text returned)';
    if(data.stop_reason === 'max_tokens') out += '\n\n[⚠ response hit the token limit and was cut off mid-thought — raise max_tokens in the code, or click Next again for a fresh continuation]';
    return out;
  } else if(provider==='gemini') {
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(key)}`;
    const resp = await fetch(url, {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({
        system_instruction: { parts: [{ text: systemPrompt }] },
        contents: [{ role:'user', parts: [{ text: userPrompt }] }],
        generationConfig: { maxOutputTokens: 2500 }
      })
    });
    if(!resp.ok){
      const errText = await resp.text();
      throw new Error(`Gemini API error (${resp.status}): ${errText.slice(0,300)}`);
    }
    const data = await resp.json();
    const cand = data.candidates && data.candidates[0];
    const text = cand && cand.content && cand.content.parts && cand.content.parts.map(p=>p.text||'').join('');
    let out = text ? text.trim() : '(no text returned)';
    if(cand && cand.finishReason === 'MAX_TOKENS') out += '\n\n[⚠ response hit the token limit and was cut off mid-thought — raise maxOutputTokens in the code, or click Next again for a fresh continuation]';
    return out;
  } else if(provider==='openai-compatible') {
    const url = endpoint || 'https://api.openai.com/v1/chat/completions';
    const resp = await fetch(url, {
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'Authorization': 'Bearer '+key
      },
      body: JSON.stringify({
        model: model,
        max_tokens: 4096,
        messages: [
          {role:'system', content:systemPrompt},
          {role:'user', content:userPrompt}
        ]
      })
    });
    if(!resp.ok){
      const errText = await resp.text();
      throw new Error(`API error (${resp.status}): ${errText.slice(0,300)}`);
    }
    const data = await resp.json();
    const choice = data.choices && data.choices[0];
    const msg = choice && choice.message;
    let out = msg ? (msg.content||'').trim() : '(no text returned)';
    if(choice && choice.finish_reason === 'length') out += '\n\n[⚠ response hit the token limit and was cut off mid-thought — raise max_tokens in the code, or click Next again for a fresh continuation]';
    return out;
  }
}

/* ---------------------------------------------------------
   Debate runner — step-based, one argument per "Next" click
--------------------------------------------------------- */
let debate = null;   // holds all state for the in-progress debate
let stepBusy = false; // true while a single turn is being generated

const groundRules = () => {
  const mellow = document.getElementById('mellow-toggle').checked;
  let rules = `\n\nHouse rules for this panel, always in force:\n- If the note or prior turns only ask you to define or explain a term/concept so someone can understand better, do not explain it — say something like "look that term up, I don't want to break the flow here" and move straight into your actual argument. Never pause the debate to teach vocabulary.\n- Length requirement, non-negotiable: every turn must be at least 180 words and span 2 full paragraphs. A short reaction, a one-line zinger, or a single paragraph is a failure to follow instructions. Develop your reasoning at length, back it with a concrete example or mechanism, and engage the strongest version of what you're pushing against — don't just assert a conclusion and stop.`;
  if(mellow){
    rules += `\n- Mellow down your language: explain your actual position in plain words a bright 12th-grade student would fully follow. Do not use dense jargon or academic vocabulary. This is about vocabulary and sentence complexity only — do not soften, hedge, or dilute your actual stance.`;
  }
  return rules;
};

function gaEvent(name, params){
  if(typeof gtag === 'function') gtag('event', name, params || {});
}

async function startDebate(){
  if(isRunning) return;
  const caseText = document.getElementById('case-text').value.trim();
  if(!caseText){ setStatus('Add a case, thought, or query first.', true); return; }
  if(selected.size < 2){ setStatus('Select at least two personas for a debate.', true); return; }
  const key = localStorage.getItem('agora_key');
  if(!key){ setStatus('Save an API key in section 1 first.', true); return; }

  const personas = Array.from(selected).map(personaLookup).filter(Boolean);
  gaEvent('debate_start', { panel_size: personas.length });
  debate = {
    caseText,
    personas,
    panelNames: personas.map(p=>p.name).join(', '),
    round: 1,
    idx: 0,
    priorRoundText: {},
    newRoundText: {}
  };
  pendingUserNote = null;

  isRunning = true;
  setRunButtons(true);

  transcriptTurns = [{cls:'query', text: caseText}];
  renderTranscript();

  await nextTurn();
}

async function nextTurn(){
  if(!debate || stepBusy) return;
  stepBusy = true;
  setNextBusy(true);
  setStatus(debate.round===1 ? 'Round 1 — opening statements...' : `Round ${debate.round} — rebuttals...`, false);

  try {
    const p = debate.personas[debate.idx];
    let userPrompt;

    if(debate.round===1){
      userPrompt =
`The panel — ${debate.panelNames} — is debating the following, each from your own logic:

"""${debate.caseText}"""

Give your opening statement: your read on this, and what you believe should be concluded or done, argued strictly from your own perspective as described in your system instructions. Do not summarize other personas — you haven't heard them yet. Do not hedge into blandness; stay in character.${groundRules()}`;
    } else {
      // start-of-round housekeeping: surface any queued moderator note once
      if(debate.idx===0 && pendingUserNote){
        transcriptTurns.push({cls:'user-note', text: pendingUserNote});
        renderTranscript();
      }
      const roundSummary = debate.personas.map(pp=>`${pp.name}: ${debate.priorRoundText[pp.id]}`).join('\n\n');
      const noteBlock = pendingUserNote ? `\n\nThe moderator has just interjected with this note — take it into account this round:\n"""${pendingUserNote}"""` : '';
      const others = debate.personas.filter(o=>o.id!==p.id).map(o=>o.name).join(', ');
      userPrompt =
`Here is what every panelist said in the previous round on:

"""${debate.caseText}"""

${roundSummary}${noteBlock}

Now respond as yourself. Directly engage with what ${others} said — agree, refute, or sharpen your point against theirs — but stay entirely within your own logic. Do not mellow your actual position or concede ground you don't believe.${groundRules()}`;
    }

    const text = await callModel(p.systemPrompt, userPrompt);
    debate.newRoundText[p.id] = text;
    const speakerName = debate.round===1 ? p.name : (p.name+' — round '+debate.round);
    transcriptTurns.push({glyph:p.glyph, speakerName, text, cls:'turn', catId:personaCategoryId(p.id)});
    renderTranscript();

    // advance to next speaker, or roll into a new round
    debate.idx++;
    if(debate.idx >= debate.personas.length){
      if(debate.round >= 2) pendingUserNote = null; // consumed at the round it was surfaced in
      debate.priorRoundText = { ...debate.priorRoundText, ...debate.newRoundText };
      debate.newRoundText = {};
      debate.round++;
      debate.idx = 0;
    }
    setStatus('Click "Next argument" to hear from the next panelist.', false);
  } catch(err){
    setStatus(err.message, true);
    transcriptTurns.push({cls:'system-note', text:'Error: '+err.message});
    renderTranscript();
  } finally {
    stepBusy = false;
    setNextBusy(false);
  }
}

function endDebate(){
  debate = null;
  isRunning = false;
  setRunButtons(false);
  transcriptTurns.push({cls:'system-note', text:'— debate stopped —'});
  renderTranscript();
  setStatus('Debate stopped.', false);
}

function addUserNote(){
  const input = document.getElementById('user-note');
  const val = input.value.trim();
  if(!val){ setStatus('Type a note first.', true); return; }
  pendingUserNote = val;
  input.value = '';
  setStatus(isRunning ? 'Note queued for the next round.' : 'Note saved — it will be used once the debate starts.', false);
}

function passNote(){
  const input = document.getElementById('user-note');
  input.value = '';
  pendingUserNote = null;
  setStatus('Passed — no note this round.', false);
}

async function generateTopic(){
  const key = localStorage.getItem('agora_key');
  if(!key){ setStatus('Save an API key in section 1 first.', true); return; }
  const btn = document.getElementById('generate-topic-btn');
  btn.disabled = true;
  setStatus('Generating a topic...', false);
  gaEvent('topic_generate');
  try {
    const personas = Array.from(selected).map(personaLookup).filter(Boolean);
    const context = personas.length >= 2
      ? `It will specifically be debated by: ${personas.map(p=>p.name).join(', ')}. Pick something where these specific personas would genuinely clash, not agree politely.`
      : `No panel has been chosen yet, so pick something broadly contentious that could split almost any mixed panel of experts and archetypes.`;
    const userPrompt =
`Write one sharp, debatable case, claim, dilemma, or plan for a debate panel to argue over. The topic MUST be directly or indirectly about healthcare — clinical medicine, public health, health policy, hospital or health-system operations, medical research/ethics, health insurance, pharma, or related fields — such that patients, clinicians, health institutions, payers, or other healthcare stakeholders are directly affected or clearly implicated. ${context}
Output ONLY the case text itself — 2-5 sentences, concrete and specific (not abstract), phrased as a claim, plan, or scenario a panel would take real, opposing positions on. No preamble, no title, no quotation marks around it.`;
    const text = await callModel('You write sharp, concrete debate prompts. You output only the prompt itself, nothing else.', userPrompt);
    document.getElementById('case-text').value = text.trim();
    setStatus('Topic generated.', false);
  } catch(err){
    setStatus(err.message, true);
  } finally {
    btn.disabled = false;
  }
}

function resetRun(){
  gaEvent('debate_reset');
  debate = null;
  isRunning = false;
  stepBusy = false;
  pendingUserNote = null;
  lastSpokenIndex = -1;
  setRunButtons(false);
  if('speechSynthesis' in window) window.speechSynthesis.cancel();
  transcriptTurns = [];
  renderTranscript();
  setStatus('', false);
}

function transcriptAsText(){
  return transcriptTurns.map(t=>{
    if(t.cls==='query') return `THE CASE:\n${t.text}\n`;
    if(t.cls==='system-note') return `[${t.text}]\n`;
    return `${t.speakerName}:\n${t.text}\n`;
  }).join('\n');
}
function copyTranscript(){
  navigator.clipboard.writeText(transcriptAsText()).then(()=>{ setStatus('Transcript copied.', false); gaEvent('transcript_copy'); });
}
function polSaveToHistory(){
  const btn = document.getElementById('polSaveHistoryBtn');
  saveToHistoryFlash(btn, 'Clinical Polemos', transcriptAsText());
}
function downloadTranscript(){
  gaEvent('transcript_download', { format: 'txt' });
  const text = window.vrBrandText ? window.vrBrandText(transcriptAsText()) : transcriptAsText();
  const blob = new Blob([text], {type:'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'clinical-polemos-debate-transcript.txt';
  a.click();
  URL.revokeObjectURL(url);
}

/* ---------------------------------------------------------
   Init — Section 1 (Model) lives once in the hub's global Setup
   page; bridge its saved key/model/endpoint into the agora_*
   localStorage keys this ported module reads from.
--------------------------------------------------------- */
function polSyncKey(){
  const hp = hubActiveProvider();
  const keys = loadKeys(), models = loadModels(), endpoints = loadEndpoints();
  const map = {claude:'anthropic', gemini:'gemini', openai:'openai-compatible', other:'openai-compatible'};
  const provider = map[hp] || 'anthropic';
  const defaultModel = provider==='anthropic' ? 'claude-sonnet-4-6' : provider==='gemini' ? 'gemini-2.5-pro' : 'gpt-4o';
  localStorage.setItem('agora_provider', provider);
  localStorage.setItem('agora_key', keys[hp] || '');
  localStorage.setItem('agora_model', models[hp] || defaultModel);
  localStorage.setItem('agora_endpoint', endpoints[hp] || '');
}

// Inline onclick="..." attributes in the HTML above execute in the global
// scope, but these functions are declared inside this module's IIFE — so
// they must be explicitly exposed on window or the buttons/toggles do nothing.
window.toggleBlock = toggleBlock;
window.speakTurn = speakTurn;
window.startDebate = startDebate;
window.nextTurn = nextTurn;
window.endDebate = endDebate;
window.addUserNote = addUserNote;
window.generateTopic = generateTopic;
window.resetRun = resetRun;
window.copyTranscript = copyTranscript;
window.downloadTranscript = downloadTranscript;
window.polSaveToHistory = polSaveToHistory;

renderCategories();
polSyncKey();
hubPersistField(document.getElementById('case-text'), 'hub_polemos_case');

})();
}

let selection = []; // array of module ids in click order
let activeCat = CATS[0].key;

function renderTabs(){
  const bar = document.getElementById("tabbar");
  bar.innerHTML = "";
  CATS.forEach(cat=>{
    const count = MODULES.filter(m=>m.cat===cat.key).length;
    if(!count) return;
    const btn = document.createElement("button");
    btn.className = "tabbtn"+(cat.key===activeCat?" active":"");
    btn.style.setProperty("--tab-color", cat.color);
    btn.innerHTML = `<span>${cat.label}</span><span class="n">(${count})</span>`;
    btn.addEventListener("click", ()=>{ activeCat = cat.key; render(); });
    bar.appendChild(btn);
  });
}

function render(){
  renderTabs();
  const container = document.getElementById("categories");
  container.innerHTML = "";
  const cat = CAT_INFO[activeCat];
  const mods = MODULES.filter(m=>m.cat===activeCat);
  const block = document.createElement("div");
  block.className="category";
  const head = document.createElement("div");
  head.className="category-head";
  head.style.background = cat.color;
  head.innerHTML = `<span>${cat.label}</span><span class="n">(${mods.length} modules)</span>`;
  block.appendChild(head);
  const items = document.createElement("div");
  items.className="items";
  mods.forEach(m=>{
    const row = document.createElement("div");
    const checked = selection.includes(m.id);
    row.className = "item"+(checked?" checked":"");
    row.dataset.id = m.id;
    row.innerHTML = `
      <span class="idx">#${String(m.id).padStart(2,'0')}</span>
      <span class="label"><span class="modname"><a href="${m.url}" target="_blank" rel="noopener">${m.name}</a></span><span class="moddesc">${m.desc}</span></span>
      ${checked ? `<span class="seq">${selection.indexOf(m.id)+1}</span>` : `<span class="box"></span>`}
    `;
    row.querySelector(".box, .seq").addEventListener("click", (e)=>{ e.stopPropagation(); toggle(m.id); });
    row.querySelector(".idx").addEventListener("click", ()=>toggle(m.id));
    row.querySelector(".moddesc").addEventListener("click", ()=>toggle(m.id));
    items.appendChild(row);
  });
  block.appendChild(items);
  container.appendChild(block);
  renderPipeline();
  renderPresets();
}

let activePresetCat = "all";

function presetIsActive(p){
  return p.ids.length===selection.length && p.ids.every((id,i)=>selection[i]===id);
}

function renderPresetTabs(){
  const bar = document.getElementById("presetTabbar");
  bar.innerHTML = "";
  const allBtn = document.createElement("button");
  allBtn.className = "preset-tabbtn"+(activePresetCat==="all"?" active":"");
  allBtn.innerHTML = `All Pipelines<span class="n">(${PRESETS.length})</span>`;
  allBtn.addEventListener("click", ()=>{ activePresetCat="all"; renderPresets(); });
  bar.appendChild(allBtn);
  PRESET_CATS.forEach(c=>{
    const count = PRESETS.filter(p=>p.cat===c.key).length;
    if(!count) return;
    const btn = document.createElement("button");
    btn.className = "preset-tabbtn"+(activePresetCat===c.key?" active":"");
    btn.innerHTML = `${c.label}<span class="n">(${count})</span>`;
    btn.addEventListener("click", ()=>{ activePresetCat=c.key; renderPresets(); });
    bar.appendChild(btn);
  });
}

function renderPresets(){
  renderPresetTabs();
  const grid = document.getElementById("presetGrid");
  grid.innerHTML = "";
  const list = activePresetCat==="all" ? PRESETS : PRESETS.filter(p=>p.cat===activePresetCat);
  list.forEach(p=>{
    const info = PRESET_CAT_INFO[p.cat];
    const isActive = presetIsActive(p);
    const card = document.createElement("button");
    card.className = "preset-card"+(isActive?" active":"");
    card.style.setProperty("--preset-c", info.color);
    card.style.setProperty("--preset-c-soft", info.soft);
    card.innerHTML = `${isActive ? `<span class="pcheck">✓ Loaded</span>` : ""}<div class="pcat">${info.label}</div><div class="pname">${p.name}</div><div class="pdesc">${p.desc}</div><div class="pcount">${p.ids.length} modules</div>`;
    card.addEventListener("click", ()=>{
      selection = p.ids.slice();
      const firstMod = MODULES.find(m=>m.id===selection[0]);
      if(firstMod) activeCat = firstMod.cat;
      render();
    });
    grid.appendChild(card);
  });
}

function toggle(id){
  const i = selection.indexOf(id);
  if(i>-1){ selection.splice(i,1); } else { selection.push(id); }
  render();
}

function renderPipeline(){
  const ol = document.getElementById("pchain");
  ol.innerHTML = "";
  if(selection.length===0){
    ol.innerHTML = `<div class="empty-note">No modules selected yet. Tap any module on the left to begin the chain.</div>`;
    document.getElementById("analyticsBlock").style.display="none";
    return;
  }
  selection.forEach((id,i)=>{
    const m = MODULES.find(x=>x.id===id);
    const li = document.createElement("li");
    li.innerHTML = `<span class="pnum">${i+1}</span><span><span class="pname">${m.name}</span><span class="pcat">${CAT_INFO[m.cat].label}</span></span>`;
    ol.appendChild(li);
  });
  renderAnalytics();
}

function renderAnalytics(){
  const block = document.getElementById("analyticsBlock");
  block.style.display = "block";
  const mods = selection.map(id=>MODULES.find(m=>m.id===id));
  const counts = {};
  CATS.forEach(c=>counts[c.key]=0);
  mods.forEach(m=>counts[m.cat]++);
  const total = mods.length;

  // lens tags: categories present, in order of first appearance
  const seen = [];
  mods.forEach(m=>{ if(!seen.includes(m.cat)) seen.push(m.cat); });
  const tagsEl = document.getElementById("lensTags");
  tagsEl.innerHTML = seen.map(k=>`<span class="lens-tag">${CAT_INFO[k].label.split(" &")[0].split(",")[0]}</span>`).join("");

  // narrative
  const dominant = seen[0];
  const spanCats = seen.length;
  let text = "";
  if(total===1){
    text = `A single-module run. Expect a narrow, deep pass focused on ${CAT_INFO[dominant].label.toLowerCase()} — good for isolating one lens cleanly, but you'll get no cross-check against other reasoning styles.`;
  } else if(spanCats===1){
    text = `Every module chosen sits inside ${CAT_INFO[dominant].label.toLowerCase()}. This stacks depth rather than breadth — the case gets worked over repeatedly from the same angle, which sharpens that one skill but won't catch blind spots outside it.`;
  } else {
    const catNames = seen.map(k=>CAT_INFO[k].label.split(" &")[0].split(",")[0]);
    text = `This chain runs the case through ${spanCats} distinct lenses in this order: ${catNames.join(" → ")}. `;
    if(counts.safety>0 && counts.reasoning>0){
      text += `Pairing a safety/failure module with a reasoning module tends to surface where a plausible diagnostic story could also be the one that gets someone hurt. `;
    }
    if(counts.analytics>0 && counts.advocacy>0){
      text += `Mixing registry-style analytics with advocacy modules pulls both the population-level pattern and the single-patient narrative into the same run. `;
    }
    if(counts.education>0){
      text += `The education-layer module(s) will anchor whatever's found back to a citable mechanism or literature source rather than leaving it as pattern-matching. `;
    }
    if(counts.operations>0){
      text += `Operations/economics modules reframe the same findings in terms of workflow, cost, or system feasibility, which is a genuinely different output than pure diagnosis. `;
    }
    if(counts.meta>0){
      text += `Meta/framework modules in the mix will shape *how* the other steps are asked, rather than adding case content themselves.`;
    }
  }
  document.getElementById("analyticsText").textContent = text.trim();

  // meters: show category weight distribution
  const metersEl = document.getElementById("meters");
  metersEl.innerHTML = "";
  CATS.forEach(c=>{
    if(counts[c.key]===0) return;
    const pct = Math.round((counts[c.key]/total)*100);
    const div = document.createElement("div");
    div.className="meter";
    div.innerHTML = `
      <div class="mlabel"><span>${c.label.split(" &")[0].split(",")[0]}</span><span>${counts[c.key]}/${total}</span></div>
      <div class="mbar"><div class="mfill" style="width:${pct}%; background:${c.color};"></div></div>
    `;
    metersEl.appendChild(div);
  });
}

// Shared builder: returns the full pipeline text (case + modules + insights),
// or null if no modules have been picked yet. Used by both Copy and Save to History.
function buildCcosPipelineText(){
  if(selection.length===0) return null;
  const caseText = document.getElementById("caseText").value.trim();
  const caseLink = document.getElementById("caseLink").value.trim();
  const caseParts = [];
  if(caseText) caseParts.push(`CASE:\n${caseText}`);
  if(caseLink) caseParts.push(`CASE LINK:\n${caseLink}`);
  const caseBlock = caseParts.length ? caseParts.join("\n\n") : "CASE:\n[none provided]";
  const pipelineBlock = selection.map((id,i)=>{
    const m = MODULES.find(x=>x.id===id);
    return `${i+1}. Module ${m.id} — ${m.name}\n${m.url}`;
  }).join("\n\n");

  // Build a detailed insights block from the same analytics the on-screen panel shows
  const selMods = selection.map(id=>MODULES.find(m=>m.id===id));
  const counts = {};
  CATS.forEach(c=>counts[c.key]=0);
  selMods.forEach(m=>counts[m.cat]++);
  const total = selMods.length;
  const seenCats = [];
  selMods.forEach(m=>{ if(!seenCats.includes(m.cat)) seenCats.push(m.cat); });
  const catShortLabel = k => CAT_INFO[k].label.split(" &")[0].split(",")[0];

  const narrative = document.getElementById("analyticsText").textContent.trim();
  const lensSequence = seenCats.map(catShortLabel).join(" → ");
  const breakdown = CATS
    .filter(c=>counts[c.key]>0)
    .map(c=>`${catShortLabel(c.key)}: ${counts[c.key]}/${total}`)
    .join(" · ");

  const insightsBlock = [
    "INSIGHTS:",
    narrative,
    "",
    `Lens sequence: ${lensSequence}`,
    `Lens distribution: ${breakdown}`
  ].join("\n");

  return `${caseBlock}\n\nRUN PIPELINE:\n${pipelineBlock}\n\n${insightsBlock}`;
}

  const old = btn.textContent;

  function flash(msg, ms){
    btn.textContent = msg;
    setTimeout(()=>btn.textContent=old, ms || 1400);
  }

  function fallbackCopy(){
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.left = "-9999px";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    let ok = false;
    try{ ok = document.execCommand("copy"); }catch(e){ ok = false; }
    document.body.removeChild(ta);
    if(ok){ flash("Copied ✓"); }
    else{ flash("Copy failed — select & copy manually", 2200); }
  }

  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>{
      flash("Copied ✓");
    }).catch(fallbackCopy);
  } else {
    fallbackCopy();
  }
});

const VALID_THEMES = ['simple', 'minimalist', 'terminal'];
function applyTheme(theme){
  if(!VALID_THEMES.includes(theme)) theme = 'simple';

  if(sel) sel.value = theme;
}

/* ---------- Session timer (topbar, top-right) ---------- */
let hubTimerSeconds = 0;
let hubTimerRunning = true;
let hubTimerInterval = null;

function hubTimerFormat(s){
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  const pad = n => String(n).padStart(2, '0');
  return h > 0 ? `${pad(h)}:${pad(m)}:${pad(sec)}` : `${pad(m)}:${pad(sec)}`;
}

function hubTimerRender(){
  const disp = document.getElementById('hubTimerDisplay');
  if(disp) disp.textContent = hubTimerFormat(hubTimerSeconds);
}

function hubTimerUpdateToggleUI(){
  const btn = document.getElementById('hubTimerToggle');
  const dot = document.getElementById('hubTimerDot');
  if(!btn || !dot) return;
  if(hubTimerRunning){
    btn.textContent = '⏸';
    btn.title = 'Pause timer';
    btn.setAttribute('aria-label', 'Pause timer');
    dot.classList.add('running');
  } else {
    btn.textContent = '▶';
    btn.title = 'Resume timer';
    btn.setAttribute('aria-label', 'Resume timer');
    dot.classList.remove('running');
  }
}

function hubTimerStart(){
  hubTimerRunning = true;
  hubTimerUpdateToggleUI();
  if(hubTimerInterval) return;
  hubTimerInterval = setInterval(() => { hubTimerSeconds++; hubTimerRender(); }, 1000);
}

function hubTimerPause(){
  hubTimerRunning = false;
  hubTimerUpdateToggleUI();
  if(hubTimerInterval){ clearInterval(hubTimerInterval); hubTimerInterval = null; }
}

function hubTimerReset(){
  hubTimerSeconds = 0;
  hubTimerRender();
}

document.getElementById('hubTimerToggle').addEventListener('click', () => {
  if(hubTimerRunning) hubTimerPause(); else hubTimerStart();
});
document.getElementById('hubTimerDisplay').addEventListener('dblclick', hubTimerReset);

// On by default — starts counting the moment the hub loads.
hubTimerRender();
hubTimerStart();

});

/* ---------- Google sign-in ---------- */
const GOOGLE_CLIENT_ID = '542358272440-r0dbivmo6rujtd4pbm9jdto0tcccj3si.apps.googleusercontent.com';

function parseJwt(token){
  try{
    const base64 = token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
    return JSON.parse(decodeURIComponent(atob(base64).split('').map(c =>
      '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')));
  }catch(e){ return null; }
}

function gsiSetNote(msg){
  const el = document.getElementById('gsiNote');
  if(!el) return;
  if(msg){ el.textContent = msg; el.style.display = 'block'; }
  else { el.textContent = ''; el.style.display = 'none'; }
}

function renderSignedInUI(profile){
  document.getElementById('gSignInBtnTop').classList.add('gsi-hidden');
  document.getElementById('gSignInBtnTop').style.display = 'none';
  const signedInTop = document.getElementById('authSignedInTop');
  signedInTop.style.display = 'flex';
  document.getElementById('authAvatarTop').src = profile.picture || '';
  document.getElementById('authNameTop').textContent = profile.name || profile.email || 'Signed in';
  gsiSetNote('');
  if(currentId === 'history') renderHistory(document.getElementById('content'));
}

function renderSignedOutUI(){
  document.getElementById('gSignInBtnTop').classList.remove('gsi-hidden');
  document.getElementById('gSignInBtnTop').style.display = 'block';
  document.getElementById('authSignedInTop').style.display = 'none';
  if(currentId === 'history') renderHistory(document.getElementById('content'));
}

/* Google's rendered button ignores our theme CSS variables (it's an iframe),
   so pick the closest-matching built-in Google theme to the app's current
   dark/light mode instead of always defaulting to the white 'outline' style. */
function gsiButtonTheme(){
  const appTheme = document.documentElement.getAttribute('data-theme');
  return appTheme === 'terminal' ? 'filled_black' : 'outline';
}

function gsiRenderButtons(){
  if(!window.google || !google.accounts || !google.accounts.id) return;
  const opts = { theme: gsiButtonTheme(), size: 'medium', shape: 'pill', text: 'signin', width: 200 };
  document.getElementById('gSignInBtnTop').innerHTML = '';
  google.accounts.id.renderButton(document.getElementById('gSignInBtnTop'), {...opts, width: 180});
  gsiRenderHistoryButton();
  gsiRenderAuthModalButton();
}

/* Renders (or refreshes) the Google sign-in button inside the "Sign in to save"
   modal that pops up when a signed-out user taps a Save to History button. */
function gsiRenderAuthModalButton(){
  if(!window.google || !google.accounts || !google.accounts.id) return;
  const el = document.getElementById('gSignInBtnAuthModal');
  if(!el) return;
  el.innerHTML = '';
  google.accounts.id.renderButton(el, { theme: gsiButtonTheme(), size: 'large', shape: 'pill', text: 'signin', width: 220 });
}

/* Renders (or refreshes) the Google sign-in button shown inline on the
   signed-out History page, if that button's container is currently in the DOM. */
function gsiRenderHistoryButton(){
  if(!window.google || !google.accounts || !google.accounts.id) return;
  const el = document.getElementById('gSignInBtnHistory');
  if(!el) return;
  el.innerHTML = '';
  google.accounts.id.renderButton(el, { theme: gsiButtonTheme(), size: 'large', shape: 'pill', text: 'signin', width: 220 });
}

function handleGoogleCredential(response){
  const profile = parseJwt(response.credential);
  if(!profile) return;
  try{
    localStorage.setItem('vibehub_google_profile', JSON.stringify({
      name: profile.name, email: profile.email, picture: profile.picture
    }));
  }catch(e){}
  renderSignedInUI(profile);
  hubTryAutoConnectDrive();
  if(document.getElementById('hubAuthModalOverlay').style.display === 'flex'){
    const resume = hubAuthModalOnSignIn;
    hubCloseAuthModal();
    if(resume) resume();
  }
}

function initGoogleSignIn(){
  try{
    const saved = JSON.parse(localStorage.getItem('vibehub_google_profile') || 'null');
    if(saved){ renderSignedInUI(saved); hubTryAutoConnectDrive(); } else { renderSignedOutUI(); }
  }catch(e){ renderSignedOutUI(); }

  if(!window.google || !window.google.accounts || !window.google.accounts.id) {
    // GSI script not loaded yet — retry shortly.
    setTimeout(initGoogleSignIn, 300);
    return;
  }
  google.accounts.id.initialize({
    client_id: GOOGLE_CLIENT_ID,
    callback: handleGoogleCredential,
    auto_select: false
  });
  google.accounts.id.renderButton(document.getElementById('gSignInBtnTop'), {
    theme: 'outline', size: 'medium', shape: 'pill', text: 'signin', width: 180
  });
  gsiRenderHistoryButton();
  gsiRenderAuthModalButton();
}

function hubSignOut(){
  try{ localStorage.removeItem('vibehub_google_profile'); }catch(e){}
  if(window.google && window.google.accounts && window.google.accounts.id){
    google.accounts.id.disableAutoSelect();
  }
  renderSignedOutUI();
}
document.getElementById('authSignOutBtnTop').addEventListener('click', hubSignOut);

initGoogleSignIn();

initTheme();
renderNav();
renderHome();
