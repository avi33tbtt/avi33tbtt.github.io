<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F7FAFB">
<title>Vibe Rounds — Tool Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<style>
  :root{
    --bg:#F7FAFB;
    --panel:#FFFFFF;
    --panel-sunken:#F3F6F8;
    --ink:#0B2530;
    --ink-dim:#5B7480;
    --ink-faint:#94A7AE;
    --line:#DCE7EA;
    --line-soft:rgba(11,37,48,0.08);
    --bronze:#5B7480;
    --bronze-dim:#43606B;
    --bronze-bright:#0A6E85;
    --ember:#0891B2;
    --ember-dim:#0A6E85;
    --ember-bright:#0A6E85;
    --ember-glow:rgba(8,145,178,0.22);
    --alert:#C2410C;
    --alert-soft:#FCE9DD;
    --good:#0F766E;
    --good-soft:#DCFCE9;
    --display:'Inter',sans-serif;
    --mono:'IBM Plex Mono','JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
    --shadow-sm:0 1px 2px rgba(11,37,48,.04), 0 8px 24px -16px rgba(11,37,48,.08);
    --shadow-md:0 4px 14px rgba(11,37,48,.08), 0 12px 28px -12px rgba(11,37,48,.12);
    --shadow-lg:0 10px 30px rgba(11,37,48,.10), 0 24px 48px -18px rgba(11,37,48,.16);
    --sidebar-w:260px;
  }

  /* Theme: Minimalist — grayscale, no color pop */
  html[data-theme="minimalist"]{
    --bg:#FFFFFF;
    --panel:#FFFFFF;
    --panel-sunken:#F2F2F2;
    --ink:#161616;
    --ink-dim:#5B5B5B;
    --ink-faint:#9A9A9A;
    --line:#E4E4E4;
    --line-soft:#F0F0F0;
    --bronze:#161616;
    --bronze-dim:#000000;
    --bronze-bright:#161616;
    --ember:#161616;
    --ember-dim:#000000;
    --ember-bright:#161616;
    --ember-glow:rgba(22,22,22,0.10);
    --alert:#B3261E;
    --alert-soft:#F8E7E6;
    --good:#166534;
    --good-soft:#E8F3EA;
    --display:'Inter',sans-serif;
  }

  /* Theme: Terminal — dark/amber monospace */
  html[data-theme="terminal"]{
    --bg:#000000;
    --panel:#0A0A0A;
    --panel-sunken:#141414;
    --ink:#FFB238;
    --ink-dim:#9C7A32;
    --ink-faint:#6B5522;
    --line:#3A2A00;
    --line-soft:#231A00;
    --bronze:#FFB238;
    --bronze-dim:#FFCB6B;
    --bronze-bright:#FFCB6B;
    --ember:#FFB238;
    --ember-dim:#FFCB6B;
    --ember-bright:#FFCB6B;
    --ember-glow:rgba(255,178,56,0.18);
    --alert:#FF4D3D;
    --alert-soft:#2B0C08;
    --good:#7CFFB2;
    --good-soft:#0C2A17;
    --display:'IBM Plex Mono','JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  }
  html[data-theme="terminal"] .home-card .status.ready,
  html[data-theme="terminal"] .nav-item.active{color:#000;}

  *{box-sizing:border-box;}
  html{transition:background .15s ease;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg);color:var(--ink);font-family:var(--display);
    font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;
    transition:background .15s ease,color .15s ease;
  }
  a{color:var(--bronze-bright);}
  a:hover{color:var(--ember-bright);}

  .app{display:flex;min-height:100vh;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:var(--sidebar-w);min-width:var(--sidebar-w);
    background:var(--panel);border-right:1px solid var(--line);
    display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;
  }
  .brand{padding:22px 20px 16px;border-bottom:1px solid var(--line);}
  .brand .kicker{
    font-family:var(--mono);color:var(--bronze-bright);letter-spacing:.14em;text-transform:uppercase;
    font-size:11px;font-weight:600;margin-bottom:6px;
  }
  .brand h1{font-size:18px;font-weight:800;margin:0;letter-spacing:-0.01em;}
  .brand h1 em{font-style:normal;color:var(--ember-bright);}

  .nav-search{padding:14px 16px 8px;}
  .nav-search input{
    width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:8px;
    background:var(--panel-sunken);color:var(--ink);font-family:var(--display);font-size:13px;outline:none;
  }
  .nav-search input:focus{border-color:var(--ember);}

  nav.tool-nav{flex:1;padding:8px 12px 20px;}
  .nav-group-title{
    font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--ink-faint);font-weight:600;margin:16px 8px 6px;
  }
  .nav-item{
    display:flex;align-items:center;gap:10px;width:100%;text-align:left;
    background:transparent;border:none;border-radius:8px;padding:9px 10px;
    color:var(--ink-dim);font-family:var(--display);font-size:13.5px;font-weight:600;
    cursor:pointer;transition:background .12s,color .12s;
  }
  .nav-item:hover{background:var(--panel-sunken);color:var(--ink);}
  .nav-item.active{background:var(--ember-glow);color:var(--ember-bright);}
  .nav-item .dot{
    flex:none;width:6px;height:6px;border-radius:50%;background:var(--line);
  }
  .nav-item.active .dot{background:var(--ember);}
  .nav-item .label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .nav-item .badge{
    flex:none;font-family:var(--mono);font-size:9.5px;color:var(--ink-faint);
    background:var(--panel-sunken);border:1px solid var(--line);border-radius:20px;padding:1px 7px;
  }
  .sidebar-foot{padding:14px 20px;border-top:1px solid var(--line);font-size:11px;color:var(--ink-faint);}

  .theme-row{padding:12px 16px 4px;}
  .theme-row label{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;margin-bottom:6px;}
  .theme-select{
    width:100%;display:inline-flex;align-items:center;gap:6px;
    background:var(--panel-sunken);border:1px solid var(--line);color:var(--ink);
    font-family:var(--display);font-weight:600;font-size:12.5px;
    border-radius:8px;padding:7px 30px 7px 10px;cursor:pointer;
    -webkit-appearance:none;appearance:none;
    background-image:url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'%3E%3Cpath fill='%235B7480' d='M1 1l5 5 5-5'/%3E%3C/svg%3E");
    background-repeat:no-repeat;background-position:right 10px center;background-size:10px;
  }
  .theme-select:hover{border-color:var(--ember);}

  /* Setup page (mirrors Case Bench Step 1: Model) */
  .setup-wrap{max-width:640px;}
  .setup-card{
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:22px 24px;box-shadow:var(--shadow-sm);
  }
  .setup-done-note{
    display:flex;align-items:center;gap:10px;margin-bottom:18px;
    background:var(--ember-glow);border:1px solid var(--ember);border-radius:10px;
    padding:10px 14px;font-size:13px;color:var(--ember-bright);font-weight:600;
  }
  .setup-tabrow{display:flex;gap:4px;background:var(--panel-sunken);padding:4px;border-radius:999px;margin-bottom:16px;width:fit-content;}
  .setup-tabrow .tab{
    font-family:var(--display);font-weight:600;font-size:12.5px;
    padding:7px 16px;background:transparent;border:none;border-radius:999px;
    cursor:pointer;color:var(--ink-dim);transition:background .12s,color .12s;
  }
  .setup-tabrow .tab.active{background:var(--ember);color:#fff;}
  .setup-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px;}
  @media(max-width:600px){.setup-row{grid-template-columns:1fr;}}
  .setup-card label{font-size:12.5px;color:var(--ink-dim);display:block;margin-bottom:4px;font-weight:500;}
  .setup-card input[type=text],.setup-card input[type=password]{
    width:100%;font-family:var(--display);font-size:14px;background:var(--panel);
    border:1px solid var(--line);border-radius:8px;padding:9px 11px;color:var(--ink);
  }
  .setup-card input:focus{outline:2px solid var(--ember);outline-offset:1px;}
  .setup-key-status{font-size:12px;font-weight:500;margin-top:8px;}
  .setup-key-status.ok{color:var(--ember-bright);}
  .setup-key-status.empty{color:var(--ink-faint);}
  .setup-help{font-size:12px;color:var(--ink-dim);margin-top:10px;line-height:1.55;}
  .setup-help a{color:var(--bronze-bright);}
  .setup-note{font-size:13px;color:var(--ink-dim);margin-top:16px;}

  /* sidebar author/project links */
  .sidebar-links{padding:2px 20px 14px;display:flex;flex-direction:column;gap:6px;}
  .sidebar-links a{
    display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;
    color:var(--bronze-bright);background:var(--panel-sunken);border:1px solid var(--line);
    border-radius:999px;padding:7px 12px;text-decoration:none;transition:background .12s,color .12s,border-color .12s;
  }
  .sidebar-links a:hover{background:var(--ember);color:#fff;border-color:var(--ember);}
  .sidebar-links a .ico{flex:none;width:14px;height:14px;display:inline-flex;}
  .sidebar-links a .ico svg{width:100%;height:100%;}

  /* ---------- Research module (ported from Case Bench, minus Step 1) ---------- */
  .rs-step{margin-bottom:24px;}
  .rs-step-label{
    font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);
    font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:10px;
  }
  .rs-step-label .num{
    width:20px;height:20px;border-radius:50%;background:var(--ember);color:#fff;
    display:inline-flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;font-weight:700;
  }
  .rs-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px 22px;box-shadow:var(--shadow-sm);}
  .rs-card textarea, .rs-card input[type=text], .rs-card select{
    width:100%;font-family:var(--display);font-size:14px;background:var(--panel);
    border:1px solid var(--line);border-radius:8px;padding:9px 11px;color:var(--ink);
  }
  .rs-card textarea{resize:vertical;min-height:100px;line-height:1.5;}
  .rs-card label{font-size:12.5px;color:var(--ink-dim);display:block;margin-bottom:4px;font-weight:500;}
  .rs-card input:focus, .rs-card textarea:focus, .rs-card select:focus{outline:2px solid var(--ember);outline-offset:1px;}
  .rs-hint{font-size:12px;color:var(--ink-dim);margin-top:6px;}
  .rs-hint.ok{color:var(--ember-bright);}
  .rs-hint.err{color:var(--alert);}
  .rs-sample-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;}
  .rs-sample-row > div{flex:1;min-width:150px;}
  .rs-upload-row{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);}
  .rs-upload-row input[type=file]{
    width:100%;font-family:var(--display);font-size:12.5px;color:var(--ink-dim);
    border:1px dashed var(--line);border-radius:8px;padding:8px 10px;background:var(--panel-sunken);
  }
  .rs-upload-row input[type=file]::file-selector-button{
    font-family:var(--display);font-weight:600;font-size:12px;color:#fff;
    background:var(--ember);border:none;border-radius:999px;padding:6px 13px;margin-right:10px;cursor:pointer;
  }
  .rs-activities{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;}
  .rs-activity{
    background:var(--panel);border:1.5px solid var(--line);border-radius:12px;
    padding:15px 14px;cursor:pointer;transition:border-color .12s, box-shadow .12s, transform .06s;text-align:left;
  }
  .rs-activity:hover{border-color:var(--ember);transform:translateY(-1px);}
  .rs-activity.selected{border-color:var(--ember);background:var(--ember-glow);}
  .rs-activity .aname{font-weight:700;font-size:13.5px;margin-bottom:4px;color:var(--ink);}
  .rs-activity .adesc{font-size:11.5px;color:var(--ink-dim);line-height:1.4;}
  #rsWorkspace{margin-top:30px;display:none;}
  #rsWorkspace.visible{display:block;}
  .rs-ws-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px;}
  .rs-ws-header .wtitle{font-size:18px;font-weight:800;color:var(--ink);}
  .rs-ws-header .wsub{font-size:12px;color:var(--ink-dim);font-weight:500;}
  .rs-ws-actions{display:flex;flex-wrap:wrap;gap:8px;}
  .rs-btn{
    font-weight:700;font-size:13px;background:var(--ember);color:#fff;border:none;
    border-radius:999px;padding:10px 18px;cursor:pointer;transition:background .12s;font-family:var(--display);
  }
  .rs-btn:hover{background:var(--ember-dim);}
  .rs-btn:disabled{opacity:.5;cursor:not-allowed;}
  .rs-btn.secondary{background:transparent;color:var(--ink-dim);border:1.5px solid var(--line);}
  .rs-btn.secondary:hover{background:var(--panel-sunken);color:var(--ink);}
  .rs-error-note{font-size:12.5px;color:var(--alert);background:var(--alert-soft);border:1px solid var(--alert);border-radius:8px;padding:9px 12px;margin-bottom:10px;display:none;}
  .rs-error-note.show{display:block;}
  .rs-transcript{
    border:1px solid var(--line);border-radius:12px;background:var(--panel);box-shadow:var(--shadow-sm);
    min-height:120px;max-height:520px;overflow-y:auto;padding:16px;margin-bottom:12px;
  }
  .rs-msg{margin-bottom:16px;max-width:88%;}
  .rs-msg.user{margin-left:auto;}
  .rs-msg .who{font-size:10.5px;text-transform:uppercase;font-weight:700;letter-spacing:.05em;color:var(--ink-faint);margin-bottom:4px;}
  .rs-msg.user .who{text-align:right;}

  /* text-to-speech control on assistant answers */
  .rs-who-row{display:flex;align-items:center;gap:6px;margin-bottom:4px;}
  .rs-who-row .who{margin-bottom:0;}
  .rs-tts-btn{
    display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;
    width:20px;height:20px;padding:0;
    background:transparent;color:var(--ink-faint);
    border:1px solid transparent;border-radius:50%;
    cursor:pointer;transition:background .12s ease,color .12s ease;
  }
  .rs-tts-btn:hover{background:var(--ember-glow);color:var(--ember-bright);}
  .rs-tts-btn svg{width:12px;height:12px;display:block;}
  .rs-tts-btn.speaking{background:var(--ember-glow);color:var(--ember-bright);border-color:var(--line);}
  .rs-tts-btn.speaking .tts-wave-1{animation:rsTtsPulse 1s ease-in-out infinite;}
  .rs-tts-btn.speaking .tts-wave-2{animation:rsTtsPulse 1s ease-in-out infinite .18s;}
  @keyframes rsTtsPulse{0%,100%{opacity:.3;}50%{opacity:1;}}
  @media(prefers-reduced-motion:reduce){
    .rs-tts-btn.speaking .tts-wave-1,.rs-tts-btn.speaking .tts-wave-2{animation:none;opacity:1;}
  }

  .rs-msg .bubble{padding:11px 14px;border-radius:12px;font-size:14px;line-height:1.55;white-space:pre-wrap;}
  .rs-msg.assistant .bubble{background:var(--ember-glow);border:1px solid var(--line);border-top-left-radius:4px;}
  .rs-msg.user .bubble{background:var(--ember);color:#fff;border-top-right-radius:4px;}
  .rs-msg.system .bubble{background:transparent;border:1px dashed var(--line);color:var(--ink-dim);font-style:italic;font-size:12.5px;border-radius:8px;}
  .rs-typing::after{content:'';animation:rsDots 1.2s steps(4,end) infinite;}
  @keyframes rsDots{0%{content:'';}25%{content:'.';}50%{content:'..';}75%{content:'...';}}
  .rs-composer{display:flex;gap:8px;align-items:flex-end;}
  .rs-composer textarea{min-height:56px;flex:1;}
  .rs-contribute-card{
    margin-top:16px;border:1px dashed var(--line);background:var(--ember-glow);border-radius:12px;padding:18px 20px;text-align:center;
  }
  .rs-contribute-card h3{margin:0 0 6px;font-size:13.5px;font-weight:700;color:var(--ink);}
  .rs-contribute-card p{margin:0 0 12px;font-size:12.5px;color:var(--ink-dim);line-height:1.6;max-width:560px;margin-left:auto;margin-right:auto;}
  .rs-contribute-status{font-size:12px;font-weight:600;margin-top:10px;min-height:16px;}
  .rs-contribute-status.ok{color:var(--ember-bright);}
  .rs-contribute-status.err{color:var(--alert);}
  .rs-setup-nudge{
    max-width:640px;text-align:center;padding:40px 28px;background:var(--panel);
    border:1px dashed var(--line);border-radius:14px;color:var(--ink-dim);
  }
  .rs-setup-nudge h3{margin:0 0 8px;color:var(--ink);}
  .rs-setup-nudge button{margin-top:14px;}

  /* mobile toggle */
  .menu-toggle{
    display:none;position:fixed;top:14px;left:14px;z-index:50;
    background:var(--panel);border:1px solid var(--line);border-radius:8px;
    width:38px;height:38px;align-items:center;justify-content:center;box-shadow:var(--shadow-sm);cursor:pointer;
  }
  .menu-toggle span, .menu-toggle span::before, .menu-toggle span::after{
    content:'';display:block;width:16px;height:2px;background:var(--ink);position:relative;
  }
  .menu-toggle span::before{position:absolute;top:-5px;}
  .menu-toggle span::after{position:absolute;top:5px;}

  /* ---------- Main ---------- */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{
    padding:20px 32px;border-bottom:1px solid var(--line);background:var(--panel);
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  }
  .topbar .tool-title{font-size:20px;font-weight:800;letter-spacing:-0.01em;}
  .topbar .tool-desc{color:var(--ink-dim);font-size:13.5px;}
  .topbar .meta{margin-left:auto;display:flex;gap:8px;}
  .pill{
    font-family:var(--mono);font-size:11px;font-weight:600;color:var(--ink-dim);
    background:var(--panel-sunken);border:1px solid var(--line);border-radius:20px;padding:4px 11px;
  }

  .content{flex:1;padding:28px 32px 60px;}

  /* empty-slot placeholder card (used for tools not yet added) */
  .empty-tool{
    max-width:640px;margin:40px auto 0;text-align:center;padding:44px 28px;
    background:var(--panel);border:1px dashed var(--line);border-radius:14px;color:var(--ink-dim);
  }
  .empty-tool .icon{
    width:44px;height:44px;border-radius:50%;background:var(--panel-sunken);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:18px;color:var(--ember-bright);
  }
  .empty-tool h3{margin:0 0 8px;color:var(--ink);font-size:16px;}
  .empty-tool p{margin:0;font-size:13.5px;}
  .empty-tool code{
    background:var(--panel-sunken);border:1px solid var(--line);border-radius:6px;
    padding:1px 6px;font-family:var(--mono);font-size:12px;color:var(--bronze-bright);
  }

  /* home/landing panel */
  .home-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:8px;}
  .home-card{
    background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;
    cursor:pointer;transition:box-shadow .15s,transform .15s;
  }
  .home-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);}
  .home-card .num{
    font-family:var(--mono);font-size:11px;color:var(--ink-faint);margin-bottom:8px;
  }
  .home-card .title{font-weight:700;font-size:14.5px;margin-bottom:5px;}
  .home-card .desc{font-size:12.5px;color:var(--ink-dim);}
  .home-card .status{
    display:inline-block;margin-top:10px;font-family:var(--mono);font-size:10px;
    padding:2px 8px;border-radius:20px;font-weight:600;
  }
  .home-card .status.ready{background:rgba(8,145,178,.12);color:var(--ember-bright);}
  .home-card .status.pending{background:var(--panel-sunken);color:var(--ink-faint);border:1px solid var(--line);}

  .intro{max-width:70ch;}
  .intro h2{font-size:22px;margin:0 0 8px;}
  .intro p{color:var(--ink-dim);font-size:14px;}

  /* tool body container — where each tool's own markup/iframe/script mounts */
  .tool-body{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px;box-shadow:var(--shadow-sm);}
  .tool-body iframe{width:100%;border:0;min-height:70vh;border-radius:8px;}

  @media (max-width:860px){
    .menu-toggle{display:flex;}
    .sidebar{
      position:fixed;left:0;top:0;height:100vh;z-index:40;transform:translateX(-100%);
      transition:transform .2s ease;box-shadow:var(--shadow-lg);
    }
    .sidebar.open{transform:translateX(0);}
    .topbar{padding:16px 20px 16px 60px;}
    .content{padding:20px 18px 50px;}

}

<body>

<script>
/* ============================================================
   TOOL REGISTRY
   Add new tools here one at a time. Each entry:
   {
     id: 'unique-slug',
     group: 'Category name for sidebar grouping',
     title: 'Display name',
     desc: 'One-line description shown in topbar/home card',
     status: 'ready' | 'pending',   // pending = placeholder shown
     render: (container) => { ... }  // fills container with the tool's UI
   }
   For an iframe-embedded external tool, render can just set:
     container.innerHTML = `<div class="tool-body"><iframe src="URL"></iframe></div>`;
   For a fully custom tool, build DOM / attach listeners inside render().
   ============================================================ */
const IFRAME_TOOL = (url) => (container) => {
  container.innerHTML = `<div class="tool-body"><iframe src="${url}" loading="lazy"></iframe></div>`;
};

const TOOLS = [
  { id:'case-bench', group:'Reasoning Tools', title:'Case Bench', desc:'Case-based Socratic learning, MCQs, and clinical reasoning analytics.', status:'ready', render: IFRAME_TOOL('https://avi33tbtt.github.io/bench.html') },
  { id:'case-simulator', group:'Reasoning Tools', title:'Case Simulator', desc:'An interactive tool for running through simulated patient cases.', status:'ready', render: IFRAME_TOOL('https://avi33tbtt.github.io/case-simulator.html') },
  { id:'clinical-practice', group:'Reasoning Tools', title:'Case Practice', desc:'A focused drill tool for practicing clinical cases.', status:'ready', render: (c) => renderCasePractice(c) },
  { id:'clinical-polemos', group:'Reasoning Tools', title:'Clinical Polemos', desc:'A debate-style exercise for discussion and reasoning.', status:'ready', render: IFRAME_TOOL('https://avi33tbtt.github.io/clinical-polemos.html') },
  { id:'case-lens', group:'Reasoning Tools', title:'Case Lens', desc:'Critical thinking around clinical cases from multiple analytical angles.', status:'ready', render: (c) => renderCaseLens(c) },
  { id:'sdm-lens', group:'Reasoning Tools', title:'SDM Lens', desc:'A tool focused on shared decision-making scenarios.', status:'ready', render: (c) => renderSdmLens(c) },
  { id:'ebm-query', group:'Reasoning Tools', title:'EBM Query Generator', desc:'Generate a structured set of critical-appraisal queries.', status:'ready', render: (c) => renderEbmQuery(c) },
  { id:'ccos-builder', group:'Reasoning Tools', title:'CCOS Builder', desc:'Build and order modules for the Clinical Cognition OS.', status:'ready', render: IFRAME_TOOL('https://avi33tbtt.github.io/ccos-builder.html') },
  { id:'courseware', group:'Courses', title:'Courseware', desc:'Structured course material and modules for guided clinical learning.', status:'ready', external: 'https://avi33tbtt.github.io/courseware/' },
  { id:'ebm-course', group:'Courses', title:'EBM', desc:'A course on evidence-based medicine — critically appraising and applying clinical evidence.', status:'ready', external: 'https://avi33tbtt.github.io/ebm/' },
  { id:'clinical-cognition', group:'Courses', title:'Clinical Cognition', desc:'Course content on critical care reasoning and decision-making.', status:'ready', external: 'https://avi33tbtt.github.io/cc/' },
  { id:'tutor', group:'Practice', title:'Tutor', desc:'A set of interactive, drill-style tools for practicing clinical reasoning.', status:'ready', external: 'https://avi33tbtt.github.io/tools/concepts/tutor.html' },
  { id:'article', group:'Article', title:'Article', desc:'Background reading on the Vibe Rounds paradigm and its approach to clinical reasoning.', status:'ready', external: 'https://avi33tbtt.github.io/article.html' },
  { id:'research', group:'Research', title:'Research', desc:'Run a Socratic learning session, then hit Submit at the end — it helps gather data for research.', status:'ready', render: (c) => renderResearch(c) },
];

let currentId = null;

function renderNav(filter=''){
  const nav = document.getElementById('toolNav');
  nav.innerHTML = '';

  // Home item
  const homeBtn = document.createElement('button');
  homeBtn.className = 'nav-item' + (currentId===null ? ' active' : '');
  homeBtn.innerHTML = `<span class="dot"></span><span class="label">Home</span>`;
  homeBtn.onclick = () => openTool(null);
  nav.appendChild(homeBtn);

  // Setup item
  const setupBtn = document.createElement('button');
  setupBtn.className = 'nav-item' + (currentId==='setup' ? ' active' : '');
  setupBtn.innerHTML = `<span class="dot"></span><span class="label">Setup</span>` +
    (isSetupDone() ? `<span class="badge">done</span>` : '');
  setupBtn.onclick = () => openTool('setup');
  nav.appendChild(setupBtn);

  const groups = {};
  TOOLS.forEach(t => {
    if(filter && !t.title.toLowerCase().includes(filter.toLowerCase())) return;
    (groups[t.group] = groups[t.group] || []).push(t);
  });

  Object.entries(groups).forEach(([groupName, items]) => {
    const gTitle = document.createElement('div');
    gTitle.className = 'nav-group-title';
    gTitle.textContent = groupName;
    nav.appendChild(gTitle);
    items.forEach(t => {
      if(t.external){
        const link = document.createElement('a');
        link.className = 'nav-item';
        link.href = t.external;
        link.target = '_blank';
        link.rel = 'noopener';
        link.innerHTML = `<span class="dot"></span><span class="label">${t.title}</span>` +
          (t.status==='pending' ? `<span class="badge">soon</span>` : '');
        nav.appendChild(link);
        return;
      }
      const btn = document.createElement('button');
      btn.className = 'nav-item' + (currentId===t.id ? ' active' : '');
      btn.innerHTML = `<span class="dot"></span><span class="label">${t.title}</span>` +
        (t.status==='pending' ? `<span class="badge">soon</span>` : '');
      btn.onclick = () => openTool(t.id);
      nav.appendChild(btn);
    });
  });
}

function renderHome(){
  document.getElementById('topTitle').textContent = 'Home';
  document.getElementById('topDesc').textContent = 'All your tools, one place.';
  document.getElementById('topMeta').innerHTML = `<span class="pill">${TOOLS.length} tools</span>`;

  const content = document.getElementById('content');
  const homeTools = TOOLS.filter(t => t.group === 'Reasoning Tools' || t.group === 'Reference');
  const cards = homeTools.map((t,i) => `
    <div class="home-card" onclick="openTool('${t.id}')">
      <div class="num">${String(i+1).padStart(2,'0')}</div>
      <div class="title">${t.title}</div>
      <div class="desc">${t.desc}</div>
      <div class="status ${t.status}">${t.status === 'ready' ? 'ready' : 'coming soon'}</div>
    </div>`).join('');

  content.innerHTML = `
    <div class="intro">
      <h2>Welcome back.</h2>
      <p>This hub will hold every Vibe Rounds tool in one place. Pick a tool from the sidebar, or send me the next tool to wire in and I'll add it here.</p>
    </div>
    <div class="home-grid">${cards}</div>
  `;
}

function renderEmptySlot(tool){
  const content = document.getElementById('content');
  content.innerHTML = `
    <div class="empty-tool">
      <div class="icon">＋</div>
      <h3>${tool.title} isn't wired in yet</h3>
      <p>Send me this tool's content, link, or spec and I'll build it into <code>${tool.id}</code> right here in the hub.</p>
    </div>`;
}

function openTool(id){
  currentId = id;
  if(window.innerWidth <= 860) document.getElementById('sidebar').classList.remove('open');

  if(id === null){ renderNav(document.getElementById('navSearch').value); renderHome(); return; }

  if(id === 'setup'){
    renderNav(document.getElementById('navSearch').value);
    document.getElementById('topTitle').textContent = 'Setup';
    document.getElementById('topDesc').textContent = 'Add your API key once — used to generate content across the hub.';
    document.getElementById('topMeta').innerHTML = `<span class="pill">${isSetupDone() ? 'done' : 'not configured'}</span>`;
    renderSetup(document.getElementById('content'));
    return;
  }

  const tool = TOOLS.find(t => t.id === id);
  if(!tool) return;
  if(tool.external){ window.open(tool.external, '_blank', 'noopener'); return; }

  renderNav(document.getElementById('navSearch').value);
  document.getElementById('topTitle').textContent = tool.title;
  document.getElementById('topDesc').textContent = tool.desc;
  document.getElementById('topMeta').innerHTML = `<span class="pill">${tool.status === 'ready' ? 'ready' : 'coming soon'}</span>`;

  const content = document.getElementById('content');
  if(tool.status === 'ready' && typeof tool.render === 'function'){
    content.innerHTML = '';
    tool.render(content);
  } else {
    renderEmptySlot(tool);
  }
}

/* ============================================================
   SETUP (mirrors Case Bench Step 1: Model — bring-your-own-key)
   Once a key is saved, this page is marked "done" and stays out
   of the way; tool pages themselves are plain iframes, so this
   step is only needed once, here in the hub.
   ============================================================ */
const PROVIDERS = {
  claude: { label:'Claude', keyPlaceholder:'sk-ant-...', modelPlaceholder:'claude-sonnet-4-6',
    help:'Create a key at <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">console.anthropic.com</a>. Paste the model name exactly as shown there.' },
  gemini: { label:'Gemini', keyPlaceholder:'AIza...', modelPlaceholder:'gemini-2.5-flash',
    help:'Create a key at <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener">aistudio.google.com/app/apikey</a>.' },
  openai: { label:'ChatGPT', keyPlaceholder:'sk-...', modelPlaceholder:'gpt-4o-mini',
    help:'Create a key at <a href="https://platform.openai.com/api-keys" target="_blank" rel="noopener">platform.openai.com/api-keys</a>.' },
  other: { label:'Other', keyPlaceholder:'API key (leave blank if none)', modelPlaceholder:'model-name-as-required-by-provider', needsEndpoint:true,
    help:'Works with any OpenAI-compatible <code>/chat/completions</code> endpoint — Groq, Together AI, Mistral, DeepSeek, xAI (Grok), Perplexity, OpenRouter, Fireworks, local servers like Ollama or LM Studio, and more.' }
};
let setupProvider = 'claude';

function loadKeys(){ try{ return JSON.parse(localStorage.getItem('casebench_keys')||'{}'); }catch(e){ return {}; } }
function saveKeys(k){ localStorage.setItem('casebench_keys', JSON.stringify(k)); }
function loadModels(){ try{ return JSON.parse(localStorage.getItem('casebench_models')||'{}'); }catch(e){ return {}; } }
function saveModels(m){ localStorage.setItem('casebench_models', JSON.stringify(m)); }
function loadEndpoints(){ try{ return JSON.parse(localStorage.getItem('casebench_endpoints')||'{}'); }catch(e){ return {}; } }
function saveEndpoints(e){ localStorage.setItem('casebench_endpoints', JSON.stringify(e)); }
function hubActiveProvider(){
  const keys = loadKeys();
  const found = Object.keys(keys).find(p => keys[p] && keys[p].trim());
  return found || 'claude';
}

function isSetupDone(){
  const keys = loadKeys();
  return Object.values(keys).some(v => v && v.trim());
}

function renderSetup(container){
  container.innerHTML = `
    <div class="setup-wrap">
      ${isSetupDone() ? `<div class="setup-done-note">✓ Key saved — you're set. You can revisit this anytime to change provider or key.</div>` : ''}
      <div class="setup-card">
        <div class="setup-tabrow" id="setupTabs">
          <div class="tab" data-provider="claude">Claude</div>
          <div class="tab" data-provider="gemini">Gemini</div>
          <div class="tab" data-provider="openai">ChatGPT</div>
          <div class="tab" data-provider="other">Other</div>
        </div>
        <div class="setup-row" id="setupEndpointRow" style="display:none;grid-template-columns:1fr;">
          <div>
            <label for="setupEndpoint">API endpoint (OpenAI-compatible chat/completions URL)</label>
            <input type="text" id="setupEndpoint" placeholder="https://api.groq.com/openai/v1/chat/completions">
          </div>
        </div>
        <div class="setup-row">
          <div>
            <label id="setupKeyLabel" for="setupKey">API key</label>
            <input type="password" id="setupKey" placeholder="sk-ant-...">
          </div>
          <div>
            <label for="setupModel">Model name</label>
            <input type="text" id="setupModel" placeholder="claude-sonnet-4-6">
          </div>
        </div>
        <div class="setup-key-status" id="setupKeyStatus"></div>
        <div class="setup-help" id="setupHelp"></div>
      </div>
      <div class="setup-note">Your key is stored only in this browser's local storage and is never sent through any server of ours.</div>
    </div>
  `;

  document.querySelectorAll('#setupTabs .tab').forEach(t => t.classList.toggle('active', t.dataset.provider === setupProvider));

  function refresh(){
    const p = PROVIDERS[setupProvider];
    document.getElementById('setupKeyLabel').textContent = p.label + ' API key';
    document.getElementById('setupKey').placeholder = p.keyPlaceholder;
    document.getElementById('setupModel').placeholder = p.modelPlaceholder;
    document.getElementById('setupHelp').innerHTML = p.help;

    const keys = loadKeys(), models = loadModels();
    document.getElementById('setupKey').value = keys[setupProvider] || '';
    document.getElementById('setupModel').value = models[setupProvider] || '';

    document.getElementById('setupEndpointRow').style.display = p.needsEndpoint ? '' : 'none';
    if(p.needsEndpoint){
      document.getElementById('setupEndpoint').value = loadEndpoints()[setupProvider] || '';
    }
    updateStatus();
  }
  function updateStatus(){
    const keys = loadKeys();
    const el = document.getElementById('setupKeyStatus');
    if(keys[setupProvider]){
      el.textContent = 'Key saved locally for ' + PROVIDERS[setupProvider].label + '.';
      el.className = 'setup-key-status ok';
    } else {
      el.textContent = 'No key saved for this provider yet.';
      el.className = 'setup-key-status empty';
    }
  }

  document.querySelectorAll('#setupTabs .tab').forEach(tab => {
    tab.addEventListener('click', () => {
      setupProvider = tab.dataset.provider;
      document.querySelectorAll('#setupTabs .tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      refresh();
    });
  });
  document.getElementById('setupKey').addEventListener('input', (e) => {
    const keys = loadKeys();
    keys[setupProvider] = e.target.value.trim();
    saveKeys(keys);
    updateStatus();
    renderNav(document.getElementById('navSearch').value);
    document.getElementById('topMeta').innerHTML = `<span class="pill">${isSetupDone() ? 'done' : 'not configured'}</span>`;
  });
  document.getElementById('setupModel').addEventListener('input', (e) => {
    const models = loadModels();
    models[setupProvider] = e.target.value.trim();
    saveModels(models);
  });
  document.getElementById('setupEndpoint') && document.getElementById('setupEndpoint').addEventListener('input', (e) => {
    const endpoints = loadEndpoints();
    endpoints[setupProvider] = e.target.value.trim();
    saveEndpoints(endpoints);
  });

  refresh();
}

/* ============================================================
   RESEARCH MODULE — everything from bench_lite below Step 1
   (Case, Activity, Workspace, Contribute). Step 1 itself lives
   once in the hub's global Setup page and its saved key/model
   are reused here via loadKeys()/loadModels()/loadEndpoints().
   ============================================================ */
const CONTRIBUTE_ENDPOINT = "https://script.google.com/macros/s/AKfycbwWpGO_4RfgB7JImI4Et3V1wI95E-Am3z9OvKhDu8Qx_BNipOa4ZkgWKQ-qHiPlN2ze/exec";
const RS_SPECIALTIES = ['Any','Allergy and Immunology','Anesthesiology','Cardiology','Cardiothoracic Surgery','Colon and Rectal Surgery','Critical Care / Intensive Care Medicine','Dermatology','Emergency Medicine','Endocrinology','Family Medicine','Gastroenterology','General Surgery','Geriatrics','Gynecologic Oncology','Hematology','Hematology-Oncology','Hepatology','Hospice and Palliative Medicine','Infectious Disease','Internal Medicine','Interventional Radiology','Medical Genetics','Nephrology','Neonatology','Neurology','Neurosurgery','Obstetrics and Gynecology','Occupational Medicine','Oncology','Ophthalmology','Orthopedic Surgery','Otolaryngology (ENT)','Pain Medicine','Pathology','Pediatrics','Pediatric Cardiology','Pediatric Emergency Medicine','Pediatric Surgery','Physical Medicine and Rehabilitation','Plastic Surgery','Podiatry','Preventive Medicine','Psychiatry','Pulmonology','Radiation Oncology','Radiology','Rheumatology','Sleep Medicine','Sports Medicine','Toxicology','Transplant Medicine','Trauma Surgery','Urology','Vascular Surgery'];
const RS_ACTIVITIES = {
  socratic: {
    name: 'Socratic Rounds',
    desc: 'One pointed question at a time. You find the gap yourself.',
    subtitle: 'One question at a time — commit before you get the answer.',
    systemPrompt: (c) => `#VibeRounds You are a warm, encouraging educational assistant who uses the Socratic method to guide clinical reasoning. I am a learner working through a clinical case. Your role is to ask me one question at a time, wait for my response, and acknowledge what I got right before gently probing further. Only reveal the answer after I have made a genuine attempt and then explicitly surrendered — if I ask for the answer outright without attempting one, redirect me once with: 'Give your best guess, differential, or next step first,' and only proceed to reveal the answer if I still cannot or will not attempt one after that. Start every session by telling me one thing you believe I will find interesting about this case. Confirm you understand the rules before we begin.\n\nHere is the case:\n\n${c}\n\nBegin now: first confirm you understand the rules above in one short line, then tell me the one interesting thing about this case, then ask your first question.`
  }
};
let rsState = { activity:null, messages:[], running:false };

function rsLoadCaseText(){ try{ return localStorage.getItem('casebench_case') || ''; }catch(e){ return ''; } }
function rsSaveCaseText(t){ try{ localStorage.setItem('casebench_case', t); }catch(e){} }

/* ---------- text-to-speech on assistant answers ---------- */
const RS_TTS_ICON = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 5V4L8 9H4z" fill="currentColor"/><path class="tts-wave tts-wave-1" d="M15.3 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path class="tts-wave tts-wave-2" d="M18.2 5.5a9 9 0 0 1 0 13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`;
const rsTtsSupported = 'speechSynthesis' in window;
let rsTtsActiveBtn = null;
function rsSetBtnSpeaking(btn, speaking){
  btn.classList.toggle('speaking', speaking);
  btn.title = speaking ? 'Stop reading' : 'Read aloud';
  btn.setAttribute('aria-label', speaking ? 'Stop reading answer aloud' : 'Read answer aloud');
}
function rsCleanTextForSpeech(raw){
  const staged = raw.match(/^\[[^\]]+\]\n+([\s\S]*)$/);
  const body = staged ? staged[1] : raw;
  return body
    .replace(/```[\s\S]*?```/g, ' ')
    .replace(/`([^`]+)`/g, '$1')
    .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')
    .replace(/^#{1,6}\s+/gm, '')
    .replace(/\*\*([^*]+)\*\*/g, '$1')
    .replace(/__([^_]+)__/g, '$1')
    .replace(/\*([^*]+)\*/g, '$1')
    .replace(/^\s*[-*+]\s+/gm, '')
    .replace(/\n{2,}/g, '. ')
    .replace(/\s+/g, ' ')
    .trim();
}
function rsStopSpeaking(){
  if(!rsTtsSupported) return;
  window.speechSynthesis.cancel();
  if(rsTtsActiveBtn) rsSetBtnSpeaking(rsTtsActiveBtn, false);
  rsTtsActiveBtn = null;
}
function rsToggleSpeak(btn, rawText){
  const wasThisOne = (rsTtsActiveBtn === btn);
  rsStopSpeaking();
  if(wasThisOne) return;
  const spoken = rsCleanTextForSpeech(rawText);
  if(!spoken) return;
  const utter = new SpeechSynthesisUtterance(spoken);
  const reset = ()=>{ if(rsTtsActiveBtn===btn) rsTtsActiveBtn=null; rsSetBtnSpeaking(btn, false); };
  utter.onend = reset;
  utter.onerror = reset;
  rsSetBtnSpeaking(btn, true);
  rsTtsActiveBtn = btn;
  window.speechSynthesis.speak(utter);
}

      <div class="rs-hint" style="margin-bottom:10px;">One activity, a live back-and-forth. Good for step-by-step reasoning practice.</div>

      <div class="rs-ws-header">

          <div class="wtitle" id="rsWsTitle"></div>
          <div class="wsub" id="rsWsSub"></div>
        </div>
        <div class="rs-ws-actions">

        </div>

      <div class="rs-composer">
        <textarea id="rsComposerInput" placeholder="Your response..."></textarea>

    <div class="rs-contribute-card">
      <h3>Help improve Case Bench</h3>
      <p>Anonymously contribute this session's transcript for educational and research purposes. No names, emails, or API keys are ever included — only the case type, the back-and-forth, and a timestamp.</p>
      <button class="rs-btn" id="rsContributeBtn">Submit</button>
      <div class="rs-contribute-status" id="rsContributeStatus"></div>

  const $r = (id) => document.getElementById(id);

  // provider/model come from global Setup — pick the first configured one
  function activeProvider(){
    const keys = loadKeys();
    const found = Object.keys(keys).find(p => keys[p] && keys[p].trim());
    return found || 'claude';
  }

  // case text persistence
  $r('rsCaseText').value = rsLoadCaseText();
  $r('rsCaseText').addEventListener('input', () => rsSaveCaseText($r('rsCaseText').value));

  // file upload
  const MAX_UPLOAD_BYTES = 10 * 1024 * 1024;
  if(typeof pdfjsLib !== 'undefined'){
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }

    const el = $r('rsUploadStatus');
    el.textContent = msg;
    el.className = 'rs-hint' + (kind ? ' ' + kind : '');

  async function extractPdfText(file){
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({data: buf}).promise;
    let out = [];
    for(let i = 1; i <= pdf.numPages; i++){
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      out.push(content.items.map(it => it.str).join(' '));
    }
    return out.join('\n\n').trim();
  }
  async function extractDocxText(file){
    const buf = await file.arrayBuffer();
    const result = await mammoth.extractRawText({arrayBuffer: buf});
    return (result.value || '').trim();
  }
  $r('rsCaseFile').addEventListener('change', async (e) => {
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    if(file.size > MAX_UPLOAD_BYTES){
      setUploadStatus(`"${file.name}" is ${(file.size/1024/1024).toFixed(1)}MB — max allowed is 10MB.`, 'err');
      e.target.value = ''; return;
    }
    const name = file.name.toLowerCase();
    const isPdf = name.endsWith('.pdf') || file.type === 'application/pdf';
    const isDocx = name.endsWith('.docx');
    const isTxt = name.endsWith('.txt') || file.type === 'text/plain';
    if(!isPdf && !isDocx && !isTxt){
      setUploadStatus('Unsupported file type. Please upload a PDF, Word (.docx), or .txt file.', 'err');
      e.target.value = ''; return;
    }
    setUploadStatus(`Reading "${file.name}"…`);
    try{
      let text = '';
      if(isPdf) text = await extractPdfText(file);
      else if(isDocx) text = await extractDocxText(file);
      else text = await file.text();
      if(!text){
        setUploadStatus(`Couldn't find any readable text in "${file.name}".`, 'err');
        e.target.value = ''; return;
      }
      const existing = $r('rsCaseText').value.trim();
      $r('rsCaseText').value = existing ? existing + '\n\n' + text : text;
      rsSaveCaseText($r('rsCaseText').value);
      setUploadStatus(`Loaded case text from "${file.name}".`, 'ok');
    } catch(err){
      setUploadStatus('Could not read that file: ' + err.message, 'err');

  function buildSampleCasePrompt(difficulty, specialty){
    let ask = 'Generate one realistic, self-contained clinical vignette for a medical learner to practice diagnostic reasoning on. ';
    if(specialty && specialty !== 'Any') ask += `The case must fall within the specialty of ${specialty}. `;
    if(difficulty && difficulty !== 'Any') ask += `Pitch the case difficulty at the level of: ${difficulty}. `;
    else ask += 'Cover a single adult or pediatric patient presenting with a common or classic presentation (your choice — vary it each time). ';
    ask += 'Include age, sex, presenting complaint, relevant history, and pertinent exam/vital sign findings, and a couple of relevant labs or initial test results if appropriate. Do not reveal or hint at the diagnosis name, and do not include headers, labels, or any framing text — output ONLY the vignette itself as a single flowing paragraph of 4-7 sentences, written the way a case would appear in a textbook.';
    return ask;
  }
  $r('rsSampleCaseBtn').addEventListener('click', async (e) => {
    e.preventDefault();
    const btn = $r('rsSampleCaseBtn');
    const provider = activeProvider();
    const keys = loadKeys(), models = loadModels();
    const apiKey = keys[provider];
    const model = models[provider] || PROVIDERS[provider].modelPlaceholder;
    if(!apiKey && !PROVIDERS[provider].needsEndpoint){
      alert('Add an API key in Setup first, then try again.'); return;
    }
    const difficulty = $r('rsSampleDifficulty').value;
    const specialty = $r('rsSampleSpecialty').value;
    const prompt = buildSampleCasePrompt(difficulty, specialty);
    const original = btn.textContent;
    btn.textContent = 'Generating…'; btn.style.pointerEvents = 'none';
    try{
      const msgs = [{role:'user', content:'Begin.'}];
      let sample;
      if(provider === 'claude') sample = await rsCallClaude(apiKey, model, prompt, msgs);
      else if(provider === 'gemini') sample = await rsCallGemini(apiKey, model, prompt, msgs);
      else if(provider === 'other') sample = await rsCallCustom(loadEndpoints()['other'], apiKey, model, prompt, msgs);
      else sample = await rsCallOpenAI(apiKey, model, prompt, msgs);
      sample = (sample || '').trim();
      if(!sample) throw new Error('Empty response.');
      $r('rsCaseText').value = sample;
      rsSaveCaseText(sample);
    } catch(err){
      alert('Could not generate a sample case: ' + err.message);
    } finally {
      btn.textContent = original; btn.style.pointerEvents = '';
    }
  });

  // activities
  function renderActivities(){
    const wrap = $r('rsActivities');
    wrap.innerHTML = '';
    Object.entries(RS_ACTIVITIES).forEach(([key, a]) => {
      const div = document.createElement('div');
      div.className = 'rs-activity' + (rsState.activity===key ? ' selected' : '');
      div.innerHTML = `<div class="aname">${a.name}</div><div class="adesc">${a.desc}</div>`;
      div.addEventListener('click', () => {
        rsState.activity = key;
        renderActivities();
        startDialogueRun();
      });
      wrap.appendChild(div);
    });
  }
  renderActivities();

  function preflightOk(){
    const caseText = $r('rsCaseText').value.trim();
    if(!caseText){ alert('Paste a case first — Step 1.'); return false; }
    const provider = activeProvider();
    const keys = loadKeys();
    if(!keys[provider] && !PROVIDERS[provider].needsEndpoint){
      alert('Add an API key in Setup first.'); return false;
    }
    if(PROVIDERS[provider].needsEndpoint && !loadEndpoints()[provider]){
      alert('Add an API endpoint URL in Setup first.'); return false;
    }
    return true;
  }

  function openWorkspace(title, sub){
    $r('rsWsTitle').textContent = title;
    $r('rsWsSub').textContent = sub;
    $r('rsTranscript').innerHTML = '';
    $r('rsErrorNote').classList.remove('show');
    $r('rsWorkspace').classList.add('visible');
    $r('rsWorkspace').scrollIntoView({behavior:'smooth', block:'start'});
  }

  function appendMsg(role, text){
    const t = $r('rsTranscript');
    const div = document.createElement('div');
    div.className = 'rs-msg ' + role;
    const provider = activeProvider();
    const who = role==='user' ? 'You' : role==='assistant' ? PROVIDERS[provider].label : 'System';
    if(role === 'assistant'){
      div.innerHTML = `<div class="rs-who-row"><div class="who">${who}</div><button type="button" class="rs-tts-btn" aria-label="Read answer aloud" title="Read aloud">${RS_TTS_ICON}</button></div><div class="bubble"></div>`;
      div.querySelector('.bubble').textContent = text;
      const ttsBtn = div.querySelector('.rs-tts-btn');
      if(rsTtsSupported){
        ttsBtn.addEventListener('click', () => rsToggleSpeak(ttsBtn, text));
      } else {
        ttsBtn.disabled = true;
        ttsBtn.title = "This browser doesn't support text-to-speech";
        ttsBtn.setAttribute('aria-label', "Text-to-speech isn't supported in this browser");
      }
    } else {
      div.innerHTML = `<div class="who">${who}</div><div class="bubble"></div>`;
      div.querySelector('.bubble').textContent = text;
    }
    t.appendChild(div);
    t.scrollTop = t.scrollHeight;
  }
  function appendTyping(){
    const t = $r('rsTranscript');
    const div = document.createElement('div');
    div.className = 'rs-msg assistant';
    div.id = 'rsTypingIndicator';
    const provider = activeProvider();
    div.innerHTML = `<div class="who">${PROVIDERS[provider].label}</div><div class="bubble rs-typing">thinking</div>`;
    t.appendChild(div);
    t.scrollTop = t.scrollHeight;
  }
  function removeTyping(){ const el = $r('rsTypingIndicator'); if(el) el.remove(); }

  function startDialogueRun(){
    if(!preflightOk()){ rsState.activity=null; renderActivities(); return; }
    const caseText = $r('rsCaseText').value.trim();
    const a = RS_ACTIVITIES[rsState.activity];
    rsState.messages = [];
    rsState.systemPrompt = a.systemPrompt(caseText);
    openWorkspace(a.name, a.subtitle);
    appendMsg('system', 'Session started — ' + a.name + '.');
    callModel([]);
  }

  async function callModel(messagesSoFar){
    rsState.running = true;
    $r('rsSendBtn').disabled = true;
    $r('rsErrorNote').classList.remove('show');
    appendTyping();
    const provider = activeProvider();
    const keys = loadKeys(), models = loadModels();
    const apiKey = keys[provider];
    const model = models[provider] || PROVIDERS[provider].modelPlaceholder;
    try{
      let reply;
      if(provider === 'claude') reply = await rsCallClaude(apiKey, model, rsState.systemPrompt, messagesSoFar);
      else if(provider === 'gemini') reply = await rsCallGemini(apiKey, model, rsState.systemPrompt, messagesSoFar);
      else if(provider === 'other') reply = await rsCallCustom(loadEndpoints()['other'], apiKey, model, rsState.systemPrompt, messagesSoFar);
      else reply = await rsCallOpenAI(apiKey, model, rsState.systemPrompt, messagesSoFar);
      removeTyping();
      appendMsg('assistant', reply);
      rsState.messages.push({role:'assistant', content: reply});
    } catch(err){
      removeTyping();
      $r('rsErrorNote').textContent = 'Request failed: ' + err.message + ' — check your API key, model name, and that the provider allows browser requests.';
      $r('rsErrorNote').classList.add('show');
    } finally {
      rsState.running = false;
      $r('rsSendBtn').disabled = false;
    }
  }

  $r('rsSendBtn').addEventListener('click', sendComposer);
  $r('rsComposerInput').addEventListener('keydown', (e) => {
    if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendComposer(); }
  });
  function sendComposer(){
    const val = $r('rsComposerInput').value.trim();
    if(!val || rsState.running) return;
    $r('rsComposerInput').value = '';
    appendMsg('user', val);
    rsState.messages.push({role:'user', content: val});
    callModel(rsState.messages);
  }

  $r('rsResetBtn').addEventListener('click', () => {
    rsStopSpeaking();
    rsState.activity = null;
    rsState.messages = [];
    $r('rsWorkspace').classList.remove('visible');
    renderActivities();
  });

  function buildTranscriptText(){
    const title = $r('rsWsTitle').textContent.trim() || 'Vibe Rounds - Research';
    const sub = $r('rsWsSub').textContent.trim();
    const lines = [title];
    if(sub) lines.push(sub);
    lines.push('Exported: ' + new Date().toLocaleString());
    lines.push('----------------------------------------', '');
    const provider = activeProvider();
    rsState.messages.forEach(m => {
      const who = m.role === 'user' ? 'You' : PROVIDERS[provider].label;
      lines.push(who + ':', m.content, '');
    });
    return lines.join('\n');
  }
  function flashBtn(btn, msg){
    const original = btn.textContent;
    btn.textContent = msg; btn.disabled = true;
    setTimeout(() => { btn.textContent = original; btn.disabled = false; }, 1400);
  }
  $r('rsCopyBtn').addEventListener('click', async () => {
    const text = buildTranscriptText();
    try{ await navigator.clipboard.writeText(text); flashBtn($r('rsCopyBtn'), 'Copied!'); }
    catch(err){ flashBtn($r('rsCopyBtn'), 'Copy failed'); }
  });
  $r('rsDownloadBtn').addEventListener('click', () => {
    const text = buildTranscriptText();
    const blob = new Blob([text], {type:'text/plain;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
    a.href = url; a.download = 'research-transcript-' + stamp + '.txt';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    flashBtn($r('rsDownloadBtn'), 'Downloaded!');
  });

  $r('rsContributeBtn').addEventListener('click', async () => {
    const btn = $r('rsContributeBtn');
    const statusEl = $r('rsContributeStatus');
    statusEl.className = 'rs-contribute-status'; statusEl.textContent = '';
    if(!rsState.messages || !rsState.messages.length){
      statusEl.textContent = 'Nothing to submit yet — start a session first.';
      statusEl.classList.add('err'); return;
    }
    btn.disabled = true; btn.textContent = 'Submitting…';
    const provider = activeProvider();
    const payload = { transcript: buildTranscriptText(), runKind:'dialogue', provider: provider, submittedAt: new Date().toISOString() };
    try{
      await fetch(CONTRIBUTE_ENDPOINT, {
        method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(payload)
      });
      statusEl.textContent = 'Thank you — your session was submitted anonymously.';
      statusEl.classList.add('ok');
    } catch(err){
      statusEl.textContent = 'Submission failed. Please try again later.';
      statusEl.classList.add('err');
    } finally {
      btn.disabled = false; btn.textContent = 'Submit';
    }
  });
}

/* ---------- provider API calls (Research module) ---------- */
async function rsCallClaude(apiKey, model, system, msgs){
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body: JSON.stringify({ model, max_tokens:4096, system, messages: msgs.length ? msgs.map(m=>({role:m.role, content:m.content})) : [{role:'user', content:'Begin.'}] })
  });
  if(!res.ok){ const t = await res.text(); throw new Error(res.status + ' ' + t.slice(0,200)); }
  const data = await res.json();
  return (data.content||[]).map(b=>b.text||'').join('\n').trim();
}
async function rsCallGemini(apiKey, model, system, msgs){
  const contents = (msgs.length ? msgs : [{role:'user', content:'Begin.'}]).map(m => ({ role: m.role==='assistant' ? 'model' : 'user', parts:[{text:m.content}] }));
  const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(apiKey)}`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ systemInstruction:{parts:[{text:system}]}, contents })
  });
  if(!res.ok){ const t = await res.text(); throw new Error(res.status + ' ' + t.slice(0,200)); }
  const data = await res.json();
  const cand = data.candidates && data.candidates[0];
  const parts = cand && cand.content && cand.content.parts || [];
  return parts.map(p=>p.text||'').join('\n').trim();
}
async function rsCallCustom(endpoint, apiKey, model, system, msgs){
  if(!endpoint) throw new Error('No API endpoint set for this provider.');
  const messages = [{role:'system', content:system}].concat(msgs.length ? msgs : [{role:'user', content:'Begin.'}]);
  const headers = {'Content-Type':'application/json'};
  if(apiKey) headers['Authorization'] = 'Bearer ' + apiKey;
  const res = await fetch(endpoint, { method:'POST', headers, body: JSON.stringify({ model, messages, max_tokens:4096 }) });
  if(!res.ok){ const t = await res.text(); throw new Error(res.status + ' ' + t.slice(0,200)); }
  const data = await res.json();
  if(data.choices && data.choices[0] && data.choices[0].message) return (data.choices[0].message.content || '').trim();
  if(data.message && data.message.content) return data.message.content.trim();
  if(typeof data.content === 'string') return data.content.trim();
  return JSON.stringify(data).slice(0,500);
}
async function rsCallOpenAI(apiKey, model, system, msgs){
  const messages = [{role:'system', content:system}].concat(msgs.length ? msgs : [{role:'user', content:'Begin.'}]);
  const res = await fetch('https://api.openai.com/v1/chat/completions', {
    method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer ' + apiKey},
    body: JSON.stringify({ model, messages, max_tokens:4096 })
  });
  if(!res.ok){ const t = await res.text(); throw new Error(res.status + ' ' + t.slice(0,200)); }
  const data = await res.json();
  return (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content || '').trim();
}
