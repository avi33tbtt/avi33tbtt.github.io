<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F7FAFB">
<title>Vibe Rounds — Tool Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --bg:#F7FAFB;
    --panel:#FFFFFF;
    --panel-sunken:#F3F6F8;
    --ink:#0B2530;
    --ink-dim:#5B7480;
    --ink-faint:#657277; /* darkened from #94A7AE — original failed WCAG AA (2.4:1); now 4.5:1+ */
    --line:#DCE7EA;
    --line-soft:rgba(11,37,48,0.08);
    --bronze:#5B7480;
    --bronze-dim:#43606B;
    --bronze-bright:#0A6E85;
    --ember:#0891B2;
    --ember-dim:#0A6E85;
    --ember-bright:#0A6E85;
    --ember-glow:rgba(8,145,178,0.22);
    --alert:#C2410C;
    --alert-soft:#FCE9DD;
    --good:#0F766E;
    --good-soft:#DCFCE9;
    --display:'Inter',sans-serif;
    --mono:'IBM Plex Mono','JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
    --shadow-sm:0 1px 2px rgba(11,37,48,.04), 0 8px 24px -16px rgba(11,37,48,.08);
    --shadow-md:0 4px 14px rgba(11,37,48,.08), 0 12px 28px -12px rgba(11,37,48,.12);
    --shadow-lg:0 10px 30px rgba(11,37,48,.10), 0 24px 48px -18px rgba(11,37,48,.16);
    --sidebar-w:260px;
  }

  /* Theme: Minimalist — grayscale, no color pop */
  html[data-theme="minimalist"]{
    --bg:#FFFFFF;
    --panel:#FFFFFF;
    --panel-sunken:#F2F2F2;
    --ink:#161616;
    --ink-dim:#5B5B5B;
    --ink-faint:#6E6E6E; /* darkened from #9A9A9A — original failed WCAG AA (2.8:1); now 4.5:1+ */
    --line:#E4E4E4;
    --line-soft:#F0F0F0;
    --bronze:#161616;
    --bronze-dim:#000000;
    --bronze-bright:#161616;
    --ember:#161616;
    --ember-dim:#000000;
    --ember-bright:#161616;
    --ember-glow:rgba(22,22,22,0.10);
    --alert:#B3261E;
    --alert-soft:#F8E7E6;
    --good:#166534;
    --good-soft:#E8F3EA;
    --display:'Inter',sans-serif;
  }

  /* Theme: Terminal — dark/amber monospace */
  html[data-theme="terminal"]{
    --bg:#000000;
    --panel:#0A0A0A;
    --panel-sunken:#141414;
    --ink:#FFB238;
    --ink-dim:#9C7A32;
    --ink-faint:#9A7A31; /* brightened from #6B5522 — original failed WCAG AA (3.0:1); now 4.5:1+ */
    --line:#3A2A00;
    --line-soft:#231A00;
    --bronze:#FFB238;
    --bronze-dim:#FFCB6B;
    --bronze-bright:#FFCB6B;
    --ember:#FFB238;
    --ember-dim:#FFCB6B;
    --ember-bright:#FFCB6B;
    --ember-glow:rgba(255,178,56,0.18);
    --alert:#FF4D3D;
    --alert-soft:#2B0C08;
    --good:#7CFFB2;
    --good-soft:#0C2A17;
    --display:'IBM Plex Mono','JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  }
  html[data-theme="terminal"] .home-card .status.ready,
  html[data-theme="terminal"] .nav-item.active{color:#000;}

  *{box-sizing:border-box;}
  html{transition:background .15s ease;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg);color:var(--ink);font-family:var(--display);
    font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;
    transition:background .15s ease,color .15s ease;
  }
  a{color:var(--bronze-bright);}
  a:hover{color:var(--ember-bright);}

  .app{display:flex;min-height:100vh;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:var(--sidebar-w);min-width:var(--sidebar-w);
    background:var(--panel);border-right:1px solid var(--line);
    display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;
  }
  .brand{padding:22px 20px 16px;border-bottom:1px solid var(--line);}
  .brand .kicker{
    font-family:var(--mono);color:var(--bronze-bright);letter-spacing:.14em;text-transform:uppercase;
    font-size:11px;font-weight:600;margin-bottom:6px;
  }
  .brand h1{font-size:18px;font-weight:800;margin:0;letter-spacing:-0.01em;}
  .brand h1 em{font-style:normal;color:var(--ember-bright);}

  .nav-search{padding:14px 16px 8px;}
  .nav-search input{
    width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:8px;
    background:var(--panel-sunken);color:var(--ink);font-family:var(--display);font-size:13px;outline:none;
  }
  .nav-search input:focus{border-color:var(--ember);}

  nav.tool-nav{flex:1;padding:8px 12px 20px;}
  .nav-group-title{
    font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--ink-faint);font-weight:600;margin:16px 8px 6px;
  }
  .nav-item{
    display:flex;align-items:center;gap:10px;width:100%;text-align:left;
    background:transparent;border:none;border-radius:8px;padding:9px 10px;
    color:var(--ink-dim);font-family:var(--display);font-size:13.5px;font-weight:600;
    cursor:pointer;transition:background .12s,color .12s;
  }
  .nav-item:hover{background:var(--panel-sunken);color:var(--ink);}
  .nav-item.active{background:var(--ember-glow);color:var(--ember-bright);}
  .nav-item:focus-visible,
  .theme-select:focus-visible,
  .auth-signout:focus-visible,
  .sidebar-links a:focus-visible,
  .menu-toggle:focus-visible{
    outline:2px solid var(--ember);outline-offset:-2px;
  }
  .nav-item .dot{
    flex:none;width:6px;height:6px;border-radius:50%;background:var(--line);
  }
  .nav-item.active .dot{background:var(--ember);}
  .nav-item .label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .nav-item .badge{
    flex:none;font-family:var(--mono);font-size:9.5px;color:var(--ink-faint);
    background:var(--panel-sunken);border:1px solid var(--line);border-radius:20px;padding:1px 7px;
  }
  .sidebar-foot{padding:14px 20px;border-top:1px solid var(--line);font-size:11px;color:var(--ink-faint);}

  .auth-row{padding:14px 16px 2px;border-bottom:1px solid var(--line);}
  .auth-signed-in{display:flex;align-items:center;gap:8px;background:var(--panel-sunken);border:1px solid var(--line);border-radius:10px;padding:8px 10px;}
  #gSignInBtn,#gSignInBtnTop{border-radius:20px;overflow:hidden;line-height:0;}
  .gsi-note{font-size:11px;color:var(--ink-dim);margin-top:6px;line-height:1.4;}
  .auth-avatar{width:26px;height:26px;border-radius:50%;flex:none;background:var(--line);}
  .auth-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px;font-weight:600;color:var(--ink);}
  .auth-signout{flex:none;background:transparent;border:1px solid var(--line);border-radius:6px;color:var(--ink-dim);font-family:var(--display);font-size:11px;font-weight:600;padding:4px 8px;cursor:pointer;}
  .auth-signout:hover{color:var(--ink);border-color:var(--ink-faint);}

  .theme-row{padding:12px 16px 4px;}
  .theme-row label{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;margin-bottom:6px;}
  .theme-select{
    width:100%;display:inline-flex;align-items:center;gap:6px;
    background:var(--panel-sunken);border:1px solid var(--line);color:var(--ink);
    font-family:var(--display);font-weight:600;font-size:12.5px;
    border-radius:8px;padding:7px 30px 7px 10px;cursor:pointer;
    -webkit-appearance:none;appearance:none;
    background-image:url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'%3E%3Cpath fill='%235B7480' d='M1 1l5 5 5-5'/%3E%3C/svg%3E");
    background-repeat:no-repeat;background-position:right 10px center;background-size:10px;
  }
  .theme-select:hover{border-color:var(--ember);}

  /* Setup page (mirrors Case Bench Step 1: Model) */
  .setup-wrap{max-width:640px;}
  .setup-card{
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:22px 24px;box-shadow:var(--shadow-sm);
  }
  .setup-done-note{
    display:flex;align-items:center;gap:10px;margin-bottom:18px;
    background:var(--ember-glow);border:1px solid var(--ember);border-radius:10px;
    padding:10px 14px;font-size:13px;color:var(--ember-bright);font-weight:600;
  }
  .setup-tabrow{display:flex;gap:4px;background:var(--panel-sunken);padding:4px;border-radius:999px;margin-bottom:16px;width:fit-content;}
  .setup-tabrow .tab{
    font-family:var(--display);font-weight:600;font-size:12.5px;
    padding:7px 16px;background:transparent;border:none;border-radius:999px;
    cursor:pointer;color:var(--ink-dim);transition:background .12s,color .12s;
  }
  .setup-tabrow .tab.active{background:var(--ember);color:#fff;}
  .setup-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px;}
  @media(max-width:600px){.setup-row{grid-template-columns:1fr;}}
  .setup-card label{font-size:12.5px;color:var(--ink-dim);display:block;margin-bottom:4px;font-weight:500;}
  .setup-card input[type=text],.setup-card input[type=password]{
    width:100%;font-family:var(--display);font-size:14px;background:var(--panel);
    border:1px solid var(--line);border-radius:8px;padding:9px 11px;color:var(--ink);
  }
  .setup-card input:focus{outline:2px solid var(--ember);outline-offset:1px;}

  /* Buttons on plain .setup-wrap pages (e.g. History) — mirrors the button
     styling used inside the individual tool pages so they aren't left
     rendering as unstyled native buttons. */
  .setup-wrap button.secondary,
  .setup-wrap button.danger,
  .setup-wrap button.star-toggle{
    font-family:var(--display);font-weight:600;font-size:13px;
    border-radius:8px;padding:8px 14px;cursor:pointer;
    transition:background .12s,color .12s,border-color .12s;
  }
  .setup-wrap button.secondary{background:transparent;color:var(--ink-dim);border:1.5px solid var(--line);}
  .setup-wrap button.secondary:hover{background:var(--panel-sunken);color:var(--ink);border-color:var(--line);}
  .setup-wrap button.danger{background:transparent;color:var(--alert);border:1.5px solid var(--alert-soft);}
  .setup-wrap button.danger:hover{background:var(--alert);color:#fff;border-color:var(--alert);}
  .setup-wrap button.small{padding:6px 12px;font-size:12px;}
  .setup-wrap button.star-toggle{
    background:transparent;border:1.5px solid var(--line);color:var(--ink-faint);
    padding:6px 10px;font-size:14px;line-height:1;
  }
  .setup-wrap button.star-toggle:hover{border-color:#E0A100;color:#E0A100;}
  .setup-wrap button.star-toggle.starred{background:rgba(224,161,0,0.12);border-color:#E0A100;color:#E0A100;}
  .hub-history-row.is-starred{border-color:#E0A100;box-shadow:0 0 0 1px rgba(224,161,0,0.25);}
  .hub-chat{display:flex;flex-direction:column;gap:14px;}
  .hub-chat .hc-msg{max-width:88%;}
  .hub-chat .hc-msg.hc-user{margin-left:auto;}
  .hub-chat .hc-msg.hc-system{max-width:100%;text-align:center;}
  .hub-chat .hc-who{font-size:10.5px;text-transform:uppercase;font-weight:700;letter-spacing:.05em;color:var(--ink-faint);margin-bottom:4px;}
  .hub-chat .hc-user .hc-who{text-align:right;}
  .hub-chat .hc-bubble{padding:11px 14px;border-radius:12px;font-size:13.5px;line-height:1.6;white-space:pre-wrap;}
  .hub-chat .hc-assistant .hc-bubble{background:var(--panel-sunken);border:1px solid var(--line);border-top-left-radius:4px;color:var(--ink);}
  .hub-chat .hc-user .hc-bubble{background:var(--ember);color:#fff;border-top-right-radius:4px;}
  .hub-chat .hc-system .hc-bubble{display:inline-block;background:transparent;border:1px dashed var(--line);color:var(--ink-dim);font-style:italic;font-size:12px;border-radius:8px;white-space:pre-wrap;}

  .ca-stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:22px;}
  .ca-stat{background:var(--panel-sunken);border:1px solid var(--line);border-radius:10px;padding:14px 12px;text-align:center;}
  .ca-stat-num{font-family:var(--display);font-weight:800;font-size:22px;color:var(--ember-bright);line-height:1.1;}
  .ca-stat-label{font-size:11px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.05em;margin-top:4px;}
  .ca-section-title{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--bronze-bright);margin:18px 0 10px;}
  .ca-rows{display:flex;flex-direction:column;gap:10px;}
  .ca-row{display:grid;grid-template-columns:120px 1fr 110px;align-items:center;gap:10px;}
  .ca-row-label{font-size:12.5px;color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ca-row-bar{background:var(--panel-sunken);border:1px solid var(--line);border-radius:6px;height:10px;overflow:hidden;}
  .ca-row-fill{height:100%;background:var(--ember);border-radius:6px;}
  .ca-row-val{font-size:11.5px;color:var(--ink-dim);font-family:var(--mono);text-align:right;white-space:nowrap;}
  @media(max-width:520px){.ca-row{grid-template-columns:90px 1fr 90px;}}
  .setup-key-status{font-size:12px;font-weight:500;margin-top:8px;}
  .setup-key-status.ok{color:var(--ember-bright);}
  .setup-key-status.empty{color:var(--ink-faint);}
  .setup-section-title{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;margin-bottom:12px;}
  .setup-btn-row{display:flex;gap:8px;margin-top:12px;}
  .setup-btn{
    font-family:var(--display);font-weight:600;font-size:13px;border-radius:8px;
    padding:8px 18px;cursor:pointer;transition:background .12s,color .12s,border-color .12s;
  }
  .setup-btn-save{background:var(--ember);color:#fff;border:1px solid var(--ember);}
  .setup-btn-save:hover{background:var(--ember-dim);border-color:var(--ember-dim);}
  .setup-btn-clear{background:transparent;color:var(--ink-dim);border:1px solid var(--line);}
  .setup-btn-clear:hover{color:var(--ink);border-color:var(--ink-faint);}
  .setup-tts-select{
    width:100%;font-family:var(--display);font-size:14px;background:var(--panel);
    border:1px solid var(--line);border-radius:8px;padding:9px 11px;color:var(--ink);
    -webkit-appearance:none;appearance:none;cursor:pointer;
    background-image:url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'%3E%3Cpath fill='%235B7480' d='M1 1l5 5 5-5'/%3E%3C/svg%3E");
    background-repeat:no-repeat;background-position:right 12px center;background-size:10px;padding-right:32px;
  }
  .setup-tts-select:focus{outline:2px solid var(--ember);outline-offset:1px;}
  .setup-help{font-size:12px;color:var(--ink-dim);margin-top:10px;line-height:1.55;}
  .setup-help a{color:var(--bronze-bright);}
  .setup-note{font-size:13px;color:var(--ink-dim);margin-top:16px;}

  /* sidebar author/project links */
  .sidebar-links{padding:2px 20px 14px;display:flex;flex-direction:column;gap:6px;}
  .sidebar-links a{
    display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;
    color:var(--bronze-bright);background:var(--panel-sunken);border:1px solid var(--line);
    border-radius:999px;padding:7px 12px;text-decoration:none;transition:background .12s,color .12s,border-color .12s;
  }
  .sidebar-links a:hover{background:var(--ember);color:#fff;border-color:var(--ember);}
  .sidebar-links a .ico{flex:none;width:14px;height:14px;display:inline-flex;}
  .sidebar-links a .ico svg{width:100%;height:100%;}

  /* ---------- Research module (ported from Case Bench, minus Step 1) ---------- */
  .rs-step{margin-bottom:24px;}
  .rs-step-label{
    font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);
    font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:10px;
  }
  .rs-step-label .num{
    width:20px;height:20px;border-radius:50%;background:var(--ember);color:#fff;
    display:inline-flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;font-weight:700;
  }
  .rs-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px 22px;box-shadow:var(--shadow-sm);}
  .rs-card textarea, .rs-card input[type=text], .rs-card select{
    width:100%;font-family:var(--display);font-size:14px;background:var(--panel);
    border:1px solid var(--line);border-radius:8px;padding:9px 11px;color:var(--ink);
  }
  .rs-card textarea{resize:vertical;min-height:100px;line-height:1.5;}
  .rs-card label{font-size:12.5px;color:var(--ink-dim);display:block;margin-bottom:4px;font-weight:500;}
  .rs-card input:focus, .rs-card textarea:focus, .rs-card select:focus{outline:2px solid var(--ember);outline-offset:1px;}
  .rs-hint{font-size:12px;color:var(--ink-dim);margin-top:6px;}
  .rs-hint.ok{color:var(--ember-bright);}
  .rs-hint.err{color:var(--alert);}
  .rs-sample-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;}
  .rs-sample-row > div{flex:1;min-width:150px;}
  .rs-upload-row{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);}
  .rs-upload-row input[type=file]{
    width:100%;font-family:var(--display);font-size:12.5px;color:var(--ink-dim);
    border:1px dashed var(--line);border-radius:8px;padding:8px 10px;background:var(--panel-sunken);
  }
  .rs-upload-row input[type=file]::file-selector-button{
    font-family:var(--display);font-weight:600;font-size:12px;color:#fff;
    background:var(--ember);border:none;border-radius:999px;padding:6px 13px;margin-right:10px;cursor:pointer;
  }
  .rs-activities{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;}
  .rs-activity{
    background:var(--panel);border:1.5px solid var(--line);border-radius:12px;
    padding:15px 14px;cursor:pointer;transition:border-color .12s, box-shadow .12s, transform .06s;text-align:left;
  }
  .rs-activity:hover{border-color:var(--ember);transform:translateY(-1px);}
  .rs-activity.selected{border-color:var(--ember);background:var(--ember-glow);}
  .rs-activity .aname{font-weight:700;font-size:13.5px;margin-bottom:4px;color:var(--ink);}
  .rs-activity .adesc{font-size:11.5px;color:var(--ink-dim);line-height:1.4;}
  #rsWorkspace{margin-top:30px;display:none;}
  #rsWorkspace.visible{display:block;}
  .rs-ws-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px;}
  .rs-ws-header .wtitle{font-size:18px;font-weight:800;color:var(--ink);}
  .rs-ws-header .wsub{font-size:12px;color:var(--ink-dim);font-weight:500;}
  .rs-ws-actions{display:flex;flex-wrap:wrap;gap:8px;}
  .rs-btn{
    font-weight:700;font-size:13px;background:var(--ember);color:#fff;border:none;
    border-radius:999px;padding:10px 18px;cursor:pointer;transition:background .12s;font-family:var(--display);
  }
  .rs-btn:hover{background:var(--ember-dim);}
  .rs-btn:disabled{opacity:.5;cursor:not-allowed;}
  .rs-btn.secondary{background:transparent;color:var(--ink-dim);border:1.5px solid var(--line);}
  .rs-btn.secondary:hover{background:var(--panel-sunken);color:var(--ink);}
  .rs-error-note{font-size:12.5px;color:var(--alert);background:var(--alert-soft);border:1px solid var(--alert);border-radius:8px;padding:9px 12px;margin-bottom:10px;display:none;}
  .rs-error-note.show{display:block;}
  .rs-transcript{
    border:1px solid var(--line);border-radius:12px;background:var(--panel);box-shadow:var(--shadow-sm);
    min-height:120px;max-height:520px;overflow-y:auto;padding:16px;margin-bottom:12px;
  }
  .rs-msg{margin-bottom:16px;max-width:88%;}
  .rs-msg.user{margin-left:auto;}
  .rs-msg .who{font-size:10.5px;text-transform:uppercase;font-weight:700;letter-spacing:.05em;color:var(--ink-faint);margin-bottom:4px;}
  .rs-msg.user .who{text-align:right;}

  /* text-to-speech control on assistant answers */
  .rs-who-row{display:flex;align-items:center;gap:6px;margin-bottom:4px;}
  .rs-who-row .who{margin-bottom:0;}
  .rs-tts-btn{
    display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;
    width:20px;height:20px;padding:0;
    background:transparent;color:var(--ink-faint);
    border:1px solid transparent;border-radius:50%;
    cursor:pointer;transition:background .12s ease,color .12s ease;
  }
  .rs-tts-btn:hover{background:var(--ember-glow);color:var(--ember-bright);}
  .rs-tts-btn svg{width:12px;height:12px;display:block;}
  .rs-tts-btn.speaking{background:var(--ember-glow);color:var(--ember-bright);border-color:var(--line);}
  .rs-tts-btn.speaking .tts-wave-1{animation:rsTtsPulse 1s ease-in-out infinite;}
  .rs-tts-btn.speaking .tts-wave-2{animation:rsTtsPulse 1s ease-in-out infinite .18s;}
  @keyframes rsTtsPulse{0%,100%{opacity:.3;}50%{opacity:1;}}
  @media(prefers-reduced-motion:reduce){
    .rs-tts-btn.speaking .tts-wave-1,.rs-tts-btn.speaking .tts-wave-2{animation:none;opacity:1;}
  }

  .rs-msg .bubble{padding:11px 14px;border-radius:12px;font-size:14px;line-height:1.55;white-space:pre-wrap;}
  .rs-msg.assistant .bubble{background:var(--ember-glow);border:1px solid var(--line);border-top-left-radius:4px;}
  .rs-msg.user .bubble{background:var(--ember);color:#fff;border-top-right-radius:4px;}
  .rs-msg.system .bubble{background:transparent;border:1px dashed var(--line);color:var(--ink-dim);font-style:italic;font-size:12.5px;border-radius:8px;}
  .rs-typing::after{content:'';animation:rsDots 1.2s steps(4,end) infinite;}
  @keyframes rsDots{0%{content:'';}25%{content:'.';}50%{content:'..';}75%{content:'...';}}
  .rs-composer{display:flex;gap:8px;align-items:flex-end;}
  .rs-composer textarea{min-height:56px;flex:1;}
  .rs-contribute-card{
    margin-top:16px;border:1px dashed var(--line);background:var(--ember-glow);border-radius:12px;padding:18px 20px;text-align:center;
  }
  .rs-contribute-card h3{margin:0 0 6px;font-size:13.5px;font-weight:700;color:var(--ink);}
  .rs-contribute-card p{margin:0 0 12px;font-size:12.5px;color:var(--ink-dim);line-height:1.6;max-width:560px;margin-left:auto;margin-right:auto;}
  .rs-contribute-status{font-size:12px;font-weight:600;margin-top:10px;min-height:16px;}
  .rs-contribute-status.ok{color:var(--ember-bright);}
  .rs-contribute-status.err{color:var(--alert);}
  .rs-setup-nudge{
    max-width:640px;text-align:center;padding:40px 28px;background:var(--panel);
    border:1px dashed var(--line);border-radius:14px;color:var(--ink-dim);
  }
  .rs-setup-nudge h3{margin:0 0 8px;color:var(--ink);}
  .rs-setup-nudge button{margin-top:14px;}

  /* mobile toggle */
  .menu-toggle{
    display:none;position:fixed;top:14px;left:14px;z-index:50;
    background:var(--panel);border:1px solid var(--line);border-radius:8px;
    width:38px;height:38px;align-items:center;justify-content:center;box-shadow:var(--shadow-sm);cursor:pointer;
  }
  .menu-toggle span, .menu-toggle span::before, .menu-toggle span::after{
    content:'';display:block;width:16px;height:2px;background:var(--ink);position:relative;
  }
  .menu-toggle span::before{position:absolute;top:-5px;}
  .menu-toggle span::after{position:absolute;top:5px;}

  /* ---------- Main ---------- */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{
    padding:20px 32px;border-bottom:1px solid var(--line);background:var(--panel);
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  }
  .topbar .tool-title{font-size:20px;font-weight:800;letter-spacing:-0.01em;}
  .topbar .tool-desc{color:var(--ink-dim);font-size:13.5px;}
  .topbar .meta{margin-left:auto;display:flex;gap:8px;}
  .topbar-auth{flex:none;display:flex;align-items:center;}
  .topbar-auth .auth-signed-in{padding:6px 8px;}
  .hub-timer{
    flex:none;display:flex;align-items:center;gap:8px;
    background:var(--panel-sunken);border:1px solid var(--line);border-radius:999px;
    padding:6px 8px 6px 12px;font-family:var(--mono);font-size:12.5px;color:var(--ink);
    user-select:none;
  }
  .hub-timer-dot{width:7px;height:7px;border-radius:50%;background:var(--ink-faint);flex:none;}
  .hub-timer-dot.running{background:var(--ember);animation:hubTimerPulse 1.6s ease-in-out infinite;}
  @keyframes hubTimerPulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  .hub-timer-display{min-width:44px;text-align:center;letter-spacing:.02em;cursor:pointer;}
  .hub-timer-toggle{
    flex:none;width:24px;height:24px;padding:0;border-radius:50%;border:1px solid var(--line);
    background:var(--panel);color:var(--ink-dim);font-size:11px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:background .12s,color .12s;
  }
  .hub-timer-toggle:hover{background:var(--ember);color:#fff;border-color:var(--ember);}
  @media(max-width:640px){.hub-timer{padding:5px 6px 5px 10px;font-size:11.5px;} .hub-timer-toggle{width:20px;height:20px;}}

  .hub-mic-wrap{position:relative;display:block;width:100%;}
  .hub-mic-btn{
    position:absolute;right:8px;bottom:8px;z-index:5;
    width:28px;height:28px;min-width:28px;min-height:28px;border-radius:50%;
    border:1px solid var(--line);background:var(--panel);color:var(--ink-dim);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    opacity:.85;transition:opacity .12s,background .12s,color .12s,border-color .12s,box-shadow .12s;
  }
  .hub-mic-btn:hover{opacity:1;border-color:var(--ember);color:var(--ember-bright);}
  .hub-mic-btn .hub-mic-icon{display:block;width:15px;height:15px;flex:none;pointer-events:none;}
  .hub-mic-btn.listening .hub-mic-icon{color:#fff;}
  .hub-mic-btn.listening{
    opacity:1;background:#DC2626;border-color:#DC2626;color:#fff;
    box-shadow:0 0 0 4px rgba(220,38,38,0.16);
    animation:hubMicPulse 1.4s ease-in-out infinite;
  }
  @keyframes hubMicPulse{0%,100%{box-shadow:0 0 0 4px rgba(220,38,38,0.16);}50%{box-shadow:0 0 0 9px rgba(220,38,38,0.05);}}
  .pill{
    font-family:var(--mono);font-size:11px;font-weight:600;color:var(--ink-dim);
    background:var(--panel-sunken);border:1px solid var(--line);border-radius:20px;padding:4px 11px;
  }

  .content{flex:1;padding:28px 32px 60px;}

  /* empty-slot placeholder card (used for tools not yet added) */
  .empty-tool{
    max-width:640px;margin:40px auto 0;text-align:center;padding:44px 28px;
    background:var(--panel);border:1px dashed var(--line);border-radius:14px;color:var(--ink-dim);
  }
  .empty-tool .icon{
    width:44px;height:44px;border-radius:50%;background:var(--panel-sunken);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:18px;color:var(--ember-bright);
  }
  .empty-tool h3{margin:0 0 8px;color:var(--ink);font-size:16px;}
  .empty-tool p{margin:0;font-size:13.5px;}
  .empty-tool code{
    background:var(--panel-sunken);border:1px solid var(--line);border-radius:6px;
    padding:1px 6px;font-family:var(--mono);font-size:12px;color:var(--bronze-bright);
  }

  /* home/landing panel */
  .home-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:8px;}
  .home-card{
    display:block;width:100%;text-align:left;font:inherit;color:inherit;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;
    cursor:pointer;transition:box-shadow .15s,transform .15s;
  }
  .home-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);}
  .home-card:focus-visible{outline:2px solid var(--ember);outline-offset:2px;}
  .home-card .num{
    font-family:var(--mono);font-size:11px;color:var(--ink-faint);margin-bottom:8px;
  }
  .home-card .title{font-weight:700;font-size:14.5px;margin-bottom:5px;}
  .home-card .desc{font-size:12.5px;color:var(--ink-dim);}
  .home-card .status{
    display:inline-block;margin-top:10px;font-family:var(--mono);font-size:10px;
    padding:2px 8px;border-radius:20px;font-weight:600;
  }
  .home-card .status.ready{background:rgba(8,145,178,.12);color:var(--ember-bright);}
  .home-card .status.pending{background:var(--panel-sunken);color:var(--ink-faint);border:1px solid var(--line);}

  .intro{max-width:70ch;}
  .intro h2{font-size:22px;margin:0 0 8px;}
  .intro p{color:var(--ink-dim);font-size:14px;}

  .home-disclosure{
    margin-top:18px;border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden;
  }
  .home-disclosure summary{
    list-style:none;cursor:pointer;user-select:none;padding:14px 18px;
    display:flex;align-items:center;gap:8px;
    font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    color:var(--bronze-bright);transition:background .12s;
  }
  .home-disclosure summary::-webkit-details-marker{display:none;}
  .home-disclosure summary::before{content:'▸';font-size:10px;}
  .home-disclosure[open] summary::before{content:'▾';}
  .home-disclosure summary:hover{background:var(--panel-sunken);}
  .home-disclosure summary:focus-visible{outline:2px solid var(--ember);outline-offset:-2px;}
  .home-disclosure[open] summary{border-bottom:1px solid var(--line);}
  .home-disclosure .home-disclaimer{
    margin:16px 16px 0;padding:14px 16px;background:var(--panel-sunken);border:none;
    border-left:3px solid var(--bronze-bright);border-radius:0 8px 8px 0;
  }
  .home-disclosure .home-disclaimer:last-child{margin-bottom:16px;}
  .home-disclaimer .hd-title{
    font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    color:var(--bronze-bright);margin-bottom:8px;
  }
  .home-disclaimer ul{margin:0;padding-left:18px;}
  .home-disclaimer li{font-size:13px;line-height:1.55;color:var(--ink-dim);margin-bottom:5px;}
  .home-disclaimer li:last-child{margin-bottom:0;}
  .home-disclaimer li strong{color:var(--ink);}

  /* tool body container — where each tool's own markup/iframe/script mounts */
  .tool-body{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px;box-shadow:var(--shadow-sm);}
  .tool-body iframe{width:100%;border:0;min-height:70vh;border-radius:8px;}

  @media (max-width:860px){
    body{overflow-x:hidden;}
    .menu-toggle{display:flex;}
    .sidebar{
      position:fixed;left:0;top:0;height:100vh;width:min(var(--sidebar-w),84vw);min-width:0;z-index:40;transform:translateX(-100%);
      transition:transform .2s ease;box-shadow:var(--shadow-lg);
    }
    .sidebar.open{transform:translateX(0);}
    .topbar{padding:16px 20px 16px 60px;flex-wrap:wrap;row-gap:8px;}
    .topbar .meta{margin-left:0;}
    .content{padding:18px 16px 50px;}
    .home-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
    .nav-item{padding:11px 10px;min-height:40px;}
  }
  @media (max-width:520px){
    body{font-size:14px;}
    .content{padding:14px 12px 44px;}
    .home-grid{grid-template-columns:1fr 1fr;gap:8px;}
    .topbar .tool-title{font-size:17px;}
    .brand h1{font-size:16px;}
    .auth-row,.theme-row,.nav-search{padding-left:12px;padding-right:12px;}
    .sidebar-links a,.nav-item,.theme-select,.auth-signout{min-height:38px;}
    .acc-viewer-actions{gap:6px;}
    .acc-viewer-actions .acc-btn{flex:1 1 calc(50% - 6px);padding:7px 8px;font-size:11.5px;text-align:center;}
  }
  @media (max-width:360px){
    .home-grid{grid-template-columns:1fr;}
  }

  /* ============ Case Practice module (scoped .cp-tool) ============ */
.cp-tool .vr-suitebar{
    background: var(--panel-sunken);
    border-bottom: 1px solid var(--line);
    padding: 12px 20px;
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 10px 16px;
  }
.cp-tool .vr-suitebar .vr-brand{
    font-family: var(--mono);
    font-weight: 700; font-size: 14px; letter-spacing: -0.01em;
    color: var(--ink); text-decoration: none; display:flex; align-items:center; gap:0;
  }
.cp-tool .vr-suitebar .vr-brand span{ color: var(--ember-bright); }
.cp-tool .vr-suitebar .vr-nav{ display:flex; gap:6px; flex-wrap:wrap; }
.cp-tool .vr-suitebar .vr-nav a{
    font-family:var(--mono); font-size:11px; letter-spacing:.04em; text-transform:uppercase;
    color:var(--ink-dim); text-decoration:none; padding:6px 10px; border-radius:999px;
    border:1px solid var(--line); background:var(--panel); transition:.15s ease;
  }
.cp-tool .vr-suitebar .vr-nav a:hover{ color:#fff; background:var(--ember); border-color:var(--ember); }
.cp-tool .vr-suitebar .vr-nav a.active{ color:#fff; background:var(--ember-dim); border-color:var(--ember-dim); }
.cp-tool .wrap{max-width:1180px;margin:0 auto;padding:34px 20px 90px;}
.cp-tool .kicker{
    font-family:'DM Mono','IBM Plex Mono',monospace;color:var(--bronze-bright);
    letter-spacing:.14em;text-transform:uppercase;font-size:11.5px;margin-bottom:14px;font-weight:600;
    display:flex;align-items:center;gap:9px;flex-wrap:wrap;
  }
.cp-tool .kicker .gr{color:var(--ember-bright);letter-spacing:.04em;font-family:var(--display);text-transform:none;}
.cp-tool .kicker .sep{color:var(--line);}
.cp-tool h1{font-family:var(--display);font-weight:700;font-size:clamp(28px, 4.5vw, 40px);margin:0 0 12px;color:var(--ink);letter-spacing:-0.01em;line-height:1.16;}
.cp-tool h1 em{font-style:normal;color:var(--ember-bright);}
.cp-tool .subhead{color:var(--ink-dim);font-size:15px;max-width:70ch;}
.cp-tool .disclaimer{
    margin-top:20px;font-size:13.5px;color:var(--ink-dim);
    padding:12px 16px;background:var(--panel);border-radius:0 10px 10px 0;
    border:1px solid var(--line);border-left:3px solid var(--bronze-bright);
  }
.cp-tool .disclaimer strong{color:var(--ink);}
.cp-tool .ornament{
    display:flex;align-items:center;gap:12px;margin:22px 0 26px;color:var(--bronze);font-size:13px;user-select:none;
  }
.cp-tool .ornament::before, .cp-tool .ornament::after{content:'';flex:1;height:1px;background:linear-gradient(90deg, transparent, var(--line-soft));}
.cp-tool .ornament::after{background:linear-gradient(90deg, var(--line-soft), transparent);}
.cp-tool .section-title{
    font-family:var(--display);font-size:13px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--bronze-bright);font-weight:700;margin:32px 0 14px;display:flex;align-items:center;gap:10px;
  }
.cp-tool .section-title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg, var(--line-soft), transparent);}
.cp-tool .step{margin-bottom:26px;}
.cp-tool .step-label{
    font-family:var(--display);font-size:13px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--bronze-bright);font-weight:700;margin:32px 0 14px;display:flex;align-items:center;gap:10px;
  }
.cp-tool .step-label .num{
    width:20px;height:20px;border-radius:50%;background:var(--ember);color:#fff;
    display:inline-flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;font-weight:700;
  }
.cp-tool .step-label::after{content:'';flex:1;height:1px;background:linear-gradient(90deg, var(--line-soft), transparent);}
.cp-tool .tabrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.cp-tool .tab{
    font-family:var(--display);font-size:13px;font-weight:600;color:var(--ink-dim);
    background:var(--panel-sunken);border:1px solid var(--line);border-radius:9px;
    padding:8px 14px;cursor:pointer;transition:.12s;
  }
.cp-tool .tab:hover{color:var(--ink);border-color:var(--bronze-bright);}
.cp-tool .tab.active{color:#fff;background:var(--ember);border-color:var(--ember);}
.cp-tool .cfg-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px;}
@media (max-width:600px){
.cp-tool .cfg-row{grid-template-columns:1fr;}
}
.cp-tool .cfg-row label, .cp-tool .field label{
    font-size:12.5px;color:var(--ink-dim);display:block;margin-bottom:4px;font-weight:500;
  }
.cp-tool .cfg-row input, .cp-tool .cfg-row select, .cp-tool .field input, .cp-tool .field select{
    width:100%;font-family:var(--display);font-size:13.5px;border:1px solid var(--line);
    border-radius:9px;padding:9px 11px;color:var(--ink);background:var(--panel-sunken);
  }
.cp-tool .cfg-row input:focus, .cp-tool .cfg-row select:focus, .cp-tool .field input:focus{outline:2px solid var(--ember-glow);border-color:var(--ember);}
.cp-tool .key-status{font-size:12px;color:var(--ink-dim);margin-top:6px;}
.cp-tool .key-status.saved{color:var(--good);}
.cp-tool details.settings{margin-top:10px;}
.cp-tool details.settings summary{font-size:12.5px;color:var(--bronze-bright);cursor:pointer;font-weight:600;}
.cp-tool .field{margin-bottom:12px;}
.cp-tool .gen-status{font-size:13px;color:var(--ink-dim);margin-top:10px;min-height:18px;}
.cp-tool .gen-status.error{color:var(--alert);}
.cp-tool .gen-status.busy{color:var(--ember-bright);}
.cp-tool .term-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:18px;margin-top:20px;align-items:start;}
@media (max-width:900px){
.cp-tool .term-grid{grid-template-columns:1fr;}
}
.cp-tool .panel{
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    box-shadow:var(--shadow-sm);padding:20px 22px;
  }
.cp-tool .panel h2{font-size:14px;margin:0 0 14px;color:var(--ink);font-weight:700;display:flex;align-items:center;gap:8px;}
.cp-tool .panel h2 .dot{width:7px;height:7px;border-radius:50%;background:var(--ember);display:inline-block;}
.cp-tool .panel h2.collapsible-h2{cursor:pointer;user-select:none;}
.cp-tool .panel h2.collapsible-h2:hover{color:var(--bronze-bright);}
.cp-tool .collapse-arrow{font-size:11px;margin-left:auto;color:var(--ink-faint);transition:transform .15s ease;}
.cp-tool .collapse-arrow.open{transform:rotate(180deg);}
.cp-tool .term-screen{
    background:var(--panel-sunken);border:1px solid var(--line);border-radius:10px;
    padding:16px 18px;font-family:var(--mono);font-size:13px;color:var(--ink);
    max-height:440px;overflow-y:auto;
  }
.cp-tool .term-line{margin-bottom:14px;}
.cp-tool .term-line .prompt{color:var(--bronze-bright);font-weight:700;}
.cp-tool .term-line .stage-label{color:var(--ember-bright);font-weight:700;text-transform:uppercase;font-size:11px;letter-spacing:.06em;}
.cp-tool .term-line .body-text{color:var(--ink);white-space:pre-wrap;}
.cp-tool .term-line.user{color:var(--ink-dim);}
.cp-tool .term-line.user .arrow{color:var(--ink-faint);}
.cp-tool .term-cursor{display:inline-block;width:7px;height:14px;background:var(--ember);vertical-align:middle;animation:cp-blink 1s step-start infinite;}
@keyframes cp-cp-blink{
50%{opacity:0;}
}
.cp-tool .stage-progress{display:flex;gap:5px;margin-bottom:14px;flex-wrap:wrap;}
.cp-tool .stage-dot{
    font-family:var(--mono);font-size:10.5px;padding:4px 9px;border-radius:20px;
    border:1px solid var(--line);color:var(--ink-faint);background:var(--panel);
  }
.cp-tool .stage-dot.done{color:var(--good);border-color:var(--good);background:var(--good-soft);}
.cp-tool .stage-dot.current{color:#fff;background:var(--ember);border-color:var(--ember);}
.cp-tool .actions-row{display:flex;gap:9px;margin-top:14px;flex-wrap:wrap;}
.cp-tool .btn{
    font-family:var(--display);font-weight:700;font-size:13px;border-radius:9px;
    padding:10px 16px;cursor:pointer;border:1px solid var(--line);background:var(--panel);
    color:var(--ink);transition:.12s;
  }
.cp-tool .btn:hover{border-color:var(--bronze-bright);color:var(--bronze-bright);}
.cp-tool .btn.primary{background:var(--ember);border-color:var(--ember);color:#fff;}
.cp-tool .btn.primary:hover{background:var(--ember-dim);border-color:var(--ember-dim);color:#fff;}
.cp-tool .btn.alert{color:var(--alert);}
.cp-tool .btn.alert:hover{border-color:var(--alert);}
.cp-tool .btn:disabled{opacity:.4;cursor:not-allowed;}
.cp-tool textarea.reasoning-box{
    width:100%;min-height:70px;resize:vertical;font-family:var(--display);font-size:13.5px;
    border:1px solid var(--line);border-radius:9px;padding:10px 12px;color:var(--ink);
    background:var(--panel-sunken);margin-top:10px;
  }
.cp-tool textarea.reasoning-box:focus{outline:2px solid var(--ember-glow);border-color:var(--ember);}

<script>
/* ============================================================
   TOOL REGISTRY
   Add new tools here one at a time. Each entry:
   {
     id: 'unique-slug',
     group: 'Category name for sidebar grouping',
     title: 'Display name',
     desc: 'One-line description shown in topbar/home card',
     status: 'ready' | 'pending',   // pending = placeholder shown
     render: (container) => { ... }  // fills container with the tool's UI
   }
   For an iframe-embedded external tool, render can just set:
     container.innerHTML = `<div class="tool-body"><iframe src="URL"></iframe></div>`;
   For a fully custom tool, build DOM / attach listeners inside render().
   ============================================================ */
const IFRAME_TOOL = (url) => (container) => {
  container.innerHTML = `<div class="tool-body"><iframe src="${url}" loading="lazy"></iframe></div>`;
};

const TOOLS = [
  { id:'case-bench', group:'Reasoning Tools', title:'Case Bench', desc:'Case-based Socratic learning, MCQs, and clinical reasoning analytics.', status:'ready', render: (c) => renderCaseBench(c) },
  { id:'case-simulator', group:'Reasoning Tools', title:'Case Simulator', desc:'An interactive tool for running through simulated patient cases.', status:'ready', render: (c) => renderCaseSimulator(c) },
  { id:'clinical-practice', group:'Reasoning Tools', title:'Case Practice', desc:'A focused drill tool for practicing clinical cases.', status:'ready', render: (c) => renderCasePractice(c) },
  { id:'clinical-polemos', group:'Reasoning Tools', title:'Clinical Polemos', desc:'A debate-style exercise for discussion and reasoning.', status:'ready', render: (c) => renderClinicalPolemos(c) },
  { id:'case-lens', group:'Reasoning Tools', title:'Case Lens', desc:'Critical thinking around clinical cases from multiple analytical angles.', status:'ready', render: (c) => renderCaseLens(c) },
  { id:'sdm-lens', group:'Reasoning Tools', title:'SDM Lens', desc:'A tool focused on shared decision-making scenarios.', status:'ready', render: (c) => renderSdmLens(c) },
  { id:'ebm-query', group:'Reasoning Tools', title:'EBM Query Generator', desc:'Generate a structured set of critical-appraisal queries.', status:'ready', render: (c) => renderEbmQuery(c) },
  { id:'ccos-builder', group:'Reasoning Tools', title:'CCOS Builder', desc:'Build and order modules for the Clinical Cognition OS.', status:'ready', render: (c) => renderCcosBuilder(c) },
  { id:'accessories', group:'Accessories', title:'Accessories', desc:'Vibe Rounds - Guided Discovery', status:'ready', render: (c) => renderAccessories(c) },
  { id:'history', group:'History', title:'History', desc:'A record of your past activity across the hub.', status:'ready', render: (c) => renderHistory(c) },
  { id:'paradigm', group:'Vibe Rounds Paradigm', title:'Vibe Rounds Paradigm', desc:'The philosophy and approach behind Vibe Rounds.', status:'ready', external: 'https://avi33tbtt.github.io/home.html' },
];

/* ---------- Vibe Rounds branding ---------- */
const VR_BRAND_LINE = 'Vibe Rounds - https://avi33tbtt.github.io/';

/* Adds the brand line to the TOP of a downloaded .txt file's content.
   Used by every tool's "Download .txt" action. */
window.vrBrandText = function(text){
  const t = text || '';
  if(t.indexOf(VR_BRAND_LINE) === 0) return t; // already branded, don't double it
  return `${VR_BRAND_LINE}\n${'='.repeat(VR_BRAND_LINE.length)}\n\n${t}`;
};

/* Adds the brand line to the BOTTOM of text saved into History. */
function vrBrandTextBottom(text){
  const t = text || '';
  if(t.trim().endsWith(VR_BRAND_LINE)) return t; // already branded, don't double it
  return `${t}\n\n${'-'.repeat(VR_BRAND_LINE.length)}\n${VR_BRAND_LINE}\n`;
}

function saveToHistory(toolTitle, text){
  try{
    const key = 'vibehub_history_items';
    const items = JSON.parse(localStorage.getItem(key) || '[]');
    items.unshift({
      id: Date.now() + '-' + Math.random().toString(36).slice(2,8),
      tool: toolTitle,
      text: vrBrandTextBottom(text),
      starred: false,
      ts: new Date().toISOString()
    });
    localStorage.setItem(key, JSON.stringify(items.slice(0, 300)));
    if(typeof hubSyncHistoryToDrive === 'function') hubSyncHistoryToDrive();
    return true;
  }catch(e){ return false; }
}

function saveToHistoryFlash(btn, toolTitle, text){
  if(typeof hubIsSignedIn === 'function' && !hubIsSignedIn()){
    hubOpenAuthModal(() => saveToHistoryFlash(btn, toolTitle, text));
    return;
  }
  const ok = saveToHistory(toolTitle, text);
  const old = btn.textContent;
  btn.textContent = ok ? 'Saved ✓' : 'Save failed';
  setTimeout(() => { btn.textContent = old; }, 1400);
}

let currentId = null;

function renderNav(filter=''){
  const nav = document.getElementById('toolNav');
  nav.innerHTML = '';

  // Home item
  const homeBtn = document.createElement('button');
  homeBtn.className = 'nav-item' + (currentId===null ? ' active' : '');
  homeBtn.innerHTML = `<span class="dot"></span><span class="label">Home</span>`;
  homeBtn.onclick = () => openTool(null);
  nav.appendChild(homeBtn);

  // Setup item
  const setupBtn = document.createElement('button');
  setupBtn.className = 'nav-item' + (currentId==='setup' ? ' active' : '');
  setupBtn.innerHTML = `<span class="dot"></span><span class="label">Setup</span>` +
    (isSetupDone() ? `<span class="badge">done</span>` : '');
  setupBtn.onclick = () => openTool('setup');
  nav.appendChild(setupBtn);

  const groups = {};
  TOOLS.forEach(t => {
    if(filter && !t.title.toLowerCase().includes(filter.toLowerCase())) return;
    (groups[t.group] = groups[t.group] || []).push(t);
  });

  Object.entries(groups).forEach(([groupName, items]) => {
    const gTitle = document.createElement('div');
    gTitle.className = 'nav-group-title';
    gTitle.textContent = groupName;
    nav.appendChild(gTitle);
    items.forEach(t => {
      if(t.external){
        const link = document.createElement('a');
        link.className = 'nav-item';
        link.href = t.external;
        link.target = '_blank';
        link.rel = 'noopener';
        link.innerHTML = `<span class="dot"></span><span class="label">${t.title}</span>` +
          (t.status==='pending' ? `<span class="badge">soon</span>` : '');
        nav.appendChild(link);
        return;
      }
      const btn = document.createElement('button');
      btn.className = 'nav-item' + (currentId===t.id ? ' active' : '');
      btn.innerHTML = `<span class="dot"></span><span class="label">${t.title}</span>` +
        (t.status==='pending' ? `<span class="badge">soon</span>` : '');
      btn.onclick = () => openTool(t.id);
      nav.appendChild(btn);
    });
  });
}

function renderHome(){
  document.getElementById('topTitle').textContent = 'Home';

  document.getElementById('topMeta').innerHTML = `<span class="pill">${TOOLS.length} tools</span>`;

  const content = document.getElementById('content');
  const homeTools = TOOLS.filter(t => t.group === 'Reasoning Tools' || t.group === 'Reference');
  const cards = homeTools.map((t,i) => `
    <button type="button" class="home-card" onclick="openTool('${t.id}')">
      <div class="num">${String(i+1).padStart(2,'0')}</div>
      <div class="title">${t.title}</div>
      <div class="desc">${t.desc}</div>
      <div class="status ${t.status}">${t.status === 'ready' ? 'ready' : 'coming soon'}</div>
    </button>`).join('');

  content.innerHTML = `
    <div class="intro">
      <h2>Welcome back.</h2>
      <p>This hub will hold every Vibe Rounds tool in one place. Pick a tool from the sidebar, or send me the next tool to wire in and I'll add it here.</p>
    </div>
    <details class="home-disclosure">
      <summary>Before you start — read once</summary>
      <div class="home-disclaimer">
        <div class="hd-title">Before you start</div>
        <ul>
          <li><strong>Educational use only.</strong> Every tool here is for learning and reasoning practice, not clinical decision-making or real patient care.</li>
          <li><strong>Server-less.</strong> This hub runs entirely in your browser — there is no backend server of ours in the middle.</li>
          <li><strong>Your data stays between you and your LLM.</strong> Case text and prompts go straight from your browser to the AI provider using your own API key — nothing is sent to or stored by us.</li>
          <li><strong>Your Google Drive is your storage.</strong> Signing in lets you save and revisit records in your own Drive — we don't hold a copy anywhere.</li>
          <li><strong>Use openly published, de-identified cases.</strong> Avoid entering real patient identifiers — published case reports and vignettes sidestep consent and privacy issues.</li>
          <li><strong>AI output can be wrong.</strong> Bias, hallucination, and quality all vary by model and case — verify anything before relying on it.</li>
          <li><strong>No login needed to use the tools.</strong> Sign in only if you want to save results and come back to them later.</li>
        </ul>
      </div>
      <div class="home-disclaimer">
        <div class="hd-title">State passing between tools</div>
        <ul>
          <li>The tools here don't share state directly with each other. To carry a case or a result from one tool into another, <strong>download it as a .txt file</strong> from the tool you're finishing (or save it to History), then <strong>upload or paste it into the next tool</strong> to continue the analysis there.</li>
        </ul>
      </div>
      <div class="home-disclaimer">
        <div class="hd-title">Prompt transparency (the "why")</div>
        <ul>
          <li>Every tool here is built on openly published prompts and modules — nothing is a black box. If you want to see exactly why a tool asks what it asks, three links go progressively deeper:</li>
          <li><strong><a href="https://avi33tbtt.github.io/home.html" target="_blank" rel="noopener">Vibe Rounds Paradigm</a></strong> — the philosophy and reasoning behind the approach.</li>
          <li><strong><a href="https://avi33tbtt.github.io/" target="_blank" rel="noopener">Project website</a></strong> — the full module directory, pipelines, and how the tools fit together.</li>
          <li><strong><a href="https://github.com/avi33tbtt" target="_blank" rel="noopener">GitHub</a></strong> — the underlying source, for the deepest, most in-depth look.</li>
        </ul>
      </div>
    </details>
    <div class="home-grid">${cards}</div>
  `;
}

function renderEmptySlot(tool){
  const content = document.getElementById('content');
  content.innerHTML = `
    <div class="empty-tool">
      <div class="icon">＋</div>
      <h3>${tool.title} isn't wired in yet</h3>
      <p>Send me this tool's content, link, or spec and I'll build it into <code>${tool.id}</code> right here in the hub.</p>
    </div>`;
}

/* ============================================================
   MICROPHONE INPUT — attaches a dictation button to every textarea
   across the hub, using the browser's built-in speech recognition.
   Degrades silently (no button) on browsers without support.
   ============================================================ */
const HUB_MIC_ICON = `<svg class="hub-mic-icon" viewBox="0 0 24 24" width="15" height="15" fill="currentColor" stroke="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 15a3.5 3.5 0 0 0 3.5-3.5v-6a3.5 3.5 0 0 0-7 0v6A3.5 3.5 0 0 0 12 15z"/><path d="M18.5 11.5a.75.75 0 0 0-1.5 0 5 5 0 0 1-10 0 .75.75 0 0 0-1.5 0 6.5 6.5 0 0 0 5.75 6.46V20h-2a.75.75 0 0 0 0 1.5h5.5a.75.75 0 0 0 0-1.5h-2v-2.04a6.5 6.5 0 0 0 5.75-6.46z"/></svg>`;

function hubEnableMicButtons(root){
  if(!root) return;
  const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  const textareas = root.querySelectorAll('textarea:not([data-mic-attached])');
  textareas.forEach(ta => {
    ta.setAttribute('data-mic-attached', '1');
    if(!Recognition) return; // no speech recognition support in this browser — skip quietly

    let wrap = ta.parentElement;
    if(!wrap || !wrap.classList.contains('hub-mic-wrap')){
      wrap = document.createElement('div');
      wrap.className = 'hub-mic-wrap';
      ta.parentNode.insertBefore(wrap, ta);
      wrap.appendChild(ta);
    }

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'hub-mic-btn';
    btn.title = 'Dictate with microphone';
    btn.setAttribute('aria-label', 'Dictate with microphone');
    btn.innerHTML = HUB_MIC_ICON;
    wrap.appendChild(btn);

    let recognition = null;
    let listening = false;
    let baseValue = '';

    function stopListening(){
      listening = false;
      btn.classList.remove('listening');
      if(recognition){ try{ recognition.stop(); }catch(e){} }
    }

    btn.addEventListener('click', () => {
      if(listening){ stopListening(); return; }

      recognition = new Recognition();
      recognition.lang = navigator.language || 'en-US';
      recognition.continuous = true;
      recognition.interimResults = true;

      baseValue = ta.value ? ta.value.replace(/\s+$/, '') + ' ' : '';
      listening = true;
      btn.classList.add('listening');
      btn.title = 'Listening… click to stop';

      recognition.onresult = (e) => {
        let finalText = '', interimText = '';
        for(let i = e.resultIndex; i < e.results.length; i++){
          const t = e.results[i][0].transcript;
          if(e.results[i].isFinal) finalText += t + ' ';
          else interimText += t;
        }
        if(finalText) baseValue += finalText;
        ta.value = (baseValue + interimText).trim();
        ta.dispatchEvent(new Event('input', { bubbles: true }));
      };
      recognition.onerror = () => { stopListening(); btn.title = 'Dictate with microphone'; };
      recognition.onend = () => {
        if(listening){
          try{ recognition.start(); } // keep listening through brief silence gaps
          catch(e){ stopListening(); btn.title = 'Dictate with microphone'; }
        } else {
          btn.title = 'Dictate with microphone';
        }
      };

      try{ recognition.start(); }
      catch(e){ listening = false; btn.classList.remove('listening'); }
    });
  });
}

function openTool(id){
  currentId = id;
  if(window.innerWidth <= 860) document.getElementById('sidebar').classList.remove('open');

  if(id === null){ renderNav(document.getElementById('navSearch').value); renderHome(); return; }

  if(id === 'setup'){
    renderNav(document.getElementById('navSearch').value);
    document.getElementById('topTitle').textContent = 'Setup';
    document.getElementById('topDesc').textContent = 'Add your API key once — used to generate content across the hub.';
    document.getElementById('topMeta').innerHTML = `<span class="pill">${isSetupDone() ? 'done' : 'not configured'}</span>`;
    renderSetup(document.getElementById('content'));
    hubEnableMicButtons(document.getElementById('content'));
    return;
  }

  const tool = TOOLS.find(t => t.id === id);
  if(!tool) return;
  if(tool.external){ window.open(tool.external, '_blank', 'noopener'); return; }

  if(id === 'history') hubHistoryVisibleCount = HUB_HISTORY_PAGE_SIZE;

  renderNav(document.getElementById('navSearch').value);
  document.getElementById('topTitle').textContent = tool.title;
  document.getElementById('topDesc').textContent = tool.desc;
  document.getElementById('topMeta').innerHTML = `<span class="pill">${tool.status === 'ready' ? 'ready' : 'coming soon'}</span>`;

  const content = document.getElementById('content');
  if(tool.status === 'ready' && typeof tool.render === 'function'){
    content.innerHTML = '';
    tool.render(content);
    hubEnableMicButtons(content);
  } else {
    renderEmptySlot(tool);
  }
}

/* ============================================================
   SETUP (mirrors Case Bench Step 1: Model — bring-your-own-key)
   Once a key is saved, this page is marked "done" and stays out
   of the way; tool pages themselves are plain iframes, so this
   step is only needed once, here in the hub.
   ============================================================ */

  claude: { label:'Claude', keyPlaceholder:'sk-ant-...', modelPlaceholder:'claude-sonnet-4-6',
    help:'Create a key at <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">console.anthropic.com</a>. Paste the model name exactly as shown there.' },
  gemini: { label:'Gemini', keyPlaceholder:'AIza...', modelPlaceholder:'gemini-2.5-flash',
    help:'Create a key at <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener">aistudio.google.com/app/apikey</a>.' },
  openai: { label:'ChatGPT', keyPlaceholder:'sk-...', modelPlaceholder:'gpt-4o-mini',

function setupTtsChooser(){

    sel.innerHTML = '<option value="">Not supported in this browser</option>';

    status.className = 'setup-key-status empty';
    return;
  }
  function populate(){
    const voices = window.speechSynthesis.getVoices().filter(v => v.lang.toLowerCase().startsWith('en'));
    const list = voices.length ? voices : window.speechSynthesis.getVoices();
    if(!list.length) return;
    const pref = hubLoadTtsVoicePref();
    sel.innerHTML = list.map((v,i) => `<option value="${i}">${v.name} (${v.lang})</option>`).join('');
    if(pref){
      const idx = list.findIndex(v => v.name === pref.name && v.lang === pref.lang);
      if(idx >= 0) sel.value = idx;
    }
    updateTtsStatus(list);
    sel.dataset.list = 'ready';
    sel._voiceList = list;
  }
  function updateTtsStatus(list){
    const pref = hubLoadTtsVoicePref();
    if(pref){ status.textContent = 'Using ' + pref.name + ' (' + pref.lang + ') for read-aloud.'; status.className = 'setup-key-status ok'; }
    else{ status.textContent = 'Using this browser\'s default voice.'; status.className = 'setup-key-status empty'; }
  }
  populate();
  window.speechSynthesis.onvoiceschanged = populate;
  sel.addEventListener('change', () => {
    const list = sel._voiceList || [];
    const v = list[sel.value];
    if(v) hubSaveTtsVoicePref({ name: v.name, lang: v.lang });
    updateTtsStatus(list);

function rsCleanTextForSpeech(raw){
  const staged = raw.match(/^\[[^\]]+\]\n+([\s\S]*)$/);
  const body = staged ? staged[1] : raw;
  return body
    .replace(/```[\s\S]*?```/g, ' ')
    .replace(/`([^`]+)`/g, '$1')
    .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')
    .replace(/^#{1,6}\s+/gm, '')
    .replace(/\*\*([^*]+)\*\*/g, '$1')
    .replace(/__([^_]+)__/g, '$1')
    .replace(/\*([^*]+)\*/g, '$1')
    .replace(/^\s*[-*+]\s+/gm, '')
    .replace(/\n{2,}/g, '. ')
    .replace(/\s+/g, ' ')
    .trim();
}
function rsStopSpeaking(){
  if(!rsTtsSupported) return;
  window.speechSynthesis.cancel();
  if(rsTtsActiveBtn) rsSetBtnSpeaking(rsTtsActiveBtn, false);

function rsToggleSpeak(btn, rawText){
  const wasThisOne = (rsTtsActiveBtn === btn);
  rsStopSpeaking();

  const spoken = rsCleanTextForSpeech(rawText);
  if(!spoken) return;
  const utter = new SpeechSynthesisUtterance(spoken);

}

/* ---------- Google Drive sync for History ---------- */
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
const DRIVE_FILE_NAME = 'VibeRoundsHistory.json';
let driveAccessToken = null;
let driveTokenClient = null;
let driveFileId = null;

function hubDriveConnected(){
  try{ return localStorage.getItem('vibehub_drive_connected') === '1'; }catch(e){ return false; }
}

function hubInitDriveTokenClient(){
  if(driveTokenClient || !window.google || !google.accounts || !google.accounts.oauth2) return;
  driveTokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: DRIVE_SCOPE,
    callback: () => {}
  });
}

function hubRequestDriveAccess(interactive){
  return new Promise((resolve) => {
    hubInitDriveTokenClient();
    if(!driveTokenClient){ resolve(null); return; }
    driveTokenClient.callback = (resp) => {
      if(resp && resp.access_token){
        driveAccessToken = resp.access_token;
        try{ localStorage.setItem('vibehub_drive_connected', '1'); }catch(e){}
        resolve(driveAccessToken);
      } else { resolve(null); }
    };
    driveTokenClient.error_callback = () => resolve(null);
    try{ driveTokenClient.requestAccessToken({ prompt: interactive ? 'consent' : '' }); }
    catch(e){ resolve(null); }
  });
}

function hubDriveDisconnect(){
  driveAccessToken = null;
  driveFileId = null;
  try{
    localStorage.removeItem('vibehub_drive_connected');
    localStorage.removeItem('vibehub_drive_file_id');
  }catch(e){}
  if(window.google && google.accounts && google.accounts.oauth2 && driveAccessToken){
    google.accounts.oauth2.revoke(driveAccessToken, ()=>{});
  }
}

function hubDriveMultipartBody(meta, content){
  const boundary = 'vibehubboundary';
  return `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n${content}\r\n--${boundary}--`;
}

async function hubDriveGetFileId(){
  if(driveFileId) return driveFileId;
  try{ const cached = localStorage.getItem('vibehub_drive_file_id'); if(cached){ driveFileId = cached; return cached; } }catch(e){}
  if(!driveAccessToken) return null;
  try{
    const q = encodeURIComponent(`name='${DRIVE_FILE_NAME}' and trashed=false`);
    const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id,name)`, {
      headers:{ Authorization: 'Bearer ' + driveAccessToken }
    });
    if(!res.ok) return null;
    const data = await res.json();
    if(data.files && data.files.length){
      driveFileId = data.files[0].id;
    } else {
      const createRes = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
        method:'POST',
        headers:{ Authorization:'Bearer '+driveAccessToken, 'Content-Type':'multipart/related; boundary=vibehubboundary' },
        body: hubDriveMultipartBody({name: DRIVE_FILE_NAME, mimeType:'application/json'}, '[]')
      });
      if(!createRes.ok) return null;
      const created = await createRes.json();
      driveFileId = created.id;
    }
    try{ localStorage.setItem('vibehub_drive_file_id', driveFileId); }catch(e){}
    return driveFileId;
  }catch(e){ return null; }
}

async function hubDriveLoadItems(){
  if(!driveAccessToken) return null;
  try{
    const fileId = await hubDriveGetFileId();
    if(!fileId) return null;
    const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
      headers:{ Authorization:'Bearer '+driveAccessToken }
    });
    if(!res.ok) return null;
    return await res.json();
  }catch(e){ return null; }
}

async function hubDriveSaveItems(items){
  if(!driveAccessToken) return false;
  try{
    const fileId = await hubDriveGetFileId();
    if(!fileId) return false;
    const res = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
      method:'PATCH',
      headers:{ Authorization:'Bearer '+driveAccessToken, 'Content-Type':'application/json' },
      body: JSON.stringify(items)
    });
    return res.ok;
  }catch(e){ return false; }
}

function hubMergeHistoryItems(localItems, remoteItems){
  const map = new Map();
  (remoteItems||[]).forEach(it => it && it.id && map.set(it.id, it));
  (localItems||[]).forEach(it => it && it.id && map.set(it.id, it));
  return Array.from(map.values())
    .sort((a,b) => new Date(b.ts) - new Date(a.ts))
    .slice(0, 300);
}
