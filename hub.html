  /* Purely local, in-browser de-identification: no data leaves the device.
     Replaces WhatsApp-style "date, time - Speaker: message" speakers, and
     any phone numbers found anywhere in the text, with consistent
     "Participant N" labels (same speaker/number always maps to same label). */
  function accDeidentifyText(text){
    const speakerMap = new Map();
    let counter = 0;
    const getLabel = (key) => {
      const norm = key.trim();
      if(!speakerMap.has(norm)){
        counter++;
        speakerMap.set(norm, 'Participant ' + counter);
      }
      return speakerMap.get(norm);
    };

    // Matches WhatsApp export header: "DD/MM/YY, HH:MM[ am/pm] - Speaker: "
    const headerRe = /^(\d{1,2}\/\d{1,2}\/\d{2,4},\s*\d{1,2}:\d{2}(?:\s?[APap][Mm])?\s-\s)([^:\n]{1,60}?):\s/;

    const lines = text.split('\n');
    const outLines = lines.map(line => {
      const m = line.match(headerRe);
      if(!m) return line;
      const prefix = m[1];
      const speakerRaw = m[2];
      // Skip WhatsApp's own system-style entries (no real person to mask)
      if(/^(you|~)/i.test(speakerRaw.trim()) && !/^\+?\d/.test(speakerRaw.trim())) return line;
      const label = getLabel(speakerRaw);
      return prefix + label + ': ' + line.slice(m[0].length);
    });
    let result = outLines.join('\n');

    // Mask names in WhatsApp's own system/notification lines, which have no
    // ": " after the name so headerRe above never touches them — e.g.
    // "<date, time> - John Doe created group "PaJR Case 12"", "John added Mary",
    // "John removed Mary", "John left", "John changed the subject...",
    // "John changed this group's icon", "John changed the group description",
    // "John is now an admin", "John was made an admin by Mary". Whoever
    // created/administers the group gets masked here just like any speaker.
    const sysLineRe = /^(\d{1,2}\/\d{1,2}\/\d{2,4},\s*\d{1,2}:\d{2}(?:\s?[APap][Mm])?\s-\s)(.+)$/;
    const sysNamePatterns = [
      /^(.*?)\s+created group\b/i,
      /^(.*?)\s+added\s+(.+)$/i,
      /^(.*?)\s+removed\s+(.+)$/i,
      /^(.*?)\s+left$/i,
      /^(.*?)\s+changed the subject\b/i,
      /^(.*?)\s+changed this group'?s icon\b/i,
      /^(.*?)\s+changed the group description\b/i,
      /^(.*?)\s+changed their phone number\b/i,
      /^(.*?)\s+is now an admin\b/i,
      /^(.*?)\s+was made an admin\b/i,
      /^(.*?)\s+is no longer an admin\b/i,
      /^(.*?)\s+joined using this group'?s invite link\b/i
    ];
    const extractSysNames = (msg) => {
      const names = [];
      for(const re of sysNamePatterns){
        const mm = msg.match(re);
        if(mm){
          if(mm[1] && mm[1].trim()) names.push(mm[1].trim());
          if(mm[2] && mm[2].trim()){
            // "added X, Y and Z" / "was made an admin by X"
            mm[2].split(/,|\band\b/i).forEach(part => {
              const p = part.trim().replace(/^by\s+/i, '').replace(/\.$/, '');
              if(p) names.push(p);
            });
          }
          break;
        }
      }
      return names;
    };
    result = result.split('\n').map(line => {
      const m = line.match(sysLineRe);
      if(!m) return line;
      const rest = m[2];
      if(/^Participant \d+:\s/.test(rest)) return line; // already-masked chat line
      const names = extractSysNames(rest);
      if(!names.length) return line;
      let newRest = rest;
      names.forEach(name => {
        if(/^you$/i.test(name)) return; // "You" is already anonymous
        const label = getLabel(name);
        const esc = name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        newRest = newRest.replace(new RegExp('(^|\\W)' + esc + '(?=\\W|$)', 'g'), (mm2, pre) => pre + label);
      });
      return m[1] + newRest;
    }).join('\n');

    // Replace @-mentions of a phone number (e.g. "@+91 98765 43210") before the
    // general phone regex runs, so the "@" stays attached to the replacement label
    // instead of being left dangling in front of "[phone number removed]".
    const atPhoneRe = /@(\+?\d[\d\s-]{7,}\d)/g;
    let phoneCount = 0;
    result = result.replace(atPhoneRe, (match, num) => {
      const digits = num.replace(/\D/g, '');
      if(digits.length < 8) return match;
      for(const [origKey, label] of speakerMap.entries()){
        if(origKey.replace(/\D/g, '') === digits) { phoneCount++; return '@' + label; }
      }
      phoneCount++;
      return '@[phone number removed]';
    });

    // Replace any remaining phone numbers anywhere (headers already handled,
    // this also catches numbers mentioned inside message bodies).
    const phoneRe = /(\+?\d[\d\s-]{7,}\d)/g;
    result = result.replace(phoneRe, (match) => {
      const digits = match.replace(/\D/g, '');
      if(digits.length < 8) return match;
      // Map to an existing participant if this number was already a speaker
      for(const [origKey, label] of speakerMap.entries()){
        if(origKey.replace(/\D/g, '') === digits) { phoneCount++; return label; }
      }
      phoneCount++;
      return '[phone number removed]';
    });

    // Replace @mentions that use a known speaker's full display name, which
    // may contain spaces (e.g. "@Ravi Kumar") since WhatsApp mentions show the
    // saved contact name rather than a single-word handle. Must run before the
    // single-token handle regex below, otherwise only the first word gets
    // masked and the rest (e.g. "Kumar") is left in the clear.
    let mentionCount = 0;
    if(speakerMap.size){
      const namesByLength = [...speakerMap.keys()].sort((a, b) => b.length - a.length);
      for(const name of namesByLength){
        if(!name || /^\+?\d/.test(name)) continue; // phone-number keys handled above
        const label = speakerMap.get(name);
        const esc = name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        result = result.replace(new RegExp('@' + esc + '(?![A-Za-z0-9_])', 'gi'), () => { mentionCount++; return '@' + label; });
      }
    }

    // Replace @mentions using a multi-word display name that ISN'T an already-
    // known speaker (e.g. someone only ever @-mentioned, never a message
    // sender) — up to 3 capitalized words, e.g. "@Ravi Kumar Shah".
    const atFullNameRe = /@([A-Z][a-zA-Z'-]*(?:\s[A-Z][a-zA-Z'-]*){1,2})(?=[\s,.!?;:)]|$)/g;
    const fullNameMentionMap = new Map();
    result = result.replace(atFullNameRe, (match, name) => {
      const normName = name.toLowerCase();
      if(fullNameMentionMap.has(normName)){ mentionCount++; return '@' + fullNameMentionMap.get(normName); }
      counter++;
      const label = 'Participant ' + counter;
      fullNameMentionMap.set(normName, label);
      mentionCount++;
      return '@' + label;
    });

    // Replace @username-style mentions (e.g. "@johndoe", "@john_doe92") anywhere
    // in the text. Numbers have already been handled above, so this only matches
    // handles containing at least one letter. Mentions that match an already-known
    // speaker name are mapped to that same Participant label for consistency;
    // otherwise each distinct handle gets its own new Participant label.
    const atUserRe = /@(?!Participant\s+\d)([A-Za-z][A-Za-z0-9_.]{1,31})\b/g;
    let newMentionParticipants = 0;
    const mentionMap = new Map();
    result = result.replace(atUserRe, (match, handle) => {
      const normHandle = handle.toLowerCase();
      // Already mapped this exact handle before? Reuse its label.
      if(mentionMap.has(normHandle)){ mentionCount++; return '@' + mentionMap.get(normHandle); }
      // Does the handle match a known speaker name (e.g. "@John" matching speaker "John")?
      for(const [origKey, label] of speakerMap.entries()){
        if(origKey.toLowerCase().replace(/[^a-z0-9]/g, '') === normHandle.replace(/[^a-z0-9]/g, '')){
          mentionMap.set(normHandle, label);
          mentionCount++;
          return '@' + label;
        }
      }
      counter++;
      const label = 'Participant ' + counter;
      mentionMap.set(normHandle, label);
      newMentionParticipants++;
      mentionCount++;
      return '@' + label;
    });

    // Final sweep: mask any remaining plain-text occurrence of a known
    // participant's name anywhere else in the message bodies (e.g. someone
    // referred to by name mid-sentence without "@"), so no username is left
    // in the clear anywhere in the text. Longest names first so "John Doe"
    // is masked before a lone "John" would be.
    if(speakerMap.size){
      const namesByLength = [...speakerMap.keys()].sort((a, b) => b.length - a.length);
      for(const name of namesByLength){
        if(!name || /^\+?\d/.test(name)) continue; // phone-number keys handled above
        const label = speakerMap.get(name);
        const esc = name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        result = result.replace(new RegExp('(^|[^A-Za-z0-9_])' + esc + '(?![A-Za-z0-9_])', 'g'), (mm, pre) => pre + label);
      }
    }

    return { text: result, participantCount: speakerMap.size + newMentionParticipants + fullNameMentionMap.size, phoneCount, mentionCount };
  }

  $('#accSetupLink').addEventListener('click', () => {
    if(typeof openTool === 'function') openTool('setup');
  });

  function accFlash(btn, msg){
    const orig = btn.textContent;
    btn.textContent = msg;
    btn.classList.add('acc-copied');
    setTimeout(() => { btn.textContent = orig; btn.classList.remove('acc-copied'); }, 1400);
  }

}


/* ============================================================
   CASE REPORT — second accessory. Takes case input the same way
   Case Bench does (pasted text, a link, or an uploaded PDF/Word/
   text file) and offers exactly two analysis operations:
   Case Summary and Clinical Reasoning in Case.
   ============================================================ */
function renderCaseReport(container){
  const $ = (sel) => container.querySelector(sel);
  const crState = { fileText: '', ops: {} };
  const CR_MAX_UPLOAD_BYTES = 10 * 1024 * 1024;

  const CR_OPS = [
    {
      id: 'summary',
      icon: '&#128221;',
      title: 'Case Summary',
      hint: 'A clear, structured summary of the case report.',
      prompt: (text) => `You are assisting a clinician-educator. Read the case report below and produce a clear, well-organized Case Summary — patient presentation, relevant history, key findings, course, and outcome/plan if present. Use short headers/bullets. Stay strictly grounded in the text; if information is missing, say so rather than inventing detail.\n\n--- CASE REPORT START ---\n${text}\n--- CASE REPORT END ---`
    },
    {
      id: 'reasoning',
      icon: '&#129504;',
      title: 'Clinical Reasoning in Case',
      hint: 'Walks through the diagnostic/management reasoning demonstrated in the case.',
      prompt: (text) => `You are assisting a clinician-educator. Read the case report below and lay out the Clinical Reasoning in the Case — the differential diagnosis considered, the key data points that drove decisions, how the diagnosis/management plan was reached, and any reasoning pitfalls or teaching points. Use short headers/bullets. Stay strictly grounded in the text; if the reasoning isn't explicit, note what can reasonably be inferred versus what's missing.\n\n--- CASE REPORT START ---\n${text}\n--- CASE REPORT END ---`
    }
  ];

  container.innerHTML = `
  <div class="acc-wrap">
    <style>
      .acc-wrap{max-width:900px;}
      .acc-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px 22px;box-shadow:var(--shadow-sm);margin-bottom:16px;}
      .acc-card h3{margin:0 0 4px;font-size:15px;font-weight:700;}
      .acc-sub{color:var(--ink-dim);font-size:12.5px;margin:0 0 14px;}
      .acc-status{font-size:12.5px;color:var(--ink-dim);margin-top:10px;}
      .acc-status.ok{color:var(--good);}
      .acc-status.err{color:var(--alert);}
      .acc-btn{font-family:var(--display);font-weight:600;font-size:12.5px;border:1px solid var(--line);background:var(--panel-sunken);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s,color .12s;}
      .acc-btn:hover{border-color:var(--ember);color:var(--ember-bright);}
      .acc-btn:disabled{opacity:.5;cursor:default;}
      .acc-btn.acc-primary{background:var(--ember);border-color:var(--ember);color:#fff;}
      .acc-btn.acc-primary:hover{background:var(--ember-dim);color:#fff;}
      .acc-btn.acc-speaking{background:var(--ember);border-color:var(--ember);color:#fff;}
      .acc-copied{color:var(--good) !important;border-color:var(--good) !important;}
      .cr-textarea{width:100%;min-height:160px;resize:vertical;line-height:1.5;font-family:var(--display);font-size:13.5px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel-sunken);color:var(--ink);outline:none;}
      .cr-textarea:focus{border-color:var(--ember);}
      .cr-link-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
      .cr-link-row input{flex:1;min-width:220px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel-sunken);color:var(--ink);font-family:var(--display);font-size:13px;outline:none;}
      .cr-link-row input:focus{border-color:var(--ember);}
      .cr-upload-row{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);}
      .cr-upload-row label{font-size:12.5px;color:var(--ink-dim);display:block;margin-bottom:6px;font-weight:500;}
      .acc-ops-head{display:flex;align-items:center;justify-content:space-between;margin:22px 0 10px;}
      .acc-ops-head h2{font-size:15px;margin:0;}
      .acc-hint-note{background:var(--panel-sunken);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:12px;color:var(--ink-dim);margin-bottom:14px;}
      .acc-op{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden;}
      .acc-op-head{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;user-select:none;background:var(--panel);}
      .acc-op-head:hover{background:var(--panel-sunken);}
      .acc-op-icon{font-size:16px;flex:none;}
      .acc-op-title{font-weight:700;font-size:13.5px;flex:1;}
      .acc-op-hint{color:var(--ink-faint);font-size:11.5px;font-weight:400;display:block;margin-top:1px;}
      .acc-op-arrow{font-size:11px;color:var(--ink-faint);transition:transform .15s;flex:none;}
      .acc-op.acc-open .acc-op-arrow{transform:rotate(180deg);}
      .acc-op-body{display:none;padding:0 14px 14px;border-top:1px solid var(--line-soft);}
      .acc-op.acc-open .acc-op-body{display:block;padding-top:12px;}
      .acc-op-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center;}
      .acc-op-out{white-space:pre-wrap;word-break:break-word;background:var(--panel-sunken);border:1px solid var(--line);border-radius:8px;padding:12px;font-size:12.5px;line-height:1.65;max-height:400px;overflow:auto;}
      .acc-empty{color:var(--ink-faint);font-size:13px;}
      .acc-op-err{color:var(--alert);font-size:12.5px;margin-top:6px;}
      .acc-drop{border:2px dashed var(--line);border-radius:10px;padding:22px 16px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s;}
      .acc-drop:hover,.acc-drop.acc-drag{border-color:var(--ember);background:var(--panel-sunken);}
      .acc-drop input{display:none;}
      .acc-drop p{margin:.2rem 0;color:var(--ink-dim);font-size:13px;}
      .acc-drop strong{color:var(--ink);}
      .cr-report-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;}
    </style>

    <div class="acc-card">
      <h3>Case Report</h3>
      <p class="acc-sub">Paste a case report — text, a link, or an uploaded PDF/Word/text file — then run Case Summary or Clinical Reasoning in Case on it.</p>
      <textarea class="cr-textarea" id="crText" placeholder="Paste the case report text here, or paste a link to it below…"></textarea>
      <div class="cr-link-row">
        <input type="text" id="crLink" placeholder="Or paste a link to the case report (best-effort fetch)…">
        <button class="acc-btn" id="crFetchBtn">Fetch from link</button>
      </div>
      <div class="cr-upload-row">
        <label for="crFile">Or upload a case file — PDF, Word (.doc/.docx), or plain text (.txt), max 10MB</label>
        <div class="acc-drop" id="crDrop">
          <input type="file" id="crFile" accept=".pdf,.doc,.docx,.txt,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain">
          <p><strong>Click to choose a file</strong> or drag and drop it here</p>
          <p>PDF, Word (.doc/.docx), or plain text</p>
        </div>
      </div>
      <div class="acc-status" id="crStatus"></div>
      <div class="cr-report-actions">
        <button class="acc-btn" id="crDownloadBtn">Download text</button>
        <button class="acc-btn" id="crSaveHistoryBtn">Save to history</button>
      </div>
    </div>

    <div id="crOpsSection">
      <div class="acc-ops-head"><h2>Case Report Analytics</h2></div>
      <div class="acc-hint-note">These run through whatever model you've configured in <a id="crSetupLink" style="cursor:pointer;font-weight:600;">Setup</a> (Claude / Gemini / ChatGPT / Other). Expand a section and click Generate. <span id="crNoTextNote">Paste or load case text above first — Generate is disabled until then.</span></div>
      <div id="crOpsList"></div>
    </div>
  </div>`;

  const statusEl = $('#crStatus');
  function setCrStatus(msg, kind){
    statusEl.textContent = msg;
    statusEl.className = 'acc-status' + (kind ? ' ' + kind : '');
  }

  function syncCrText(){
    crState.fileText = $('#crText').value.trim();
    crRenderOps();
  }
  $('#crText').addEventListener('input', syncCrText);

  $('#crSetupLink').addEventListener('click', () => {
    if(typeof openTool === 'function') openTool('setup');
  });

  /* ---------- click-to-choose / drag-and-drop wiring for the themed drop-zone ---------- */
  const crDrop = $('#crDrop');
  const crFileInput = $('#crFile');
  crDrop.addEventListener('click', () => crFileInput.click());
  crDrop.addEventListener('dragover', (e) => { e.preventDefault(); crDrop.classList.add('acc-drag'); });
  crDrop.addEventListener('dragleave', () => crDrop.classList.remove('acc-drag'));
  crDrop.addEventListener('drop', (e) => {
    e.preventDefault();
    crDrop.classList.remove('acc-drag');
    if(e.dataTransfer.files && e.dataTransfer.files[0]){
      crFileInput.files = e.dataTransfer.files;
      crFileInput.dispatchEvent(new Event('change'));
    }
  });

  function crBuildExportText(){
    const summaryRec = crState.ops['summary'];
    const summaryText = (summaryRec && summaryRec.output) ? summaryRec.output.trim() : 'Not generated yet — run Case Summary above to include it here.';

    const analyticsBlocks = CR_OPS
      .filter(op => op.id !== 'summary')
      .map(op => {
        const rec = crState.ops[op.id];
        if(!rec || !rec.output) return null;
        return `${op.title}\n${'-'.repeat(op.title.length)}\n${rec.output.trim()}`;
      })
      .filter(Boolean);
    const analyticsText = analyticsBlocks.length ? analyticsBlocks.join('\n\n') : 'No other analytics generated yet.';

    const chatText = crState.fileText || 'No case report loaded.';

    return `CASE SUMMARY\n============\n${summaryText}\n\nANALYTICS OUTPUT\n================\n${analyticsText}\n\nFULL CASE CHAT\n==============\n${chatText}`;
  }

  $('#crDownloadBtn').addEventListener('click', () => {
    if(!crState.fileText){ setCrStatus('Load or paste a case report first.', 'err'); return; }
    const content = window.vrBrandText ? window.vrBrandText(crBuildExportText()) : crBuildExportText();
    const blob = new Blob([content], {type:'text/plain'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'case-report.txt';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    crFlash($('#crDownloadBtn'), 'Downloaded!');
  });

  $('#crSaveHistoryBtn').addEventListener('click', () => {
    if(!crState.fileText){ setCrStatus('Load or paste a case report first.', 'err'); return; }
    saveToHistoryFlash($('#crSaveHistoryBtn'), 'Case Report', crBuildExportText());
  });

  /* ---------- link fetch (best effort — many sites block cross-origin fetches) ---------- */
  $('#crFetchBtn').addEventListener('click', async () => {
    const url = $('#crLink').value.trim();
    if(!url){ setCrStatus('Paste a link first.', 'err'); return; }
    setCrStatus('Fetching…');
    try{
      const res = await fetch(url, {mode:'cors'});
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const html = await res.text();
      const doc = new DOMParser().parseFromString(html, 'text/html');
      doc.querySelectorAll('script,style,nav,header,footer').forEach(el => el.remove());
      const text = (doc.body ? doc.body.innerText : doc.documentElement.innerText || '').replace(/\n{3,}/g,'\n\n').trim();
      if(!text){ throw new Error('No readable text found on that page.'); }
      const existing = $('#crText').value.trim();
      $('#crText').value = existing ? existing + '\n\n' + text : text;
      syncCrText();
      setCrStatus(`Loaded text from ${url}.`, 'ok');
    }catch(err){
      setCrStatus('Could not fetch that link automatically (' + err.message + ') — paste the case report text instead.', 'err');
    }
  });

  /* ---------- file upload (PDF / Word / text) ---------- */
  async function crExtractPdfText(file){
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({data: buf}).promise;
    let out = [];
    for(let i = 1; i <= pdf.numPages; i++){
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      out.push(content.items.map(it => it.str).join(' '));
    }
    return out.join('\n\n').trim();
  }
  async function crExtractDocxText(file){
    const buf = await file.arrayBuffer();
    const result = await mammoth.extractRawText({arrayBuffer: buf});
    return (result.value || '').trim();
  }

  $('#crFile').addEventListener('change', async (e) => {
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    if(file.size > CR_MAX_UPLOAD_BYTES){
      setCrStatus(`"${file.name}" is ${(file.size/1024/1024).toFixed(1)}MB — max allowed is 10MB.`, 'err');
      e.target.value = '';
      return;
    }
    const name = file.name.toLowerCase();
    const isPdf = name.endsWith('.pdf') || file.type === 'application/pdf';
    const isDocx = name.endsWith('.docx') || file.type === 'application/vnd.openxmlformats-officedocument.wordprocessingml.document';
    const isDoc = name.endsWith('.doc') && !isDocx;
    const isTxt = name.endsWith('.txt') || file.type === 'text/plain';

    if(!isPdf && !isDocx && !isDoc && !isTxt){
      setCrStatus('Unsupported file type. Please upload a PDF, Word (.doc/.docx), or .txt file.', 'err');
      e.target.value = '';
      return;
    }
    setCrStatus(`Reading "${file.name}"…`);
    try{
      let text = '';
      if(isPdf){ text = await crExtractPdfText(file); }
      else if(isDocx){ text = await crExtractDocxText(file); }
      else if(isDoc){
        setCrStatus('Legacy .doc files can\'t be parsed in-browser — please save as .docx or .pdf and re-upload.', 'err');
        e.target.value = '';
        return;
      } else { text = await file.text(); }

      if(!text){
        setCrStatus(`Couldn't find any readable text in "${file.name}". Try a different file or paste the case manually.`, 'err');
        e.target.value = '';
        return;
      }
      const existing = $('#crText').value.trim();
      $('#crText').value = existing ? existing + '\n\n' + text : text;
      syncCrText();
      setCrStatus(`Loaded case text from "${file.name}".`, 'ok');
    }catch(err){
      setCrStatus('Could not read that file: ' + err.message, 'err');
    }
  });

  /* ---------- the two analysis ops ---------- */
  function crRenderOps(){
    const list = $('#crOpsList');
    list.innerHTML = CR_OPS.map(op => crOpMarkup(op)).join('');
    CR_OPS.forEach(op => crWireOp(op));
    const noTextNote = $('#crNoTextNote');
    if(noTextNote) noTextNote.style.display = crState.fileText ? 'none' : 'inline';
  }

  function crOpMarkup(op){
    return `
      <div class="acc-op" id="cr-op-${op.id}">
        <div class="acc-op-head" id="cr-op-head-${op.id}">
          <span class="acc-op-icon">${op.icon}</span>
          <span class="acc-op-title">${op.title}<span class="acc-op-hint">${op.hint}</span></span>
          <span class="acc-op-arrow">&#9662;</span>
        </div>
        <div class="acc-op-body">
          <div class="acc-op-actions">
            <button class="acc-btn acc-primary" id="cr-gen-${op.id}"${crState.fileText ? '' : ' disabled'}>Generate</button>
            <button class="acc-btn" id="cr-read-${op.id}" style="display:none;">&#128266; Read aloud</button>
            <button class="acc-btn" id="cr-copy-${op.id}" style="display:none;">Copy to clipboard</button>
            <button class="acc-btn" id="cr-save-${op.id}" style="display:none;">Save to history</button>
          </div>
          <div class="acc-op-out acc-empty" id="cr-out-${op.id}">${(crState.ops[op.id]||{}).output || 'Not generated yet.'}</div>
          <div class="acc-op-err" id="cr-err-${op.id}" style="display:none;"></div>
        </div>
      </div>`;
  }

  let crCurrentReadBtn = null;
  function crStopReading(){
    if('speechSynthesis' in window) window.speechSynthesis.cancel();
    if(crCurrentReadBtn){ crCurrentReadBtn.classList.remove('acc-speaking'); crCurrentReadBtn.innerHTML = '&#128266; Read aloud'; }
    crCurrentReadBtn = null;
  }
  function crToggleRead(btn, text){
    if(!('speechSynthesis' in window)){ alert('Text-to-speech is not supported in this browser.'); return; }
    if(crCurrentReadBtn === btn){ crStopReading(); return; }
    crStopReading();
    if(!text) return;
    const utter = new SpeechSynthesisUtterance(text);
    if(typeof hubApplyPreferredVoice === 'function') hubApplyPreferredVoice(utter);
    utter.onend = crStopReading;
    utter.onerror = crStopReading;
    crCurrentReadBtn = btn;
    btn.classList.add('acc-speaking');
    btn.innerHTML = '&#9209; Stop reading';
    window.speechSynthesis.speak(utter);
  }

  function crWireOp(op){
    const head = $('#cr-op-head-' + op.id);
    const opEl = $('#cr-op-' + op.id);
    head.addEventListener('click', () => opEl.classList.toggle('acc-open'));

    $('#cr-gen-' + op.id).addEventListener('click', async (e) => {
      e.stopPropagation();
      await crRunOp(op);
    });
    $('#cr-copy-' + op.id).addEventListener('click', async (e) => {
      e.stopPropagation();
      const val = (crState.ops[op.id] || {}).output || '';
      try{ await navigator.clipboard.writeText(val); crFlash(e.target, 'Copied!'); }
      catch(err){ crFlash(e.target, 'Copy failed'); }
    });
    $('#cr-save-' + op.id).addEventListener('click', (e) => {
      e.stopPropagation();
      const val = (crState.ops[op.id] || {}).output || '';
      if(!val) return;
      saveToHistoryFlash($('#cr-save-' + op.id), 'Case Report — ' + op.title, val);
    });
    $('#cr-read-' + op.id).addEventListener('click', (e) => {
      e.stopPropagation();
      const val = (crState.ops[op.id] || {}).output || '';
      crToggleRead($('#cr-read-' + op.id), val);
    });
  }

  function crFlash(btn, msg){
    const orig = btn.textContent;
    btn.textContent = msg;
    btn.classList.add('acc-copied');
    setTimeout(() => { btn.textContent = orig; btn.classList.remove('acc-copied'); }, 1400);
  }

  async function crRunOp(op){
    if(!crState.fileText) return;
    const out = $('#cr-out-' + op.id);
    const genBtn = $('#cr-gen-' + op.id);
    const copyBtn = $('#cr-copy-' + op.id);
    const readBtn = $('#cr-read-' + op.id);
    const saveBtn = $('#cr-save-' + op.id);
    const errEl = $('#cr-err-' + op.id);
    errEl.style.display = 'none';

    const keys = loadKeys();
    const provider = hubActiveProvider();
    const apiKey = keys[provider];
    if(!apiKey && !(PROVIDERS[provider] && PROVIDERS[provider].needsEndpoint)){
      errEl.textContent = 'No API key configured yet — add one in Setup first.';
      errEl.style.display = 'block';
      return;
    }

    genBtn.disabled = true;
    out.textContent = 'Generating…';
    out.classList.add('acc-empty');
    copyBtn.style.display = 'none';
    readBtn.style.display = 'none';
    saveBtn.style.display = 'none';

    try{
      const models = loadModels();
      const model = models[provider] || (PROVIDERS[provider] && PROVIDERS[provider].modelPlaceholder);
      const system = 'You are a careful, evidence-grounded clinician-educator assistant. Never fabricate facts not present in the supplied text. Use clear headers/bullets. Be concise but complete.';
      const userPrompt = op.prompt(crState.fileText);
      let reply;
      if(provider === 'claude'){
        reply = await crCallClaude(apiKey, model, system, userPrompt);
      } else if(provider === 'gemini'){
        reply = await crCallGemini(apiKey, model, system, userPrompt);
      } else if(provider === 'other'){
        const endpoints = loadEndpoints();
        reply = await crCallCustom(endpoints['other'], apiKey, model, system, userPrompt);
      } else {
        reply = await crCallOpenAI(apiKey, model, system, userPrompt);
      }
      crState.ops[op.id] = { output: reply };
      out.textContent = reply;
      out.classList.remove('acc-empty');
      copyBtn.style.display = 'inline-block';
      readBtn.style.display = 'inline-block';
      saveBtn.style.display = 'inline-block';
      trackEvent('case_report_generate', { op: op.id, provider });
    }catch(err){
      out.textContent = 'Not generated yet.';
      out.classList.add('acc-empty');
      errEl.textContent = 'Request failed: ' + err.message + ' — check your API key/model in Setup.';
      errEl.style.display = 'block';
    }finally{
      genBtn.disabled = false;
    }
  }

  /* ---------- lightweight provider calls (scoped to Case Report) ---------- */
  async function crCallClaude(apiKey, model, system, userText){
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({ model, max_tokens: 4096, system, messages: [{ role:'user', content:userText }] })
    });
    if(!res.ok){ const t = await res.text(); throw new Error(res.status + ' ' + t.slice(0,200)); }
    const data = await res.json();
    return (data.content||[]).map(b=>b.text||'').join('\n').trim();
  }
  async function crCallGemini(apiKey, model, system, userText){
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(apiKey)}`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ systemInstruction:{parts:[{text:system}]}, contents:[{role:'user', parts:[{text:userText}]}] })
    });
    if(!res.ok){ const t = await res.text(); throw new Error(res.status + ' ' + t.slice(0,200)); }
    const data = await res.json();
    const cand = data.candidates && data.candidates[0];
    const parts = cand && cand.content && cand.content.parts || [];
    return parts.map(p=>p.text||'').join('\n').trim();
  }
  async function crCallCustom(endpoint, apiKey, model, system, userText){
    if(!endpoint) throw new Error('No API endpoint set for this provider.');
    const headers = {'Content-Type':'application/json'};
    if(apiKey) headers['Authorization'] = 'Bearer ' + apiKey;
    const res = await fetch(endpoint, {
      method: 'POST', headers,
      body: JSON.stringify({ model, messages:[{role:'system',content:system},{role:'user',content:userText}], max_tokens:4096 })
    });
    if(!res.ok){ const t = await res.text(); throw new Error(res.status + ' ' + t.slice(0,200)); }
    const data = await res.json();
    if(data.choices && data.choices[0] && data.choices[0].message) return (data.choices[0].message.content||'').trim();
    if(data.message && data.message.content) return data.message.content.trim();
    if(typeof data.content === 'string') return data.content.trim();
    return JSON.stringify(data).slice(0,500);
  }
  async function crCallOpenAI(apiKey, model, system, userText){
    const res = await fetch('https://api.openai.com/v1/chat/completions', {
      method: 'POST',
      headers: {'Content-Type':'application/json','Authorization':'Bearer ' + apiKey},
      body: JSON.stringify({ model, messages:[{role:'system',content:system},{role:'user',content:userText}], max_tokens:4096 })
    });
    if(!res.ok){ const t = await res.text(); throw new Error(res.status + ' ' + t.slice(0,200)); }
    const data = await res.json();
    return (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content || '').trim();
  }

  crRenderOps();
}

/* ---------- History detail: opens the saved record on a template page ---------- */
/* Turns a saved History record's flattened text back into chat-style turns.
   Handles the common formats the tools save in:
     - "Speaker Name:\n...text..."  (Case Bench, Polemos, dialogue-style tools)
     - "[a system note]"            (single-line bracketed system notes)
     - plain paragraphs with no header (single-pass report-style tools) */
function hubParseChatTurns(text){
  const cleaned = (text || '').replace(/\r\n/g, '\n').trim();
  if(!cleaned) return [];
  const blocks = cleaned.split(/\n{2,}/).map(b => b.trim()).filter(Boolean);
  return blocks.map(block => {
    // Whole block wrapped in [ ... ] -> system note
    if(/^\[[\s\S]*\]$/.test(block)){
      return { who: null, body: block.slice(1, -1).trim(), kind: 'system' };
    }
    const lines = block.split('\n');
    const headerMatch = lines[0].match(/^([A-Za-z0-9 '"()/&._-]{1,60}):\s*$/);
    if(headerMatch){
      const who = headerMatch[1].trim();
      const body = lines.slice(1).join('\n').trim();
      const lower = who.toLowerCase();
      let kind = 'assistant';
      if(lower === 'you' || lower === 'user') kind = 'user';
      else if(lower === 'system') kind = 'system';
      return { who, body: body || block, kind };
    }
    return { who: null, body: block, kind: 'assistant' };
  });
}

function hubRenderChatTurns(turns){
  if(!turns.length){
    return `<div style="font-size:13.5px;color:var(--ink-dim);">Nothing to show.</div>`;
  }
  return turns.map(t => {
    const safeBody = (t.body || '').replace(/</g,'&lt;');
    const safeWho = (t.who || '').replace(/</g,'&lt;');
    const whoLine = (t.kind !== 'system' && t.who) ? `<div class="hc-who">${safeWho}</div>` : '';
    return `
      <div class="hc-msg hc-${t.kind}">
        ${whoLine}
        <div class="hc-bubble">${safeBody}</div>
      </div>`;
  }).join('');
}

      const page = await pdf.getPage(i);

      out.push(content.items.map(it => it.str).join(' '));

    const name = file.name.toLowerCase();
    const isPdf = name.endsWith('.pdf') || file.type === 'application/pdf';
    const isDocx = name.endsWith('.docx');
    const isTxt = name.endsWith('.txt') || file.type === 'text/plain';

      setUploadStatus('Unsupported file type. Please upload a PDF, Word (.docx), or .txt file.', 'err');
      e.target.value = ''; return;
    }
    setUploadStatus(`Reading "${file.name}"…`);
    try{
      let text = '';
      if(isPdf) text = await extractPdfText(file);
      else if(isDocx) text = await extractDocxText(file);
      else text = await file.text();
      if(!text){
        setUploadStatus(`Couldn't find any readable text in "${file.name}".`, 'err');
        e.target.value = ''; return;
      }
      const existing = $r('rsCaseText').value.trim();
      $r('rsCaseText').value = existing ? existing + '\n\n' + text : text;
      rsSaveCaseText($r('rsCaseText').value);
      setUploadStatus(`Loaded case text from "${file.name}".`, 'ok');
    } catch(err){
      setUploadStatus('Could not read that file: ' + err.message, 'err');
    } finally { e.target.value = ''; }
  });

  // sample case generation
  function buildSampleCasePrompt(difficulty, specialty){
    let ask = 'Generate one realistic, self-contained clinical vignette for a medical learner to practice diagnostic reasoning on. ';
    if(specialty && specialty !== 'Any') ask += `The case must fall within the specialty of ${specialty}. `;
    if(difficulty && difficulty !== 'Any') ask += `Pitch the case difficulty at the level of: ${difficulty}. `;
    else ask += 'Cover a single adult or pediatric patient presenting with a common or classic presentation (your choice — vary it each time). ';
    ask += 'Include age, sex, presenting complaint, relevant history, and pertinent exam/vital sign findings, and a couple of relevant labs or initial test results if appropriate. Do not reveal or hint at the diagnosis name, and do not include headers, labels, or any framing text — output ONLY the vignette itself as a single flowing paragraph of 4-7 sentences, written the way a case would appear in a textbook.';
    return ask;
  }
  $r('rsSampleCaseBtn').addEventListener('click', async (e) => {
    e.preventDefault();
    const btn = $r('rsSampleCaseBtn');
    const provider = activeProvider();
    const keys = loadKeys(), models = loadModels();
    const apiKey = keys[provider];
    const model = models[provider] || PROVIDERS[provider].modelPlaceholder;
    if(!apiKey && !PROVIDERS[provider].needsEndpoint){
      alert('Add an API key in Setup first, then try again.'); return;
    }
    const difficulty = $r('rsSampleDifficulty').value;
    const specialty = $r('rsSampleSpecialty').value;
    const prompt = buildSampleCasePrompt(difficulty, specialty);
    const original = btn.textContent;
    btn.textContent = 'Generating…'; btn.style.pointerEvents = 'none';
    try{
      const msgs = [{role:'user', content:'Begin.'}];
      let sample;
      if(provider === 'claude') sample = await rsCallClaude(apiKey, model, prompt, msgs);
      else if(provider === 'gemini') sample = await rsCallGemini(apiKey, model, prompt, msgs);
      else if(provider === 'other') sample = await rsCallCustom(loadEndpoints()['other'], apiKey, model, prompt, msgs);
      else sample = await rsCallOpenAI(apiKey, model, prompt, msgs);
      sample = (sample || '').trim();
      if(!sample) throw new Error('Empty response.');
      $r('rsCaseText').value = sample;
      rsSaveCaseText(sample);
    } catch(err){
      alert('Could not generate a sample case: ' + err.message);
    } finally {
      btn.textContent = original; btn.style.pointerEvents = '';
    }
  });

  // activities
  function renderActivities(){
    const wrap = $r('rsActivities');
    wrap.innerHTML = '';
    Object.entries(RS_ACTIVITIES).forEach(([key, a]) => {
      const div = document.createElement('div');
      div.className = 'rs-activity' + (rsState.activity===key ? ' selected' : '');
      div.innerHTML = `<div class="aname">${a.name}</div><div class="adesc">${a.desc}</div>`;
      div.addEventListener('click', () => {
        rsState.activity = key;
        renderActivities();
        startDialogueRun();
      });
      wrap.appendChild(div);
    });
  }
  renderActivities();

  function preflightOk(){
    const caseText = $r('rsCaseText').value.trim();
    if(!caseText){ alert('Paste a case first — Step 1.'); return false; }
    const provider = activeProvider();
    const keys = loadKeys();
    if(!keys[provider] && !PROVIDERS[provider].needsEndpoint){
      alert('Add an API key in Setup first.'); return false;
    }
    if(PROVIDERS[provider].needsEndpoint && !loadEndpoints()[provider]){
      alert('Add an API endpoint URL in Setup first.'); return false;
    }
    return true;
  }

  function openWorkspace(title, sub){
    $r('rsWsTitle').textContent = title;
    $r('rsWsSub').textContent = sub;
    $r('rsTranscript').innerHTML = '';
    $r('rsErrorNote').classList.remove('show');
    $r('rsWorkspace').classList.add('visible');
    $r('rsWorkspace').scrollIntoView({behavior:'smooth', block:'start'});
  }

  function appendMsg(role, text){
    const t = $r('rsTranscript');
    const div = document.createElement('div');
    div.className = 'rs-msg ' + role;
    const provider = activeProvider();
    const who = role==='user' ? 'You' : role==='assistant' ? PROVIDERS[provider].label : 'System';
    if(role === 'assistant'){
      div.innerHTML = `<div class="rs-who-row"><div class="who">${who}</div><button type="button" class="rs-tts-btn" aria-label="Read answer aloud" title="Read aloud">${RS_TTS_ICON}</button></div><div class="bubble"></div>`;
      div.querySelector('.bubble').textContent = text;
      const ttsBtn = div.querySelector('.rs-tts-btn');
      if(rsTtsSupported){
        ttsBtn.addEventListener('click', () => rsToggleSpeak(ttsBtn, text));
      } else {
        ttsBtn.disabled = true;
        ttsBtn.title = "This browser doesn't support text-to-speech";
        ttsBtn.setAttribute('aria-label', "Text-to-speech isn't supported in this browser");
      }
    } else {
      div.innerHTML = `<div class="who">${who}</div><div class="bubble"></div>`;
      div.querySelector('.bubble').textContent = text;
    }
    t.appendChild(div);
    t.scrollTop = t.scrollHeight;
  }
  function appendTyping(){
    const t = $r('rsTranscript');
    const div = document.createElement('div');
    div.className = 'rs-msg assistant';
    div.id = 'rsTypingIndicator';
    const provider = activeProvider();
    div.innerHTML = `<div class="who">${PROVIDERS[provider].label}</div><div class="bubble rs-typing">thinking</div>`;
    t.appendChild(div);
    t.scrollTop = t.scrollHeight;
  }
  function removeTyping(){ const el = $r('rsTypingIndicator'); if(el) el.remove(); }

  function startDialogueRun(){
    if(!preflightOk()){ rsState.activity=null; renderActivities(); return; }
    const caseText = $r('rsCaseText').value.trim();
    const a = RS_ACTIVITIES[rsState.activity];
    rsState.messages = [];
    rsState.systemPrompt = a.systemPrompt(caseText);
    openWorkspace(a.name, a.subtitle);
    appendMsg('system', 'Session started — ' + a.name + '.');
    callModel([]);
  }

  async function callModel(messagesSoFar){
    rsState.running = true;
    $r('rsSendBtn').disabled = true;
    $r('rsErrorNote').classList.remove('show');
    appendTyping();
    const provider = activeProvider();
    const keys = loadKeys(), models = loadModels();
    const apiKey = keys[provider];
    const model = models[provider] || PROVIDERS[provider].modelPlaceholder;
    try{
      let reply;
      if(provider === 'claude') reply = await rsCallClaude(apiKey, model, rsState.systemPrompt, messagesSoFar);
      else if(provider === 'gemini') reply = await rsCallGemini(apiKey, model, rsState.systemPrompt, messagesSoFar);
      else if(provider === 'other') reply = await rsCallCustom(loadEndpoints()['other'], apiKey, model, rsState.systemPrompt, messagesSoFar);
      else reply = await rsCallOpenAI(apiKey, model, rsState.systemPrompt, messagesSoFar);
      removeTyping();
      appendMsg('assistant', reply);
      rsState.messages.push({role:'assistant', content: reply});
    } catch(err){
      removeTyping();
      $r('rsErrorNote').textContent = 'Request failed: ' + err.message + ' — check your API key, model name, and that the provider allows browser requests.';
      $r('rsErrorNote').classList.add('show');
    } finally {
      rsState.running = false;
      $r('rsSendBtn').disabled = false;
    }
  }

  $r('rsSendBtn').addEventListener('click', sendComposer);
  $r('rsComposerInput').addEventListener('keydown', (e) => {
    if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendComposer(); }
  });
  function sendComposer(){
    const val = $r('rsComposerInput').value.trim();
    if(!val || rsState.running) return;
    $r('rsComposerInput').value = '';
    appendMsg('user', val);
    rsState.messages.push({role:'user', content: val});
    callModel(rsState.messages);
  }

  $r('rsResetBtn').addEventListener('click', () => {
    rsStopSpeaking();
    rsState.activity = null;
    rsState.messages = [];
    $r('rsWorkspace').classList.remove('visible');
    renderActivities();
  });

  function buildTranscriptText(){
    const title = $r('rsWsTitle').textContent.trim() || 'Vibe Rounds - Research';
    const sub = $r('rsWsSub').textContent.trim();
    const lines = [title];
    if(sub) lines.push(sub);
    lines.push('Exported: ' + new Date().toLocaleString());
    lines.push('----------------------------------------', '');
    const caseText = $r('rsCaseText') ? $r('rsCaseText').value.trim() : '';
    if(caseText){
      lines.push('CASE:', caseText, '', '----------------------------------------', '');
    }
    const provider = activeProvider();
    rsState.messages.forEach(m => {
      const who = m.role === 'user' ? 'You' : PROVIDERS[provider].label;
      lines.push(who + ':', m.content, '');
    });
    return lines.join('\n');
  }
  function flashBtn(btn, msg){
    const original = btn.textContent;
    btn.textContent = msg; btn.disabled = true;
    setTimeout(() => { btn.textContent = original; btn.disabled = false; }, 1400);
  }
  $r('rsCopyBtn').addEventListener('click', async () => {
    const text = buildTranscriptText();
    try{ await navigator.clipboard.writeText(text); flashBtn($r('rsCopyBtn'), 'Copied!'); }
    catch(err){ flashBtn($r('rsCopyBtn'), 'Copy failed'); }
  });
  $r('rsDownloadBtn').addEventListener('click', () => {
    const text = window.vrBrandText ? window.vrBrandText(buildTranscriptText()) : buildTranscriptText();
    const blob = new Blob([text], {type:'text/plain;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
    a.href = url; a.download = 'research-transcript-' + stamp + '.txt';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    flashBtn($r('rsDownloadBtn'), 'Downloaded!');
  });

  $r('rsContributeBtn').addEventListener('click', async () => {
    const btn = $r('rsContributeBtn');
    const statusEl = $r('rsContributeStatus');
    statusEl.className = 'rs-contribute-status'; statusEl.textContent = '';
    if(!rsState.messages || !rsState.messages.length){
      statusEl.textContent = 'Nothing to submit yet — start a session first.';
      statusEl.classList.add('err'); return;
    }
    btn.disabled = true; btn.textContent = 'Submitting…';
    const provider = activeProvider();
    const payload = { transcript: buildTranscriptText(), runKind:'dialogue', provider: provider, submittedAt: new Date().toISOString() };
    try{
      await fetch(CONTRIBUTE_ENDPOINT, {
        method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(payload)
      });
      statusEl.textContent = 'Thank you — your session was submitted anonymously.';
      statusEl.classList.add('ok');
    } catch(err){
      statusEl.textContent = 'Submission failed. Please try again later.';
      statusEl.classList.add('err');
    } finally {
      btn.disabled = false; btn.textContent = 'Submit';
    }
  });
}

/* ---------- provider API calls (Research module) ---------- */
async function rsCallClaude(apiKey, model, system, msgs){
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body: JSON.stringify({ model, max_tokens:4096, system, messages: msgs.length ? msgs.map(m=>({role:m.role, content:m.content})) : [{role:'user', content:'Begin.'}] })
  });
  if(!res.ok){ const t = await res.text(); throw new Error(res.status + ' ' + t.slice(0,200)); }
  const data = await res.json();
  return (data.content||[]).map(b=>b.text||'').join('\n').trim();
}
async function rsCallGemini(apiKey, model, system, msgs){
  const contents = (msgs.length ? msgs : [{role:'user', content:'Begin.'}]).map(m => ({ role: m.role==='assistant' ? 'model' : 'user', parts:[{text:m.content}] }));
  const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(apiKey)}`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ systemInstruction:{parts:[{text:system}]}, contents })
  });
  if(!res.ok){ const t = await res.text(); throw new Error(res.status + ' ' + t.slice(0,200)); }
  const data = await res.json();
  const cand = data.candidates && data.candidates[0];
  const parts = cand && cand.content && cand.content.parts || [];
  return parts.map(p=>p.text||'').join('\n').trim();
}
async function rsCallCustom(endpoint, apiKey, model, system, msgs){
  if(!endpoint) throw new Error('No API endpoint set for this provider.');
  const messages = [{role:'system', content:system}].concat(msgs.length ? msgs : [{role:'user', content:'Begin.'}]);
  const headers = {'Content-Type':'application/json'};
  if(apiKey) headers['Authorization'] = 'Bearer ' + apiKey;
  const res = await fetch(endpoint, { method:'POST', headers, body: JSON.stringify({ model, messages, max_tokens:4096 }) });
  if(!res.ok){ const t = await res.text(); throw new Error(res.status + ' ' + t.slice(0,200)); }
  const data = await res.json();
  if(data.choices && data.choices[0] && data.choices[0].message) return (data.choices[0].message.content || '').trim();
  if(data.message && data.message.content) return data.message.content.trim();
  if(typeof data.content === 'string') return data.content.trim();
  return JSON.stringify(data).slice(0,500);
}
async function rsCallOpenAI(apiKey, model, system, msgs){
  const messages = [{role:'system', content:system}].concat(msgs.length ? msgs : [{role:'user', content:'Begin.'}]);
  const res = await fetch('https://api.openai.com/v1/chat/completions', {
    method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer ' + apiKey},
    body: JSON.stringify({ model, messages, max_tokens:4096 })
  });
  if(!res.ok){ const t = await res.text(); throw new Error(res.status + ' ' + t.slice(0,200)); }
  const data = await res.json();
  return (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content || '').trim();
}

function genPrompt(num, name, desc, slug){
  return (c) => `Run CCOS Module #${num} — "${name}" — on this case:\n\n${c}\n\nTask: ${desc} Produce a single structured, well-organized report addressing this task directly against the case details above — do not restate the case, and do not end with a question to the reader. This is a single-pass output, not a dialogue. (Full module specification: https://avi33tbtt.github.io/Prompts/${slug}.html)`;
}

    prompt: CCOS_TAILORED_PROMPTS[m.num] || genPrompt(m.num, m.name, m.desc, m.slug)
  };
});

function buildSampleCasePrompt(difficulty, specialty){
  let ask = 'Generate one realistic, self-contained clinical vignette for a medical learner to practice diagnostic reasoning on. ';
  if(specialty && specialty !== 'Any'){
    ask += `The case must fall within the specialty of ${specialty}. `;
  }
  if(difficulty && difficulty !== 'Any'){
    ask += `Pitch the case difficulty at the level of: ${difficulty}. `;
  } else {
    ask += 'Cover a single adult or pediatric patient presenting with a common or classic presentation (your choice — vary it each time). ';
  }
  ask += 'Include age, sex, presenting complaint, relevant history, and pertinent exam/vital sign findings, and a couple of relevant labs or initial test results if appropriate. Do not reveal or hint at the diagnosis name, and do not include headers, labels, or any framing text — output ONLY the vignette itself as a single flowing paragraph of 4-7 sentences, written the way a case would appear in a textbook.';
  return ask;
}

const MAX_UPLOAD_BYTES = 10 * 1024 * 1024; // 10MB
if(typeof pdfjsLib !== 'undefined'){
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}

function setUploadStatus(msg, kind){
  const el = $('uploadStatus');
  el.textContent = msg;
  el.className = 'hint' + (kind ? ' ' + kind : '');
}

async function extractPdfText(file){
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data: buf}).promise;
  let out = [];
  for(let i = 1; i <= pdf.numPages; i++){
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    out.push(content.items.map(it => it.str).join(' '));
  }
  return out.join('\n\n').trim();
}

async function extractDocxText(file){
  const buf = await file.arrayBuffer();
  const result = await mammoth.extractRawText({arrayBuffer: buf});
  return (result.value || '').trim();
}

function extractTxtText(file){
  return file.text();
}

$('caseFile').addEventListener('change', async (e)=>{
  const file = e.target.files && e.target.files[0];
  if(!file) return;

  if(file.size > MAX_UPLOAD_BYTES){
    setUploadStatus(`"${file.name}" is ${(file.size/1024/1024).toFixed(1)}MB — max allowed is 10MB.`, 'err');
    e.target.value = '';
    return;
  }

  const name = file.name.toLowerCase();
  const isPdf = name.endsWith('.pdf') || file.type === 'application/pdf';
  const isDocx = name.endsWith('.docx') || file.type === 'application/vnd.openxmlformats-officedocument.wordprocessingml.document';
  const isDoc = name.endsWith('.doc') && !isDocx;
  const isTxt = name.endsWith('.txt') || file.type === 'text/plain';

  if(!isPdf && !isDocx && !isDoc && !isTxt){
    setUploadStatus('Unsupported file type. Please upload a PDF, Word (.doc/.docx), or .txt file.', 'err');
    e.target.value = '';
    return;
  }

  setUploadStatus(`Reading "${file.name}"…`);

  try{
    let text = '';
    if(isPdf){
      text = await extractPdfText(file);
    } else if(isDocx){
      text = await extractDocxText(file);
    } else if(isDoc){
      setUploadStatus('Legacy .doc files can\'t be parsed in-browser — please save as .docx or .pdf and re-upload.', 'err');
      e.target.value = '';
      return;
    } else {
      text = await extractTxtText(file);
    }

    if(!text){
      setUploadStatus(`Couldn't find any readable text in "${file.name}". Try a different file or paste the case manually.`, 'err');
      e.target.value = '';
      return;
    }

    const existing = $('caseText').value.trim();
    $('caseText').value = existing ? existing + '\n\n' + text : text;
    saveCaseText($('caseText').value);
    setUploadStatus(`Loaded case text from "${file.name}".`, 'ok');
    trackEvent('upload_case_file', {fileType: isPdf ? 'pdf' : (isDocx ? 'docx' : 'txt')});
  } catch(err){
    setUploadStatus('Could not read that file: ' + err.message, 'err');
  } finally {
    e.target.value = '';
  }
});

/* ---------- run lifecycle: pipeline (sequential multi-module) ---------- */
async function startPipelineRun(){
  if(!state.pipelineSelection.length) return;
  if(!preflightOk()) return;
  const caseText = $('caseText').value.trim();
  const names = state.pipelineSelection.map(k=>ALL_MODULES[k].name).join(' → ');
  const total = state.pipelineSelection.length;
  state.messages = [];
  state.runKind = 'pipeline';
  state.systemPrompt = 'You are running one stage of a multi-stage clinical reasoning pipeline. Each stage builds on the case and on the outputs of prior stages, which will be provided. Respond with a single structured, well-organized report for THIS stage only. Do not end with a question to the reader.';

  openWorkspace('Pipeline', names);
  appendMsg('system', 'Running pipeline: ' + names);
  trackEvent('run_pipeline', {stages: total, provider: state.provider});
  showProgress(0, total, 'Starting…');

  let priorOutput = '';
  for(let i=0;i<total;i++){
    const key = state.pipelineSelection[i];
    const m = ALL_MODULES[key];
    appendMsg('system', `Stage ${i+1} of ${total} — ${m.name}`);
    showProgress(i, total, `Stage ${i+1} of ${total} — ${m.name}`);
    const stagePrompt = m.prompt(caseText) + (priorOutput ? `\n\nPrior stage output so far, for context (do not repeat it, build on it):\n\n${priorOutput}` : '');
    state.running = true;
    $('sendBtn').disabled = true;
    $('runPipelineBtn') && ($('runPipelineBtn').disabled = true);
    appendTyping();
    try{
      const keys = loadKeys();
      const models = loadModels();
      const apiKey = keys[state.provider];
      const model = models[state.provider] || PROVIDERS[state.provider].modelPlaceholder;
      let reply;
      const stageMsgs = [{role:'user', content: stagePrompt}];
      if(state.provider === 'claude') reply = await callClaude(apiKey, model, state.systemPrompt, stageMsgs);
      else if(state.provider === 'gemini') reply = await callGemini(apiKey, model, state.systemPrompt, stageMsgs);
      else reply = await callOpenAI(apiKey, model, state.systemPrompt, stageMsgs);
      removeTyping();
      appendMsg('assistant', `[${m.name}]\n\n` + reply);
      // Keep full stage history in state.messages so follow-up questions (and transcript
      // export) have the actual pipeline context, not just the completion system prompt.
      state.messages.push({role:'user', content: stagePrompt, auto:true});
      state.messages.push({role:'assistant', content: `[${m.name}]\n\n${reply}`});
      priorOutput += `\n\n### ${m.name}\n${reply}`;
      showProgress(i+1, total, `Stage ${i+1} of ${total} complete`);
    } catch(err){
      removeTyping();
      $('errorNote').textContent = 'Pipeline stopped at stage ' + (i+1) + ' (' + m.name + '): ' + err.message;
      $('errorNote').classList.add('show');
      showProgress(i, total, `Stopped at stage ${i+1}`);
      break;
    }
  }
  state.running = false;
  $('sendBtn').disabled = false;
  $('runPipelineBtn') && ($('runPipelineBtn').disabled = false);
  state.systemPrompt = 'The pipeline above has completed. Answer any follow-up questions about the case or the combined findings above, grounded in what was already produced.';
  hideProgressSoon();
}

function setBtnSpeaking(btn, speaking){
  btn.classList.toggle('speaking', speaking);
  btn.title = speaking ? 'Stop reading' : 'Read aloud';
  btn.setAttribute('aria-label', speaking ? 'Stop reading answer aloud' : 'Read answer aloud');

function cleanTextForSpeech(raw){
  // Pipeline replies are stored as "[Stage Name]\n\n<content>" — that label is
  // already shown visually, so skip it here rather than reading it aloud.
  const staged = raw.match(/^\[[^\]]+\]\n+([\s\S]*)$/);
  const body = staged ? staged[1] : raw;
  return body
    .replace(/```[\s\S]*?```/g, ' ')
    .replace(/`([^`]+)`/g, '$1')
    .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')
    .replace(/^#{1,6}\s+/gm, '')
    .replace(/\*\*([^*]+)\*\*/g, '$1')
    .replace(/__([^_]+)__/g, '$1')
    .replace(/\*([^*]+)\*/g, '$1')
    .replace(/^\s*[-*+]\s+/gm, '')
    .replace(/\n{2,}/g, '. ')
    .replace(/\s+/g, ' ')
    .trim();
}
function stopSpeaking(){
  if(!ttsSupported) return;
  window.speechSynthesis.cancel();
  if(ttsActiveBtn) setBtnSpeaking(ttsActiveBtn, false);
  ttsActiveBtn = null;
}
function toggleSpeak(btn, rawText){
  const wasThisOne = (ttsActiveBtn === btn);
  stopSpeaking();
  if(wasThisOne) return; // clicking the already-speaking button just stops it
  const spoken = cleanTextForSpeech(rawText);
  if(!spoken) return;
  const utter = new SpeechSynthesisUtterance(spoken);
  hubApplyPreferredVoice(utter);
  const reset = ()=>{ if(ttsActiveBtn===btn) ttsActiveBtn=null; setBtnSpeaking(btn, false); };
  utter.onend = reset;
  utter.onerror = reset;
  setBtnSpeaking(btn, true);
  ttsActiveBtn = btn;
  trackEvent('tts_play', {runKind: state.runKind, provider: state.provider});
  window.speechSynthesis.speak(utter);
}

/* ---------- transcript rendering ---------- */
function appendMsg(role, text){
  const t = $('transcript');
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  const who = role==='user' ? 'You' : role==='assistant' ? PROVIDERS[state.provider].label : 'System';
  if(role === 'assistant'){
    div.innerHTML = `<div class="who-row"><div class="who">${who}</div><button type="button" class="tts-btn" aria-label="Read answer aloud" title="Read aloud">${TTS_ICON}</button></div><div class="bubble"></div>`;
    div.querySelector('.bubble').textContent = text;
    const ttsBtn = div.querySelector('.tts-btn');
    if(ttsSupported){
      ttsBtn.addEventListener('click', ()=> toggleSpeak(ttsBtn, text));
    } else {
      ttsBtn.disabled = true;
      ttsBtn.title = "This browser doesn't support text-to-speech";
      ttsBtn.setAttribute('aria-label', "Text-to-speech isn't supported in this browser");
    }
  } else {
    div.innerHTML = `<div class="who">${who}</div><div class="bubble"></div>`;
    div.querySelector('.bubble').textContent = text;
  }
  t.appendChild(div);
  t.scrollTop = t.scrollHeight;
  return div;
}
function appendTyping(){
  const t = $('transcript');

  div.className = 'msg assistant';
  div.id = 'typingIndicator';

/* ---------- collapsible sections: persisted state + smart default ---------- */
function applyCollapsed(sectionId, collapsed){
  const label = $('label-' + sectionId);
  const card = $('card-' + sectionId);

  label.classList.toggle('collapsed', collapsed);
  card.classList.toggle('collapsed', collapsed);
}
function setupCollapsible(sectionId){
  const label = $('label-' + sectionId);
  const card = $('card-' + sectionId);
  if(!label || !card) return;
  label.addEventListener('click', ()=>{
    const collapsed = !card.classList.contains('collapsed');
    applyCollapsed(sectionId, collapsed);
    const saved = loadCollapseState();
    saved[sectionId] = collapsed;
    saveCollapseState(saved);
  });
}
function initCollapsibleSections(){
  const saved = loadCollapseState();
  // Smart default: if the user hasn't explicitly chosen, auto-collapse Model once a key
  // is already saved for the current provider (nothing to fill in, so get it out of the way).
  applyCollapsed('model', saved.hasOwnProperty('model') ? saved.model : true);
  applyCollapsed('case', saved.hasOwnProperty('case') ? saved.case : true);
  setupCollapsible('model');
  setupCollapsible('case');
}

/* ---------- transcript export ---------- */
function buildTranscriptText(){
  const title = $('wsTitle') ? $('wsTitle').textContent.trim() : 'Vibe Rounds - Case Bench';
  const sub = $('wsSub') ? $('wsSub').textContent.trim() : '';
  const isReport = state.runKind === 'analytics' || state.runKind === 'pipeline';
  const lines = [];
  lines.push(isReport ? '# ' + title : title);
  if(sub) lines.push(sub);
  lines.push('Exported: ' + new Date().toLocaleString());
  lines.push('----------------------------------------');
  lines.push('');
  const caseText = $('caseText') ? $('caseText').value.trim() : '';
  if(caseText){
    lines.push(isReport ? '## Case' : 'CASE:');
    lines.push(caseText);
    lines.push('');
    lines.push('----------------------------------------');
    lines.push('');
  }
  state.messages.forEach(m=>{
    if(m.auto) return; // skip internal module/stage prompts — not useful in an export
    if(isReport && m.role === 'assistant'){
      // Pipeline replies are stored as "[Stage Name]\n\n<content>" — surface the stage
      // name as a markdown header instead of a chat bubble label.
      const staged = m.content.match(/^\[(.+?)\]\n\n([\s\S]*)$/);
      if(staged){
        lines.push('## ' + staged[1]);
        lines.push(staged[2]);
      } else {
        lines.push(m.content);
      }
      lines.push('');
    } else {
      const who = m.role === 'user' ? 'You' : (PROVIDERS[state.provider] ? PROVIDERS[state.provider].label : 'Assistant');
      lines.push(who + ':');
      lines.push(m.content);
      lines.push('');
    }
  });
  return lines.join('\n');
}
function flashBtn(btn, msg){
  const original = btn.textContent;
  btn.textContent = msg;
  btn.disabled = true;
  setTimeout(()=>{ btn.textContent = original; btn.disabled = false; }, 1400);
}
$('copyTranscriptBtn').addEventListener('click', async ()=>{
  const text = buildTranscriptText();
  const btn = $('copyTranscriptBtn');
  try{
    await navigator.clipboard.writeText(text);
    trackEvent('copy_transcript', {runKind: state.runKind});
    flashBtn(btn, 'Copied!');
  }catch(err){
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand('copy'); flashBtn(btn, 'Copied!'); }
    catch(e){ flashBtn(btn, 'Copy failed'); }
    document.body.removeChild(ta);
  }
});
$('downloadTranscriptBtn').addEventListener('click', ()=>{
  const text = window.vrBrandText ? window.vrBrandText(buildTranscriptText()) : buildTranscriptText();
  const blob = new Blob([text], {type:'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
  a.href = url;
  a.download = 'case-bench-transcript-' + stamp + '.txt';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  trackEvent('download_transcript', {runKind: state.runKind});
  flashBtn($('downloadTranscriptBtn'), 'Downloaded!');
});

/* ---------- model dispatch ---------- */
async function callModel(messagesSoFar){
  state.running = true;
  $('sendBtn').disabled = true;
  $('errorNote').classList.remove('show');
  appendTyping();

  const keys = loadKeys();
  const models = loadModels();
  const apiKey = keys[state.provider];
  const model = models[state.provider] || PROVIDERS[state.provider].modelPlaceholder;

  try{
    let reply;
    if(state.provider === 'claude'){
      reply = await callClaude(apiKey, model, state.systemPrompt, messagesSoFar);
    } else if(state.provider === 'gemini'){
      reply = await callGemini(apiKey, model, state.systemPrompt, messagesSoFar);
    } else if(state.provider === 'other'){
      const endpoints = loadEndpoints();
      reply = await callCustom(endpoints['other'], apiKey, model, state.systemPrompt, messagesSoFar);
    } else {
      reply = await callOpenAI(apiKey, model, state.systemPrompt, messagesSoFar);
    }
    removeTyping();
    appendMsg('assistant', reply);
    state.messages.push({role:'assistant', content: reply});
  } catch(err){
    removeTyping();
    $('errorNote').textContent = 'Request failed: ' + err.message + ' — check your API key, model name, and that the provider allows browser requests.';
    $('errorNote').classList.add('show');
  } finally {
    state.running = false;
    $('sendBtn').disabled = false;
  }
}

/* ---------- provider API calls ---------- */
async function callClaude(apiKey, model, system, msgs){
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: model,
      max_tokens: 4096,
      system: system,
      messages: msgs.length ? msgs.map(m=>({role:m.role, content:m.content})) : [{role:'user', content:'Begin.'}]
    })
  });
  if(!res.ok){
    const t = await res.text();
    throw new Error(res.status + ' ' + t.slice(0,200));
  }
  const data = await res.json();
  return (data.content||[]).map(b=>b.text||'').join('\n').trim();
}

async function callGemini(apiKey, model, system, msgs){
  const contents = (msgs.length ? msgs : [{role:'user', content:'Begin.'}]).map(m=>({
    role: m.role === 'assistant' ? 'model' : 'user',
    parts: [{text: m.content}]
  }));
  const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(apiKey)}`, {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({
      systemInstruction: {parts: [{text: system}]},
      contents: contents
    })
  });
  if(!res.ok){
    const t = await res.text();
    throw new Error(res.status + ' ' + t.slice(0,200));
  }
  const data = await res.json();
  const cand = data.candidates && data.candidates[0];
  const parts = cand && cand.content && cand.content.parts || [];
  return parts.map(p=>p.text||'').join('\n').trim();
}

async function callCustom(endpoint, apiKey, model, system, msgs){
  if(!endpoint) throw new Error('No API endpoint set for this provider.');
  const messages = [{role:'system', content: system}].concat(
    (msgs.length ? msgs : [{role:'user', content:'Begin.'}])
  );
  const headers = {'Content-Type': 'application/json'};
  if(apiKey) headers['Authorization'] = 'Bearer ' + apiKey;
  const res = await fetch(endpoint, {
    method: 'POST',
    headers: headers,
    body: JSON.stringify({
      model: model,
      messages: messages,
      max_tokens: 4096
    })
  });
  if(!res.ok){
    const t = await res.text();
    throw new Error(res.status + ' ' + t.slice(0,200));
  }
  const data = await res.json();
  // Most OpenAI-compatible APIs return this shape; fall back to a couple of
  // other common shapes (Ollama's /api/chat, bare "content" field) just in case.
  if(data.choices && data.choices[0] && data.choices[0].message){
    return (data.choices[0].message.content || '').trim();
  }
  if(data.message && data.message.content) return data.message.content.trim();
  if(typeof data.content === 'string') return data.content.trim();
  return JSON.stringify(data).slice(0,500);
}

async function callOpenAI(apiKey, model, system, msgs){
  const messages = [{role:'system', content: system}].concat(
    (msgs.length ? msgs : [{role:'user', content:'Begin.'}])
  );
  const res = await fetch('https://api.openai.com/v1/chat/completions', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + apiKey
    },
    body: JSON.stringify({
      model: model,
      messages: messages,
      max_tokens: 4096
    })
  });
  if(!res.ok){
    const t = await res.text();
    throw new Error(res.status + ' ' + t.slice(0,200));
  }
  const data = await res.json();
  return (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content || '').trim();
}

}

const MAX_UPLOAD_BYTES = 10 * 1024 * 1024; // 10MB
if(typeof pdfjsLib !== 'undefined'){
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}
function setUploadStatus(msg, kind){
  const el = document.getElementById('uploadStatus');
  el.textContent = msg;
  el.className = 'hint' + (kind ? ' ' + kind : '');
}
async function extractPdfText(file){
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data: buf}).promise;
  let out = [];
  for(let i = 1; i <= pdf.numPages; i++){
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    out.push(content.items.map(it => it.str).join(' '));
  }
  return out.join('\n\n').trim();
}
async function extractDocxText(file){
  const buf = await file.arrayBuffer();
  const result = await mammoth.extractRawText({arrayBuffer: buf});
  return (result.value || '').trim();
}
function extractTxtText(file){
  return file.text();
}
document.getElementById('caseFile').addEventListener('change', async (e)=>{
  const file = e.target.files && e.target.files[0];
  if(!file) return;

  if(file.size > MAX_UPLOAD_BYTES){
    setUploadStatus(`"${file.name}" is ${(file.size/1024/1024).toFixed(1)}MB — max allowed is 10MB.`, 'err');
    e.target.value = '';
    return;
  }

  const name = file.name.toLowerCase();
  const isPdf = name.endsWith('.pdf') || file.type === 'application/pdf';
  const isDocx = name.endsWith('.docx') || file.type === 'application/vnd.openxmlformats-officedocument.wordprocessingml.document';
  const isDoc = name.endsWith('.doc') && !isDocx;
  const isTxt = name.endsWith('.txt') || file.type === 'text/plain';

  if(!isPdf && !isDocx && !isDoc && !isTxt){
    setUploadStatus('Unsupported file type. Please upload a PDF, Word (.doc/.docx), or .txt file.', 'err');
    e.target.value = '';
    return;
  }

  setUploadStatus(`Reading "${file.name}"…`);

  try{
    let text = '';
    if(isPdf){
      text = await extractPdfText(file);
    } else if(isDocx){
      text = await extractDocxText(file);
    } else if(isDoc){
      setUploadStatus('Legacy .doc files can\'t be parsed in-browser — please save as .docx or .pdf and re-upload.', 'err');
      e.target.value = '';
      return;
    } else {
      text = await extractTxtText(file);
    }

    if(!text){
      setUploadStatus(`Couldn't find any readable text in "${file.name}". Try a different file or paste the case manually.`, 'err');
      e.target.value = '';
      return;
    }

    const existing = caseTextEl.value.trim();
    caseTextEl.value = existing ? existing + '\n\n' + text : text;
    saveStoredCase(caseTextEl.value);
    updateCaseModeUI();
    refreshStart();
    setUploadStatus(`Loaded case text from "${file.name}".`, 'ok');
    if(typeof gtag==='function') gtag('event','upload_case_file', {fileType: isPdf ? 'pdf' : (isDocx ? 'docx' : 'txt')});
  } catch(err){
    setUploadStatus('Could not read that file: ' + err.message, 'err');
  } finally {
    e.target.value = '';
  }
});

const SYSTEM_PROMPT_BASE = (specialty, setting, difficulty, caseSeed) => `You are the simulation engine for "Vibe Rounds Case Simulator," a clinical-reasoning training tool for medical learners. You play the roles of patient, nurse, and diagnostic results, and you track structured case state.

Case parameters:
- Specialty focus: ${specialty || 'Not specified — infer an appropriate specialty from the supplied case'}
- Setting: ${setting}
- Difficulty: ${difficulty}
${caseSeed ? `\nThe learner has supplied their own case material to run (this may be a full vignette, a topic/theme to build a case around, a link, or notes extracted from an uploaded file). Treat it as authoritative source material:\n"""\n${caseSeed}\n"""\n` : ''}
Rules:
- This is a simulation for educational reasoning practice only, never real patient care. Never break character to give real-world medical advice.
- On the FIRST turn (when the user message is exactly "__BEGIN__"):${caseSeed
    ? ` build the opening scenario from the supplied case material above. If it is already a full vignette, adapt it faithfully (you may lightly fill small gaps like initial vitals only if needed for the simulation to run, without contradicting anything given). If it is a topic, theme, or a link's context rather than a full vignette, invent a plausible, internally consistent case that fits that topic at the requested specialty/setting/difficulty. Do not reveal the diagnosis. Present the opening scenario as "message" and populate an initial differential and initial vitals.`
    : ` invent a plausible, internally consistent case (chief complaint, brief history, initial vitals) appropriate to the specialty/setting/difficulty, and present the opening scenario as "message". Do not reveal the diagnosis. Also populate an initial differential and initial vitals.`}
- On every subsequent turn, respond to the learner's action (a question to the patient, an exam maneuver, an ordered test, or a management step) with what would realistically happen or be found, advancing the case coherently. Reveal new labs/vitals/exam findings only when the learner's action would elicit them.
- Keep the underlying case internally consistent turn to turn (same past history, same true diagnosis, same values already given).
- Continuously update: vitals (only include vitals that exist/are known so far), labs (append newly resulted labs; do not repeat old ones already sent unless they change), a cumulative SOAP note (subjective/objective/assessment/plan, each as a short running paragraph reflecting everything known so far), a ranked differential list (most to least likely, 3-6 items, each with a few-word rationale), and any NEW clinical pearls worth surfacing this turn (short, specific, non-repeating; can be empty array most turns).
- Mark caseStatus "complete" only once the learner has committed to a final diagnosis and management plan and you have delivered a brief closing debrief; otherwise "ongoing".
- Respond ONLY with a single valid JSON object, no markdown fences, no prose outside the JSON, matching exactly this shape:
{"message": "string, what the patient/environment says or shows this turn, 1-6 sentences",
 "vitals": {"HR": "string or omit key", "BP": "string or omit key", "RR": "string or omit key", "Temp": "string or omit key", "SpO2": "string or omit key"},
 "labs": [{"name":"string","value":"string","flag":"high|low|normal"}],
 "soap": {"s":"string","o":"string","a":"string","p":"string"},
 "differential": ["ranked item 1 with brief rationale", "..."],
 "newPearls": ["string", "..."],
 "caseStatus": "ongoing" or "complete"}
Only include lab/vital entries that are newly known or updated; omit unknown fields rather than inventing placeholders.`;

function currentSystemPrompt(){
